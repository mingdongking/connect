                          <div>
                            <div className="text-[10px] text-slate-500">근처 노드</div>
                            <div className="text-[12px] font-semibold text-slate-900 truncate">{nn?(nn.n.label+" ("+nn.n.id+")"):"-"}</div>
                          </div>
                        </div>
                      </div>
                    );
                  })()}
                  {/* 작업 현황 (정상 로봇만 표시 — down 로봇은 오류 조치의 중단 오더와 중복) */}
                  {sel.st!=="down"&&(()=>{
                    const runOrder=initOrders.find(o=>o.robotId===sel.id&&o.status==="running")
                      ||{id:(sel.task||("WORK-"+sel.id)),recipeId:sel.recipe||"",start:540,status:"running"};
                    const runRecipe=runOrder?recipes.find(r=>r.id===runOrder.recipeId):null;
                    const otherOrders=initOrders.filter(o=>o.robotId===sel.id&&o.status!=="running").slice(0,4);
                    const reqArr=["USR-019","USR-042","USR-007"];
                    // 모든 로봇 공통 형식 — recipe steps 없으면 fleet별 다양한 예시 step 사용
                    const STEP_TEMPLATES={
                      amr:[
                        {nodeId:"B001",slots:[{actionType:"ASSIGN"}]},
                        {nodeId:"B003",slots:[{actionType:"MOVE"}]},
                        {nodeId:"B003",slots:[{actionType:"LOAD"}]},
                        {nodeId:"B006",slots:[{actionType:"MOVE"}]},
                        {nodeId:"B006",slots:[{actionType:"UNLOAD"}]},
                      ],
                      agv:[
                        {nodeId:"B001",slots:[{actionType:"ASSIGN"}]},
                        {nodeId:"B002",slots:[{actionType:"LIFT"}]},
                        {nodeId:"B004",slots:[{actionType:"MOVE"}]},
                        {nodeId:"B005",slots:[{actionType:"DOCK"}]},
                      ],
                      arm:[
                        {nodeId:"B004",slots:[{actionType:"ASSIGN"}]},
                        {nodeId:"B004",slots:[{actionType:"GRIP"}]},
                        {nodeId:"B007",slots:[{actionType:"UNLOAD"}]},
                      ],
                      semi:[
                        {nodeId:"B001",slots:[{actionType:"ASSIGN"}]},
                        {nodeId:"B002",slots:[{actionType:"SCAN"}]},
                        {nodeId:"B003",slots:[{actionType:"LOAD"}]},
                        {nodeId:"B005",slots:[{actionType:"MOVE"}]},
                      ],
                      pm:[
                        {nodeId:"B003",slots:[{actionType:"MOVE"}]},
                        {nodeId:"B003",slots:[{actionType:"SCAN"}]},
                        {nodeId:"B005",slots:[{actionType:"SCAN"}]},
                        {nodeId:"B005",slots:[{actionType:"DOCK"}]},
                      ],
                    };
                    const stepsToShow=(runRecipe&&runRecipe.steps&&runRecipe.steps.length)?runRecipe.steps:(STEP_TEMPLATES[sel.fleet]||STEP_TEMPLATES.amr);
                    const orderName=(runRecipe&&runRecipe.name)||sel.recipe||runOrder.recipeId||"작업";
                    return(
                      <div className="rounded-md border border-slate-200 overflow-hidden">
                        <div className="px-2.5 py-2 border-b border-slate-200"><div className="text-[12px] font-semibold text-slate-900">작업 현황</div></div>
                        {runOrder?(
                          <div className="p-2.5 border-b border-slate-100">
                            <div className="flex items-center gap-2">
                              <div className="w-6 h-6 rounded bg-blue-50 grid place-items-center shrink-0">
                                <Icon name="ClipboardList" size={12} className="text-blue-600"/>
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="text-[12px] font-semibold text-slate-900 truncate">{orderName}</div>
                                <div className="text-[10.5px] text-slate-500 tnum">{runOrder.id}</div>
                              </div>
                              <button onClick={()=>setPropOrderOpen(o=>!o)}
                                className="shrink-0 flex items-center gap-0.5 text-[10.5px] font-semibold text-blue-500 hover:text-blue-700 transition">
                                {propOrderOpen?"접기":"자세히"}
                                <Icon name={propOrderOpen?"ChevronUp":"ChevronDown"} size={11}/>
                              </button>
                            </div>
                            {sel.progress!=null&&(
                              <div className="mt-2">
                                <div className="flex justify-between text-[10px] text-slate-500 mb-0.5">
                                  <span>진행률</span><span className="tnum font-semibold text-slate-700">{sel.progress}%</span>
                                </div>
                                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                  <div className="h-full bg-blue-500 rounded-full" style={{width:sel.progress+"%"}}/>
                                </div>
                              </div>
                            )}
                            {propOrderOpen&&(
                              <div className="mt-2.5 rounded-lg border border-slate-200 bg-white overflow-hidden">
                                <div className="px-2.5 py-2 bg-slate-50 border-b border-slate-100 grid grid-cols-2 gap-x-3 gap-y-1">
                                  {[
                                    ["시작",fmtTime(runOrder.start)],
                                    ["Fleet",fleets.find(f=>f.id===sel.fleet)?.name||sel.fleet],
                                    ["요청자",reqArr[initOrders.indexOf(runOrder)%3]||"USR-001"],
                                    ["오더ID",runOrder.id],
                                  ].map(([l,v])=>(
                                    <div key={l}>
                                      <div className="text-[9.5px] text-slate-400">{l}</div>
                                      <div className="text-[11px] font-semibold text-slate-800 tnum">{v}</div>
                                    </div>
                                  ))}
                                </div>
                                {stepsToShow&&stepsToShow.length>0&&(
                                  <div className="divide-y divide-slate-100">
                                    {stepsToShow.map((step,si)=>{
                                      const node=mapNodes.find(n=>n.id===step.nodeId);
                                      const progressPct=sel.progress||0;
                                      const totalSteps=stepsToShow.length;
                                      const doneSteps=Math.floor(progressPct/100*totalSteps);
                                      const isCurrent=si===doneSteps;
                                      const isDone=si<doneSteps;
                                      const slots=step.slots||[{actionType:step.actionType,duration:step.duration}];
                                      return(
                                        <div key={si} className={"flex items-start gap-2 px-2.5 py-2 "+(isCurrent?"bg-blue-50":"")}>
                                          <div className={"w-5 h-5 rounded-full border-2 shrink-0 mt-0.5 flex items-center justify-center "+
                                            (isDone?"border-emerald-500 bg-emerald-500":isCurrent?"border-blue-500 bg-blue-100":"border-slate-300 bg-white")}>
                                            {isDone
                                              ?<Icon name="Check" size={9} className="text-white"/>
                                              :isCurrent
                                                ?<div className="w-2 h-2 rounded-full bg-blue-500"/>
                                                :<span className="text-[9px] font-bold text-slate-400">{si+1}</span>
                                            }
                                          </div>
                                          <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-1.5">
                                              <span className={"text-[11.5px] font-semibold "+(isDone?"text-emerald-700":isCurrent?"text-blue-800":"text-slate-500")}>
                                                {node?.label||step.nodeId}
                                              </span>
                                              {isCurrent&&<span className="text-[9.5px] font-bold px-1.5 py-px rounded-full bg-blue-500 text-white">진행중</span>}
                                            </div>
                                            <div className="flex flex-wrap gap-1 mt-0.5">
                                              {slots.map((sl,j)=>{
                                                const act=actionTypes.find(a=>a.id===sl.actionType);
                                                return(
                                                  <span key={j} className="text-[10px] text-slate-500 flex items-center gap-0.5">
                                                    <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{background:act?.color||"#94a3b8"}}/>
                                                    {act?.label||sl.actionType}
                                                    {j<slots.length-1&&<span className="ml-0.5">{step.mode==="parallel"?"∥":"→"}</span>}
                                                  </span>
                                                );
                                              })}
                                            </div>
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        ):null}
                        <div className="divide-y divide-slate-100">
                          {otherOrders.map(o=>{
                            const r=recipes.find(rr=>rr.id===o.recipeId),dur=r?recipeDuration(r):0;
                            const sc={done:{label:"완료",color:"#94a3b8",bg:"#f1f5f9"},running:{label:"진행중",color:"#2563eb",bg:"#dbeafe"},queued:{label:"예약",color:"#d97706",bg:"#fef3c7"},error:{label:"실패",color:"#e11d48",bg:"#ffe4e6"}}[o.status];
                            return <div key={o.id} className="px-2.5 py-2 hover:bg-slate-50/50"><div className="flex items-center gap-1.5 mb-0.5"><span className="w-1 h-3 rounded-sm" style={{background:sc.color}}/><span className="text-[11.5px] font-medium text-slate-900 truncate flex-1">{r?.name||o.recipeId}</span><span className="text-[9.5px] font-semibold px-1.5 py-px rounded tnum" style={{background:sc.bg,color:sc.color}}>{sc.label}</span></div><div className="flex items-center gap-1.5 text-[10px] text-slate-500 tnum pl-2.5"><Icon name="Clock" size={9}/>{fmtTime(o.start)}{"—"}{fmtTime(o.start+dur)}</div></div>;
                          })}
                          {!runOrder&&otherOrders.length===0&&<div className="px-3 py-4 text-center text-[11.5px] text-slate-400 italic">할당된 오더가 없습니다.</div>}
                        </div>
                      </div>
                    );
                  })()}

                  {/* Commission / Parameter 설정 (병합, 접이식) */}
                  <div className="rounded-md border border-slate-200 overflow-hidden">
                    <button onClick={()=>setParamOpen(o=>!o)}
                      className="w-full px-2.5 py-2 bg-slate-50 border-b border-slate-200 flex items-center gap-2 hover:bg-slate-100 transition">
                      <span className="text-[12px] font-semibold text-slate-800">Commission 설정</span>
                      <span className={"ml-auto text-[10.5px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 "+(commission==="commission"?"text-emerald-700 bg-emerald-50":"text-rose-700 bg-rose-50")}>
                        <Icon name={commission==="commission"?"CheckCircle2":"XCircle"} size={11}/>
                        {commission==="commission"?"Commission":"Decommission"}
                      </span>
                      <Icon name={paramOpen?"ChevronUp":"ChevronDown"} size={14} className="text-slate-400 shrink-0"/>
                    </button>
                    {paramOpen&&(
                      <div className="p-2.5 space-y-3">
                        {/* Commission / Decommission 선택 */}
                        <div>
                          <div className="text-[10.5px] text-amber-600 mb-1.5 flex items-start gap-1 leading-snug">
                            <Icon name="AlertTriangle" size={10} className="shrink-0 mt-px"/>
                            수동 작업·노드 이동 시 Decommission으로 변경하세요.
                          </div>
                          <div className="flex items-center gap-2">
                            {[{id:"commission",label:"Commission",icon:"CheckCircle2",cl:"text-emerald-700 bg-emerald-50 border-emerald-400"},
                              {id:"decommission",label:"Decommission",icon:"XCircle",cl:"text-rose-700 bg-rose-50 border-rose-400"}].map(o=>(

function BarChart({ data }) {
  if(!data||!data.length) return null;
  const w=560,h=180,pad={l:24,r:8,t:8,b:20},max=Math.max(...data.map(d=>d[1]))||1,bw=(w-pad.l-pad.r)/data.length;
  return <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{height:180}}>
    {[0,.5,1].map((t,i)=>{const y=pad.t+(1-t)*(h-pad.t-pad.b);return <g key={i}><line x1={pad.l} y1={y} x2={w-pad.r} y2={y} stroke="#e2e8f0" strokeDasharray="2 2"/><text x={pad.l-4} y={y+3} textAnchor="end" fill="#94a3b8" fontSize={9}>{Math.round(t*max)}</text></g>;})}
    {data.map(([l,v],i)=>{const x=pad.l+i*bw+bw*.15,bh=(v/max)*(h-pad.t-pad.b),y=h-pad.b-bh;return <g key={l}><rect x={x} y={y} width={bw*.7} height={bh} fill="#2563eb" rx="2"/><text x={x+bw*.35} y={h-pad.b+12} textAnchor="middle" fill="#94a3b8" fontSize={8}>{l}</text></g>;})}
  </svg>;
}

    {id:"Tool002", fleet:"amr", status:"run",        battery:64, speed:0.6, task:"MOVE-2042",  recipe:"QC 라인 검수 순회", uptime:"12h 05m", lastSeen:"13:42:05", x:420,y:200},
    {id:"Tool003", fleet:"amr", status:"idle",       battery:95, speed:0.0, task:null,         recipe:null,                uptime:"08h 10m", lastSeen:"13:41:55", x:140,y:230},
    {id:"Tool004", fleet:"amr", status:"charge",     battery:31, speed:0.0, task:"CHARGE",     recipe:"충전 스테이션 복귀", uptime:"06h 50m", lastSeen:"13:42:01", x:150,y:370},
    {id:"Tool005", fleet:"amr", status:"down",       battery:58, speed:0.0, task:"PICK-2043",  recipe:"Delivery-Tool 운반",uptime:"03h 22m", lastSeen:"13:40:12", x:580,y:220},
    {id:"Tool006", fleet:"amr", status:"down",       battery:42, speed:0.0, task:"PICK-2044",  recipe:"Delivery-Tool 운반",uptime:"02h 48m", lastSeen:"13:38:51", x:610,y:300},
    {id:"Ride001", fleet:"agv", status:"run",        battery:71, speed:0.5, task:"TRANS-1102", recipe:"AGV 라인 보충",     uptime:"10h 33m", lastSeen:"13:42:07", x:640,y:160},
    {id:"Ride002", fleet:"agv", status:"idle",       battery:87, speed:0.0, task:null,         recipe:null,                uptime:"05h 12m", lastSeen:"13:41:40", x:230,y:120},
    {id:"Part001", fleet:"arm", status:"manual",     battery:88, speed:0.0, task:"ASSY-9001",  recipe:"팔레트 적재 시퀀스", uptime:"11h 14m", lastSeen:"13:42:03", x:480,y:380},
    {id:"Part002", fleet:"arm", status:"disconnect", battery:90, speed:0.0, task:null,         recipe:null,                uptime:"00h 00m", lastSeen:"13:28:38", x:540,y:380},
    {id:"x001",    fleet:"semi",status:"run",        battery:76, speed:0.3, task:"WAFER-2201", recipe:"웨이퍼 핸들링",     uptime:"09h 45m", lastSeen:"13:42:06", x:720,y:360},
    {id:"x002",    fleet:"semi",status:"idle",       battery:92, speed:0.0, task:null,         recipe:null,                uptime:"07h 30m", lastSeen:"13:41:50", x:780,y:360},
    {id:"PM001",   fleet:"pm",  status:"run",        battery:69, speed:0.4, task:"PM-0301",    recipe:"PM 점검 순회",      uptime:"08h 02m", lastSeen:"13:42:04", x:340,y:300},
  ];

  const nearNode=(r)=>{let best=null,bd=1e9;mapNodes.forEach(n=>{const d=Math.hypot(n.x-r.x,n.y-r.y);if(d<bd){bd=d;best=n;}});return best;};
  const fmtT=(m)=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;

  // ── 오늘 타임라인 합성 (로봇 ID 기반 결정적) ──
  const DAY_S=6*60, DAY_E=14*60;
  function genTimeline(r){
    let seed=0; for(const ch of r.id) seed=(seed*31+ch.charCodeAt(0))%9973;
    const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    const segs=[]; let t=DAY_S;
    const lastType = r.status==="run"||r.status==="manual"?"work" : r.status==="charge"?"charge" : r.status==="down"?"error" : r.status==="disconnect"?"offline" : "idle";
    while(t<DAY_E-60){
      const roll=rnd();
      let type,len;
      if(r.status==="down"&&roll<0.18){type="error";len=15+Math.floor(rnd()*20);}
      else if(roll<0.55){type="work";len=40+Math.floor(rnd()*60);}
      else if(roll<0.72){type="idle";len=20+Math.floor(rnd()*30);}
      else if(roll<0.88){type="work";len=30+Math.floor(rnd()*40);}
      else {type="charge";len=25+Math.floor(rnd()*35);}
      len=Math.min(len, DAY_E-60-t);
      if(len>0) segs.push({type,from:t,to:t+len});
      t+=len;
      if(len<=0) break;
    }
    segs.push({type:lastType,from:t,to:DAY_E});
    return segs;
  }
  const TL_COLOR={work:"#2563eb",charge:"#16a34a",idle:"#cbd5e1",error:"#e11d48",offline:"#475569"};
  const TL_LABEL={work:"작업",charge:"충전",idle:"유휴",error:"에러",offline:"오프라인"};
  const utilOf=(segs)=>{const w=segs.filter(s=>s.type==="work").reduce((a,s)=>a+(s.to-s.from),0);return Math.round(w/(DAY_E-DAY_S)*100);};

  // ── 필터/정렬 ──
  const counts={all:robotData.length};
  Object.keys(ST_META).forEach(k=>counts[k]=robotData.filter(r=>r.status===k).length);
  let rows=robotData.filter(r=>
    (fleetF.size===0||fleetF.has(r.fleet))&&
    (statusF==="all"||r.status===statusF)&&
    (!q||r.id.toLowerCase().includes(q.toLowerCase()))
  );
  rows=[...rows].sort((a,b)=>{
    let v=0;
    if(sortBy==="status") v=STATUS_PRIORITY[a.status]-STATUS_PRIORITY[b.status];
    else if(sortBy==="battery") v=a.battery-b.battery;
    else if(sortBy==="util") v=utilOf(genTimeline(a))-utilOf(genTimeline(b));
    else v=a.id.localeCompare(b.id);
    return sortDir==="asc"?v:-v;
  });
  const sortBtn=(key,label)=>(
    <button onClick={()=>{if(sortBy===key)setSortDir(d=>d==="asc"?"desc":"asc");else{setSortBy(key);setSortDir("asc");}}}
      className={"flex items-center gap-0.5 "+(sortBy===key?"text-blue-600 font-semibold":"")}>
      {label}{sortBy===key&&<Icon name={sortDir==="asc"?"ChevronUp":"ChevronDown"} size={10}/>}
    </button>
  );

  // ── 드로어용 이력 ──
  const sel=selRobot?robotData.find(r=>r.id===selRobot):null;
  const myOrders=sel?initOrders.filter(o=>o.robotId===sel.id):[];
  const myErrors=sel?(ERROR_LOG[sel.fleet]||[]).filter(e=>e.robotId===sel.id):[];
  const mySpec=sel?initFleetRegistry.find(f=>f.name===fleetMeta(sel.fleet).name):null;
  const selTL=sel?genTimeline(sel):[];
  const ORD_ST={done:{label:"완료",cls:"bg-slate-100 text-slate-600"},running:{label:"진행중",cls:"bg-blue-50 text-blue-700"},queued:{label:"예약",cls:"bg-amber-50 text-amber-700"},error:{label:"실패",cls:"bg-rose-50 text-rose-700"}};

  return (
    <div className="h-full overflow-hidden bg-slate-50 flex">
      {/* ════ 좌측: 현황 ════ */}
      <div className="flex-1 overflow-auto p-5 min-w-0">
        <div className="mb-4">
          <h1 className="text-[20px] font-semibold text-slate-900 tracking-tight">로봇 Status 현황</h1>
          <p className="text-[12.5px] text-slate-500 mt-0.5">전체 로봇 상태를 모니터링하고, 로봇을 클릭해 작업·에러 이력을 확인합니다.</p>
        </div>

        {/* KPI 칩 스트립 */}
        <div className="flex items-center gap-2 mb-3 flex-wrap">
          <button onClick={()=>setStatusF("all")}
            className={"h-9 px-3.5 rounded-lg border text-[12px] font-semibold flex items-center gap-1.5 transition "+(statusF==="all"?"border-blue-400 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
            전체 <span className="tnum font-bold">{counts.all}</span>
          </button>
          {Object.entries(ST_META).map(([k,v])=>(
            <button key={k} onClick={()=>setStatusF(statusF===k?"all":k)}
              className={"h-9 px-3.5 rounded-lg border text-[12px] font-medium flex items-center gap-1.5 transition "+(statusF===k?"border-blue-400 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
              <span className="w-2 h-2 rounded-full" style={{background:v.chip}}/>
              {v.label} <span className="tnum font-bold">{counts[k]}</span>
            </button>
          ))}
          <div className="ml-auto flex items-center gap-2">
            {fleets.map(f=>{
              const on=fleetF.has(f.id);
              return(
                <button key={f.id} onClick={()=>{const n=new Set(fleetF);on?n.delete(f.id):n.add(f.id);setFleetF(n);}}
                  className={"h-8 px-2.5 rounded-md border text-[11px] font-medium flex items-center gap-1 transition "+(on?"border-blue-400 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-500 hover:border-slate-300")}>
                  <span className="w-1.5 h-1.5 rounded-full" style={{background:f.color}}/>{f.name}
                </button>
              );
            })}
            <div className="relative">
              <Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="로봇 ID 검색"
                className="h-8 pl-7 pr-2 w-36 rounded-lg border border-slate-200 text-[12px] outline-none focus:border-blue-400"/>
            </div>
          </div>
        </div>

        {/* 로봇 테이블 */}
        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
          <table className="w-full text-[12.5px]">
            <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200 bg-slate-50/60">
              <th className="font-medium px-4 py-2.5 w-[110px]">{sortBtn("id","로봇 ID")}</th>
              <th className="font-medium py-2.5 w-[120px]">Fleet</th>
              <th className="font-medium py-2.5 w-[100px]">{sortBtn("status","상태")}</th>
              <th className="font-medium py-2.5 w-[130px]">{sortBtn("battery","배터리")}</th>
              <th className="font-medium py-2.5 w-[140px]">현재 노드</th>
              <th className="font-medium py-2.5">현재 작업</th>
              <th className="font-medium py-2.5 pr-4 w-[110px]">{sortBtn("util","오늘 가동률")}</th>
            </tr></thead>
            <tbody>
              {rows.length===0&&<tr><td colSpan={7} className="px-4 py-12 text-center text-slate-400">조건에 맞는 로봇이 없습니다.</td></tr>}
              {rows.map(r=>{
                const st=ST_META[r.status];
                const fm=fleetMeta(r.fleet);
                const nd=nearNode(r);
                const util=utilOf(genTimeline(r));
                const isSel=selRobot===r.id;
                return(
                  <tr key={r.id} onClick={()=>{setSelRobot(isSel?null:r.id);setDrawerTab("orders");}}
                    className={"border-b border-slate-100 cursor-pointer transition "+(isSel?"bg-blue-50/70":"hover:bg-slate-50/60")}>
                    <td className="px-4 py-3"><span className="font-semibold text-slate-900 tnum">{r.id}</span></td>
                    <td className="py-3 text-[11.5px] text-slate-700">{fm.name}</td>
                    <td className="py-3"><span className={"inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md border text-[11px] font-semibold "+st.badge}><span className="w-1.5 h-1.5 rounded-full" style={{background:st.chip}}/>{st.label}</span></td>
                    <td className="py-3 text-[11.5px] tnum text-slate-600">{r.battery}%</td>
                    <td className="py-3 text-slate-600 tnum text-[11.5px]">{nd?nd.id+" · "+nd.label:"—"}</td>
                    <td className="py-3 text-slate-600 text-[11.5px]">{r.task?<span className="tnum">{r.task}</span>:<span className="text-slate-300">—</span>}{r.recipe&&<span className="text-slate-400"> · {r.recipe}</span>}</td>
                    <td className="py-3 pr-4"><span className="tnum font-semibold text-slate-700">{util}%</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* ════ 우측: 로봇 상세 드로어 ════ */}
      {sel&&(()=>{
        const st=ST_META[sel.status]; const fm=fleetMeta(sel.fleet); const nd=nearNode(sel);
        const util=utilOf(selTL);
        return(
          <div className="w-[380px] shrink-0 border-l border-slate-200 bg-white flex flex-col overflow-hidden">
            {/* 헤더 */}
            <div className="px-4 pt-4 pb-3 border-b border-slate-200">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-lg grid place-items-center" style={{background:fm.color+"18",color:fm.color}}><Icon name="Bot" size={17}/></div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="text-[15px] font-bold text-slate-900 tnum">{sel.id}</span>
                    <span className={"inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md border text-[10.5px] font-semibold "+st.badge}><span className="w-1.5 h-1.5 rounded-full" style={{background:st.chip}}/>{st.label}</span>
                  </div>
                  <div className="text-[11px] text-slate-500 mt-0.5">{fm.name} · {nd?nd.id+" "+nd.label:"위치 미확인"}</div>
                </div>
                <button onClick={()=>setSelRobot(null)} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 text-slate-400"><Icon name="X" size={14}/></button>
              </div>
              <div className="mt-3 flex items-center gap-2">
                <Icon name="BatteryMedium" size={14} className="text-slate-400 shrink-0"/>
                <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:sel.battery+"%",background:sel.battery<35?"#e11d48":sel.battery<60?"#d97706":"#16a34a"}}/></div>
                <span className="text-[12px] tnum font-semibold text-slate-700">{sel.battery}%</span>
              </div>
              <div className="mt-2.5 grid grid-cols-3 gap-2 text-center">
                {[["속도",sel.speed.toFixed(1)+" m/s"],["가동 시간",sel.uptime],["마지막 통신",sel.lastSeen]].map(([k,v])=>(
                  <div key={k} className="rounded-lg bg-slate-50 px-2 py-1.5">
                    <div className="text-[9.5px] text-slate-400">{k}</div>
                    <div className="text-[11.5px] font-semibold text-slate-800 tnum">{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* 오늘 타임라인 */}
            <div className="px-4 py-3 border-b border-slate-200">
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[10.5px] font-semibold text-slate-500 uppercase tracking-wide">오늘 타임라인 <span className="normal-case font-normal text-slate-400">({fmtT(DAY_S)}–{fmtT(DAY_E)})</span></span>
                <span className="text-[11px] tnum"><span className="font-bold text-blue-700">{util}%</span> <span className="text-slate-400">가동률</span></span>
              </div>
              <div className="h-4 rounded-md overflow-hidden flex border border-slate-200">
                {selTL.map((s,i)=>(
                  <div key={i} title={TL_LABEL[s.type]+" "+fmtT(s.from)+"–"+fmtT(s.to)}
                    style={{width:((s.to-s.from)/(DAY_E-DAY_S)*100)+"%",background:TL_COLOR[s.type]}}/>
                ))}
              </div>
              <div className="flex items-center gap-3 mt-1.5">
                {Object.entries(TL_LABEL).map(([k,v])=>(
                  <span key={k} className="flex items-center gap-1 text-[10px] text-slate-500"><span className="w-2 h-2 rounded-sm" style={{background:TL_COLOR[k]}}/>{v}</span>
                ))}
              </div>
            </div>

            {/* 탭 */}
            <div className="px-4 pt-2 border-b border-slate-200 flex gap-1">
              {[["orders","작업 이력",myOrders.length],["errors","에러 이력",myErrors.length],["spec","스펙",null]].map(([k,label,cnt])=>(
                <button key={k} onClick={()=>setDrawerTab(k)}
                  className={"h-8 px-3 rounded-t-md text-[12px] font-medium flex items-center gap-1.5 border-b-2 -mb-px transition "+(drawerTab===k?"border-blue-600 text-blue-700":"border-transparent text-slate-500 hover:text-slate-700")}>
                  {label}{cnt!=null&&cnt>0&&<span className={"text-[10px] px-1.5 rounded-full tnum font-semibold "+(k==="errors"?"bg-rose-100 text-rose-600":"bg-slate-100 text-slate-500")}>{cnt}</span>}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-auto">
              {/* 작업 이력 */}
              {drawerTab==="orders"&&(
                <div className="divide-y divide-slate-100">
                  {myOrders.length===0&&<div className="px-4 py-10 text-center text-[12px] text-slate-400">오늘 작업 이력이 없습니다.</div>}
                  {[...myOrders].sort((a,b)=>b.start-a.start).map(o=>{
                    const r=recipes.find(rr=>rr.id===o.recipeId);
                    const os=ORD_ST[o.status]||ORD_ST.queued;
                    return(
                      <div key={o.id} className="px-4 py-2.5 hover:bg-slate-50/60">
                        <div className="flex items-center gap-2">
                          <span className="text-[11px] tnum text-slate-400 w-9 shrink-0">{fmtT(o.start)}</span>
                          <span className="text-[12px] font-medium text-slate-800 truncate flex-1">{r?r.name:o.id}</span>
                          <span className={"text-[10px] px-1.5 py-0.5 rounded font-semibold shrink-0 "+os.cls}>{os.label}</span>
                        </div>
                        <div className="text-[10.5px] text-slate-400 tnum mt-0.5 ml-11">{o.id}{o.end?` · ${fmtT(o.start)}–${fmtT(o.end)} (${o.end-o.start}분)`:""}</div>
                      </div>
                    );
                  })}
                </div>
              )}
              {/* 에러 이력 */}
              {drawerTab==="errors"&&(
                <div className="divide-y divide-slate-100">
                  {myErrors.length===0&&<div className="px-4 py-10 text-center text-[12px] text-slate-400">오늘 에러 이력이 없습니다.</div>}
                  {myErrors.map((e,i)=>{
                    const alarm=initAlarmRegistry.find(a=>a.id===e.code);
                    return(
                      <div key={i} className="px-4 py-2.5 hover:bg-slate-50/60">
                        <div className="flex items-center gap-2">
                          <span className="text-[11px] tnum text-slate-400 w-9 shrink-0">{e.time}</span>
                          {alarm?(
                            <a href={alarm.url} target="_blank" rel="noreferrer" title="조치 방법 문서 열기"
                              className="text-[11px] font-bold tnum text-rose-600 hover:underline flex items-center gap-0.5 shrink-0">
                              {e.code}<Icon name="ExternalLink" size={9}/>
                            </a>
                          ):(
                            <span className="text-[11px] font-bold tnum text-rose-600 shrink-0">{e.code}</span>
                          )}
                          <span className="text-[12px] text-slate-700 truncate flex-1">{e.label}</span>
                        </div>
                        {e.orderId&&<div className="text-[10.5px] text-slate-400 tnum mt-0.5 ml-11">관련 오더 {e.orderId}</div>}
                      </div>
                    );
                  })}
                  {myErrors.length>0&&<div className="px-4 py-2.5 text-[10px] text-slate-400 leading-relaxed">에러 코드를 클릭하면 알람 관리에 등록된 조치 방법 문서로 이동합니다.</div>}
                </div>
              )}
              {/* 스펙 */}
              {drawerTab==="spec"&&(
                <div className="p-4 space-y-1.5">
                  {mySpec?(<>
                    {[["Fleet 버전",mySpec.version],["제조사",mySpec.maker],["HW 사이즈",`${mySpec.w}×${mySpec.d}×${mySpec.h} mm`],["공차 중량",mySpec.mass+" kg"],
                      ["최대 선속도",mySpec.maxSpeed+" m/s"],["회전반경 (footprint)",mySpec.turnRadius+" m"],["간섭 여유 (vicinity)",mySpec.vicinity+" m"],["후진 주행",mySpec.reversible?"가능":"불가"],
                      ["배터리",`${mySpec.voltage}V · ${mySpec.capacity}Ah`],["충전 전류",mySpec.chargingCurrent+" A"],["자동 충전 임계치",mySpec.rechargeThreshold+"%"],["충전 목표치",mySpec.rechargeSoc+"%"]].map(([k,v])=>(
                      <div key={k} className="flex items-center justify-between py-1.5 border-b border-slate-100">
                        <span className="text-[11.5px] text-slate-500">{k}</span>
                        <span className="text-[12px] font-semibold text-slate-800 tnum">{v}</span>
                      </div>
                    ))}
                    <div className="text-[10px] text-slate-400 leading-relaxed pt-2">기준 정보 관리 {">"} Fleet 관리에 등록된 사양입니다 (읽기 전용).</div>
                  </>):(
                    <div className="py-8 text-center text-[12px] text-slate-400">등록된 Fleet 사양이 없습니다.</div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// 시간대별 처리량 (24h 목 데이터)
const HOURLY = {

// 영역 차트 (시간대별 처리량)
function AreaChart({ series, hours, compare }) {
  const W=620,H=180,pl=28,pr=12,pt=10,pb=22;
  const maxV=Math.max(1,...series.flatMap(s=>s.values),...(compare||[]));
  const N=24;
  const X=i=>pl+(i/(N-1))*(W-pl-pr);
  const Y=v=>pt+(1-v/maxV)*(H-pt-pb);
  const ygrid=[0,0.25,0.5,0.75,1];
  const [tip,setTip]=useState(null); // {hour, x, svgX}
  const svgRef=useRef(null);

  function onMouseMove(e){
    const rect=svgRef.current.getBoundingClientRect();
    const rawX=e.clientX-rect.left;
    const svgX=rawX/rect.width*W;
    const hour=Math.max(0,Math.min(23,Math.round((svgX-pl)/(W-pl-pr)*(N-1))));
    setTip({hour, rawX, rawY:e.clientY-rect.top});
  }

  const tipFleetLabel = id => {
    if(id==="total") return "전체";
    return fleets.find(f=>f.id===id)?.name||id;
  };

  return (
    <div className="relative" ref={svgRef} onMouseMove={onMouseMove} onMouseLeave={()=>setTip(null)}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:H}}>
        <defs>
          {series.map(s=>(
            <linearGradient key={s.id} id={`ag-${s.id}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={s.color} stopOpacity="0.25"/>
              <stop offset="100%" stopColor={s.color} stopOpacity="0.02"/>
            </linearGradient>
          ))}
        </defs>
        {ygrid.map((t,i)=>{
          const y=pt+(1-t)*(H-pt-pb);
          return <g key={i}><line x1={pl} y1={y} x2={W-pr} y2={y} stroke="#e2e8f0" strokeDasharray={i===0?"":"3 3"}/><text x={pl-4} y={y+3} textAnchor="end" fill="#94a3b8" fontSize={8}>{Math.round(t*maxV)}</text></g>;
        })}
        {[0,3,6,9,12,15,18,21,23].map(h=>(
          <text key={h} x={X(h)} y={H-pb+12} textAnchor="middle" fill="#94a3b8" fontSize={8}>{String(h).padStart(2,"0")}시</text>
        ))}
        {/* 현재 시간선 */}
        <line x1={X(11)} y1={pt} x2={X(11)} y2={H-pb} stroke="#e11d48" strokeWidth="1.5" strokeDasharray="3 2"/>
        <text x={X(11)} y={pt-1} textAnchor="middle" fill="#e11d48" fontSize={7} fontWeight="600">NOW</text>
        {/* 지난 기간 비교선 (점선) */}
        {compare&&(()=>{
          const pts=compare.map((v,i)=>[X(i),Y(v)]);
          const linePath=pts.map((p,i)=>(i===0?"M":"L")+p[0]+" "+p[1]).join(" ");
          return <path d={linePath} fill="none" stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="4 3" strokeLinecap="round"/>;
        })()}
        {/* 영역 + 선 */}
        {series.map(s=>{
          const pts=s.values.map((v,i)=>[X(i),Y(v)]);
          const linePath=pts.map((p,i)=>(i===0?"M":"L")+p[0]+" "+p[1]).join(" ");
          const areaPath=linePath+` L ${X(N-1)} ${H-pb} L ${X(0)} ${H-pb} Z`;
          return(
            <g key={s.id}>
              <path d={areaPath} fill={`url(#ag-${s.id})`}/>
              <path d={linePath} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              <circle cx={X(11)} cy={Y(s.values[11])} r="3.5" fill={s.color} stroke="white" strokeWidth="1.5"/>
            </g>
          );
        })}
        {/* 호버 크로스헤어 */}
        {tip&&<>
          <line x1={X(tip.hour)} y1={pt} x2={X(tip.hour)} y2={H-pb} stroke="#334155" strokeWidth="1" strokeDasharray="3 2" opacity="0.5"/>
          {series.map(s=><circle key={s.id} cx={X(tip.hour)} cy={Y(s.values[tip.hour])} r="4" fill={s.color} stroke="white" strokeWidth="2"/>)}
        </>}
      </svg>
      {/* 툴팁 */}
      {tip&&(()=>{
        const tipW=160, tipX=tip.rawX+14, tipRight=tipX+tipW;
        const containerW=svgRef.current?.getBoundingClientRect().width||600;
        const finalX=tipRight>containerW?tip.rawX-tipW-10:tipX;
        return(
          <div className="absolute z-30 pointer-events-none bg-slate-900 text-white rounded-lg shadow-xl px-3 py-2.5"
            style={{left:finalX, top:Math.max(4,tip.rawY-80), minWidth:tipW}}>
            <div className="text-[11px] font-semibold text-slate-300 mb-2 flex items-center gap-1.5">
              {String(tip.hour).padStart(2,"0")}:00 시간대
            </div>
            {series.map(s=>(
              <div key={s.id} className="flex items-center justify-between gap-3 text-[11.5px] py-0.5">
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-sm shrink-0" style={{background:s.color}}/>
                  <span className="text-slate-300">{tipFleetLabel(s.id)}</span>
                </div>
                <span className="font-bold tnum text-white">{s.values[tip.hour]}건</span>
              </div>
            ))}
            {series.length>1&&<>
              <div className="h-px bg-slate-700 my-1.5"/>
              <div className="flex items-center justify-between text-[11.5px]">
                <span className="text-slate-400">합계</span>
                <span className="font-bold tnum text-emerald-400">{series.reduce((s,sr)=>s+sr.values[tip.hour],0)}건</span>
              </div>
            </>}
            {compare&&(()=>{
              const cur=series.find(s=>s.id==="total")?series.find(s=>s.id==="total").values[tip.hour]:series.reduce((a,s)=>a+s.values[tip.hour],0);
              const prev=compare[tip.hour];
              const diff=cur-prev;
              return(<>
                <div className="h-px bg-slate-700 my-1.5"/>
                <div className="flex items-center justify-between text-[11.5px]">
                  <span className="flex items-center gap-1.5"><span className="w-2.5 border-t border-dashed border-slate-400"/><span className="text-slate-400">지난 기간</span></span>
                  <span className="tnum text-slate-300">{prev}건 <span className={"ml-0.5 font-semibold "+(diff>=0?"text-emerald-400":"text-rose-400")}>{diff>=0?"▲":"▼"}{Math.abs(diff)}</span></span>
                </div>
              </>);
            })()}
          </div>
        );
      })()}
    </div>
  );
}

// 누적 바 차트 (Fleet별 작업 현황)
function StackedBarChart({ data, legend, onBarClick, activeFleet }) {
  if(!data||!data.length) return null;
  const W=340,H=200,pl=40,pr=16,pt=10,pb=22;
  const maxV=Math.max(1,...data.map(d=>d.values.reduce((s,v)=>s+v,0)));
  const bw=(W-pl-pr)/Math.max(data.length,1);
  const [tip,setTip]=useState(null); // {di, rawX, rawY}
  const wrapRef=useRef(null);

  function onMouseMove(e,di){
    const rect=wrapRef.current.getBoundingClientRect();
    setTip({di, rawX:e.clientX-rect.left, rawY:e.clientY-rect.top});
  }

  return(
    <div className="relative" ref={wrapRef} onMouseLeave={()=>setTip(null)}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:H}}>
        {[0,0.5,1].map((t,i)=>{
          const y=pt+(1-t)*(H-pt-pb);
          return <g key={i}><line x1={pl} y1={y} x2={W-pr} y2={y} stroke="#e2e8f0" strokeDasharray={i===1?"3 3":""}/><text x={pl-4} y={y+3} textAnchor="end" fill="#94a3b8" fontSize={8}>{Math.round(t*maxV)}</text></g>;
        })}
        {data.map((d,di)=>{
          const x=pl+di*bw+bw*0.15, bWidth=bw*0.7, total=d.values.reduce((s,v)=>s+v,0);
          const isHov=tip?.di===di;
          const isActive=activeFleet&&d.fId===activeFleet;
          let cy=H-pb;
          return(
            <g key={d.label} onMouseMove={e=>onMouseMove(e,di)} onClick={()=>onBarClick&&onBarClick(d.fId)} style={{cursor:onBarClick?"pointer":"default"}}>
              {/* hover 하이라이트 배경 */}
              {isHov&&<rect x={pl+di*bw} y={pt} width={bw} height={H-pt-pb} fill="#f1f5f9" rx="4"/>}
              {/* 활성(테이블 필터) 표시 */}
              {isActive&&<rect x={pl+di*bw+1} y={pt} width={bw-2} height={H-pt-pb} fill="none" stroke="#2563eb" strokeWidth="1.5" strokeDasharray="3 2" rx="4"/>}
              {d.values.map((v,vi)=>{
                const h=(v/maxV)*(H-pt-pb), y=cy-h;
                cy=y;
                return <rect key={vi} x={x} y={y} width={bWidth} height={Math.max(h,0)} fill={d.colors[vi]} rx={vi===d.values.length-1?2:0} opacity={isHov?1:0.9}/>;
              })}
              <text x={x+bWidth/2} y={H-pb+12} textAnchor="middle" fill={isHov?"#1e293b":"#64748b"} fontSize={9} fontWeight={isHov?"700":"500"}>{d.label}</text>
              <text x={x+bWidth/2} y={H-pb-total*(H-pt-pb)/maxV-5} textAnchor="middle" fill="#334155" fontSize={8} fontWeight="700">{total}</text>
            </g>
          );
        })}
      </svg>
      {/* 툴팁 */}
      {tip!==null&&data[tip.di]&&(()=>{
        const d=data[tip.di];
        const tipW=160;
        const containerW=wrapRef.current?.getBoundingClientRect().width||340;
        const finalX=tip.rawX+14+tipW>containerW?tip.rawX-tipW-10:tip.rawX+14;
        const labels=(legend||[]);
        const total=d.values.reduce((s,v)=>s+v,0);
        const successPct=total>0?Math.round(((d.values[0]||0)/total)*100):0;
        return(
          <div className="absolute z-30 pointer-events-none bg-slate-900 text-white rounded-lg shadow-xl px-3 py-2.5"
            style={{left:finalX, top:Math.max(4,tip.rawY-100), minWidth:tipW}}>
            <div className="text-[11px] font-semibold text-slate-300 mb-2 flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-sm" style={{background:d.colors[0]}}/>
              {d.label} Fleet
            </div>
            {d.values.map((v,vi)=>{
              const lbl=labels[vi];
              if(!lbl||v===0) return null;
              const pct=total>0?Math.round(v/total*100):0;
              return(
                <div key={vi} className="flex items-center justify-between gap-3 py-0.5">
                  <div className="flex items-center gap-1.5 text-[11.5px]">
                    <span className="w-2 h-2 rounded-sm shrink-0" style={{background:d.colors[vi]}}/>
                    <span className="text-slate-300">{lbl.label}</span>
                  </div>
                  <div className="text-right">
                    <span className="font-bold tnum text-white">{v}</span>
                    <span className="text-[10px] text-slate-400 ml-1">({pct}%)</span>
                  </div>
                </div>
              );
            })}
            <div className="h-px bg-slate-700 my-1.5"/>
            <div className="flex items-center justify-between text-[11.5px]">
              <span className="text-slate-400">합계</span>
              <span className="font-bold tnum text-white">{total}건</span>
            </div>
            <div className="flex items-center justify-between text-[11.5px] mt-0.5">
              <span className="text-slate-400">성공률</span>
              <span className={"font-bold tnum "+(successPct>=80?"text-emerald-400":successPct>=60?"text-amber-400":"text-rose-400")}>{successPct}%</span>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// 호버 가능한 도넛 차트
function MiniDonut({ segments }) {
  const cx=50,cy=50,r=38,ir=26;
  const [hovIdx,setHovIdx]=useState(null);
  const [tipPos,setTipPos]=useState({x:0,y:0});
  const wrapRef=useRef(null);

  const total=segments.reduce((s,x)=>s+(x.v||0),0)||1;

  function polar(angle){
    const rad=(angle-90)*Math.PI/180;
    return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)};
  }
  function polarInner(angle){
    const rad=(angle-90)*Math.PI/180;
    return {x:cx+ir*Math.cos(rad), y:cy+ir*Math.sin(rad)};
  }
  function arcPath(startDeg,endDeg){
    const s=polar(startDeg), e=polar(endDeg);
    const si=polarInner(startDeg), ei=polarInner(endDeg);
    const large=endDeg-startDeg>180?1:0;
    return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} L ${ei.x} ${ei.y} A ${ir} ${ir} 0 ${large} 0 ${si.x} ${si.y} Z`;
  }

  let cursor=0;
  const arcs=segments.filter(s=>s.v>0).map((s,i)=>{
    const sweep=(s.v/total)*360;
    const start=cursor, end=cursor+sweep;
    cursor=end;
    return {...s, start, end, idx:i};
  });

  const hov=hovIdx!==null?arcs.find(a=>a.idx===hovIdx):null;

  function onMove(e,idx){
    if(!wrapRef.current)return;
    const rect=wrapRef.current.getBoundingClientRect();
    setTipPos({x:e.clientX-rect.left,y:e.clientY-rect.top});
    setHovIdx(idx);
  }

  return(
    <div className="relative" ref={wrapRef} style={{width:88,height:88}} onMouseLeave={()=>setHovIdx(null)}>
      <svg viewBox="0 0 100 100" style={{width:88,height:88}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f1f5f9" strokeWidth={1}/>
        {arcs.map(a=>{
          const isHov=a.idx===hovIdx;
          const scale=isHov?1.06:1;
          return(
            <path key={a.idx}
              d={arcPath(a.start,a.end)}
              fill={a.color}
              opacity={hovIdx===null||isHov?1:0.55}
              style={{transform:`scale(${scale})`,transformOrigin:`${cx}px ${cy}px`,transition:"all 0.12s",cursor:"pointer"}}
              onMouseMove={e=>onMove(e,a.idx)}
            />
          );
        })}
        {/* 중앙 텍스트 */}
        <text x={cx} y={cx-4} textAnchor="middle" fill={hov?hov.color:"#0f172a"} fontSize={hov?10:14} fontWeight="700">
          {hov?hov.v:total}
        </text>
        <text x={cx} y={cx+8} textAnchor="middle" fill="#94a3b8" fontSize={7}>
          {hov?(hov.short||hov.label):"대"}
        </text>
      </svg>

      {/* 툴팁 */}
      {hov&&hov.robotIds&&hov.robotIds.length>0&&(()=>{
        const tipW=130;
        const right=tipPos.x+14+tipW>88;
        return(
          <div className="absolute z-40 pointer-events-none bg-slate-900 text-white rounded-lg shadow-xl px-2.5 py-2"
            style={{
              left: right?tipPos.x-tipW-6:tipPos.x+10,
              top: Math.max(0,tipPos.y-60),
              minWidth:tipW,
            }}>
            <div className="flex items-center gap-1.5 mb-1.5">
              <span className="w-2 h-2 rounded-sm shrink-0" style={{background:hov.color}}/>
              <span className="text-[11px] font-semibold">{hov.label}</span>
              <span className="ml-auto text-[10px] text-slate-400 tnum">{hov.v}대</span>
            </div>
            <div className="space-y-0.5">
              {hov.robotIds.map(id=>(
                <div key={id} className="flex items-center gap-1.5 text-[10.5px] text-slate-300">
                  <Icon name="Bot" size={9} className="text-slate-500 shrink-0"/>
                  <span className="tnum">{id}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

  const hourlyTotal = sumHourly(selFleets);
  const taskTotal   = sumTask(selFleets);
  const errTotal    = sumErr(selFleets);
  const totalRobots = robots.filter(r=>selFleets.includes(r.fleet)).length;
  const runRobots   = robots.filter(r=>selFleets.includes(r.fleet)&&r.st==="run").length;
  const uptimePct   = totalRobots ? Math.round(runRobots/totalRobots*100) : 0;
  const totalTasks  = taskTotal.success+taskTotal.failed+taskTotal.running+taskTotal.queued;
  const successPct  = totalTasks ? Math.round(taskTotal.success/totalTasks*100) : 0;

  // Summary cards
  const cards = [
    {label:"평균 가동률",   value:uptimePct+"%",       sub:`${runRobots}/${totalRobots}대 가동 중`,  icon:"Gauge",       tone:"emerald", trend:"+2.4%"},
    {label:"작업 성공률",   value:successPct+"%",      sub:`${taskTotal.success}건 완료`,             icon:"CheckCircle2",tone:"blue",    trend:"+1.1%"},
    {label:"기간 내 에러",     value:errTotal.total+"건", sub:`위험 ${errTotal.critical}건 포함`,        icon:"AlertTriangle",tone:"rose",   trend:errTotal.today>3?"+2건":"-1건"},
    {label:"누적 처리량",   value:hourlyTotal.reduce((s,v)=>s+v,0)+"건", sub:"선택 기간 합산", icon:"TrendingUp", tone:"slate", trend:"+12%"},
  ];

  // Area chart series
  const areaSeries = selFleets.map(fId=>{
    const f=fleets.find(fl=>fl.id===fId);
    return {id:fId, color:f?.color||"#64748b", values:HOURLY[fId]||Array(24).fill(0)};
  });
  // 전체 합산도 표시 (멀티 fleet 선택 시)
  const showTotal = selFleets.length>1;
  const allSeries = showTotal
    ? [{id:"total",color:"#334155",values:hourlyTotal},...areaSeries]
    : areaSeries;
  // 지난 기간 비교 (시간대별 합계의 이전 기간 추정치)
  const [showCompare,setShowCompare]=useState(true);
  const compareValues = hourlyTotal.map((v,i)=>Math.round(v*(0.80+((i*13)%19)/100)));
  // Fleet 카드 지표 클릭 → 하단 상세 (에러 항목 / 작업 현황)
  const [fleetDetail,setFleetDetail]=useState(null); // {fId, type:"errors"|"tasks"} | null

  // Stacked bar: Fleet별 [성공,실패,진행,대기]
  const stackColors=["#10b981","#e11d48","#2563eb","#d97706"];
  const stackLegend=[{label:"성공",color:"#10b981"},{label:"실패",color:"#e11d48"},{label:"진행",color:"#2563eb"},{label:"대기",color:"#d97706"}];
  const stackData = selFleets.map(fId=>{
    const f=fleets.find(fl=>fl.id===fId),d=TASK_STATS[fId]||{};
    return {fId, label:f?.name||fId, colors:stackColors, values:[d.success||0,d.failed||0,d.running||0,d.queued||0]};
  });

  // 테이블 필터: 글로벌 Fleet + 테이블 전용 Fleet/상태 필터 조합
  const tableRobots = robots.filter(r=>{
    const baseFleets = selFleets; // 글로벌 Fleet 필터 기준
    if(!baseFleets.includes(r.fleet)) return false;
    if(tblFleetF.size>0 && !tblFleetF.has(r.fleet)) return false;
    if(tblStatusF.size>0 && !tblStatusF.has(r.status)) return false;
    return true;
  });

  return (
    <div className="h-full overflow-auto p-5 bg-slate-50">
      {/* ── 헤더 + 글로벌 필터 ── */}
      <div className="flex items-center gap-4 mb-4">
        <div>
          <h1 className="text-[18px] font-semibold text-slate-900 leading-tight">운영 대시보드</h1>
          <p className="text-[11.5px] text-slate-500 mt-0.5">Fleet 운영{"·"}작업{"·"}에러 현황 종합 분석</p>
        </div>
        <div className="ml-auto flex items-center gap-2 flex-wrap">
          {/* 날짜 프리셋 */}
          <div className="flex items-center gap-1 bg-slate-100 rounded-lg p-0.5">
            {[{id:"today",label:"오늘"},{id:"7d",label:"최근 7일"}].map(p=>(
              <button key={p.id} onClick={()=>applyPreset(p.id)}
                className={"h-8 px-2.5 rounded-md text-[12px] font-medium transition "+(datePreset===p.id?"bg-white text-blue-700 shadow-sm":"text-slate-500 hover:text-slate-700")}>
                {p.label}
              </button>
            ))}
          </div>
          {/* 날짜 범위 */}
          <div className="flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg px-3 h-9">
            <Icon name="CalendarRange" size={13} className="text-slate-400"/>
            <input type="date" value={dateFrom} onChange={e=>{setDateFrom(e.target.value);setDatePreset("");}} className="text-[12px] text-slate-800 outline-none bg-transparent"/>
            <span className="text-slate-300 text-[11px]">{"—"}</span>
            <input type="date" value={dateTo} onChange={e=>{setDateTo(e.target.value);setDatePreset("");}} className="text-[12px] text-slate-800 outline-none bg-transparent"/>
          </div>
          {/* Fleet 멀티 드롭다운 */}
          <MultiSelectDropdown
            label="Fleet"
            value={fleetSel}
            onChange={setFleetSel}
            options={fleets.map(f=>({id:f.id,label:f.name,color:f.color}))}
            colorMap={Object.fromEntries(fleets.map(f=>[f.id,f.color]))}
          />
          {fleetSel.size>0&&<button onClick={()=>setFleetSel(new Set())} className="h-9 px-2.5 rounded-lg border border-rose-200 bg-white hover:bg-rose-50 text-rose-500 text-[12px] flex items-center gap-1"><Icon name="RotateCcw" size={12}/> 초기화</button>}
        </div>
      </div>

      {/* ── Summary Cards ── */}
      <div className="grid grid-cols-4 gap-3 mb-4">
        {cards.map((c,i)=>{
          const tc={emerald:"text-emerald-500 bg-emerald-50",blue:"text-blue-500 bg-blue-50",rose:"text-rose-500 bg-rose-50",slate:"text-slate-500 bg-slate-100"}[c.tone];
          const up=c.trend.startsWith("+")&&c.tone!=="rose";
          return(
            <div key={i} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <div className="flex items-center justify-between mb-2"><span className="text-[11.5px] text-slate-500">{c.label}</span><div className={"w-7 h-7 rounded-lg grid place-items-center "+tc}><Icon name={c.icon} size={14}/></div></div>
              <div className="flex items-baseline gap-2">
                <span className="text-[26px] font-bold text-slate-900 tnum leading-none">{c.value}</span>
                <span className={"text-[10.5px] font-semibold tnum "+(up?"text-emerald-600":"text-rose-500")}>{c.trend}</span>
              </div>
              <div className="text-[10.5px] text-slate-400 mt-1.5">{c.sub}</div>
            </div>
          );
        })}
      </div>

      {/* ── Middle Row ── */}
      <div className="grid gap-4 mb-4" style={{gridTemplateColumns:"1.5fr 1fr"}}>
        {/* 시간대별 처리량 */}
        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
          <div className="h-11 px-4 border-b border-slate-200 flex items-center gap-2">
            <Icon name="TrendingUp" size={14} className="text-slate-500"/>
            <span className="text-[13px] font-semibold text-slate-900">시간대별 평균 처리량</span>
            <span className="text-[11px] text-slate-400">오늘 기준</span>
            <div className="ml-auto flex items-center gap-3 text-[10.5px]">
              <button onClick={()=>setShowCompare(v=>!v)}
                className={"flex items-center gap-1 px-1.5 py-0.5 rounded transition "+(showCompare?"bg-slate-100 text-slate-600":"text-slate-400 hover:bg-slate-50")}>
                <span className="w-2.5 border-t border-dashed border-slate-400"/> vs 지난 기간
              </button>
              {showTotal&&<span className="flex items-center gap-1"><span className="w-2.5 h-0.5 rounded-full bg-slate-800 inline-block"/><span className="text-slate-500">전체</span></span>}
              {areaSeries.map(s=>{const f=fleets.find(fl=>fl.id===s.id);return <span key={s.id} className="flex items-center gap-1"><span className="w-2.5 h-0.5 rounded-full inline-block" style={{background:s.color}}/><span className="text-slate-500">{f?.name}</span></span>;})}
            </div>
          </div>
          <div className="px-4 pt-3 pb-2">
            <AreaChart series={allSeries} hours={24} compare={showCompare?compareValues:null}/>
          </div>
        </div>

        {/* Fleet별 작업 현황 */}
        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
          <div className="h-11 px-4 border-b border-slate-200 flex items-center gap-2">
            <Icon name="BarChart3" size={14} className="text-slate-500"/>
            <span className="text-[13px] font-semibold text-slate-900">Fleet별 평균 작업현황</span>
            <div className="ml-auto flex items-center gap-2">
              {stackLegend.map(l=><span key={l.label} className="flex items-center gap-1 text-[10px] text-slate-500"><span className="w-2 h-2 rounded-sm inline-block" style={{background:l.color}}/>{l.label}</span>)}
            </div>
          </div>
          <div className="px-4 pt-3 pb-2">
            <StackedBarChart data={stackData} legend={stackLegend} activeFleet={tblFleetF.size===1?[...tblFleetF][0]:null} onBarClick={fId=>setTblFleetF(prev=>(prev.size===1&&prev.has(fId))?new Set():new Set([fId]))}/>
          </div>
        </div>
      </div>

      {/* ── 운영 현황 카드 row ── */}
      <div className="grid grid-cols-5 gap-3 mb-4">
        {selFleets.map(fId=>{
          const f=fleets.find(fl=>fl.id===fId);
          const fr=robots.filter(r=>r.fleet===fId);
          const counts=Object.fromEntries(statuses.map(s=>[s.id,fr.filter(r=>r.status===s.id).length]));
          const err=ERROR_STATS[fId]||{total:0,today:0,critical:0};
          const task=TASK_STATS[fId]||{success:0,failed:0,running:0,queued:0};
          const upPct=fr.length?Math.round((counts.run||0)/fr.length*100):0;
          const isTableFiltered=tblFleetF.size===1&&tblFleetF.has(fId);
          return(
            <div key={fId} onClick={()=>setTblFleetF(prev=>(prev.size===1&&prev.has(fId))?new Set():new Set([fId]))}
              title="클릭 → 아래 로봇 테이블을 이 Fleet으로 필터"
              className={"bg-white border rounded-xl p-3.5 shadow-sm cursor-pointer transition-all hover:shadow-md hover:border-blue-300 "+(isTableFiltered?"border-blue-400 ring-2 ring-blue-100":"border-slate-200")}>
              <div className="flex items-center gap-2 mb-3">
                
                <span className="text-[13px] font-semibold text-slate-900">{f?.name}</span>
                <span className="ml-auto text-[11px] text-slate-400 tnum">{fr.length}대</span>
              </div>
              {/* 미니 도넛 + 수치 */}
              <div className="flex items-center gap-2 mb-3">
                <MiniDonut segments={statuses.map(s=>({
                color:s.color, v:counts[s.id]||0,
                label:s.label, short:s.short,
                robotIds:fr.filter(r=>r.status===s.id).map(r=>r.id)
              }))}/>
                <div className="flex-1 space-y-1">
                  {statuses.filter(s=>(counts[s.id]||0)>0).slice(0,4).map(s=>(
                    <div key={s.id} className="flex items-center gap-1.5 text-[10.5px]">
                      
                      <span className="text-slate-600 flex-1">{s.short}</span>
                      <span className="font-semibold tnum text-slate-900">{counts[s.id]||0}</span>
                    </div>
                  ))}
                </div>
              </div>
              {/* 가동률 바 */}
              <div className="mb-2">
                <div className="flex items-center justify-between text-[10.5px] mb-1"><span className="text-slate-500">가동률</span><span className="font-semibold text-slate-900 tnum">{upPct}%</span></div>
                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:upPct+"%",background:f?.color}}/></div>
              </div>
              {/* 에러·작업 수치 (클릭 → 하단 상세) */}
              <div className="grid grid-cols-2 gap-1.5 mt-2.5">
                <div onClick={(e)=>{e.stopPropagation();setFleetDetail(prev=>(prev&&prev.fId===fId&&prev.type==="errors")?null:{fId,type:"errors"});}}
                  title="클릭 → 에러 항목 보기"
                  className={"rounded-lg px-2 py-1.5 cursor-pointer transition hover:ring-2 hover:ring-rose-200 "+(fleetDetail&&fleetDetail.fId===fId&&fleetDetail.type==="errors"?"bg-rose-100 ring-2 ring-rose-300":"bg-rose-50")}>
                  <div className="text-[9.5px] text-rose-500 font-medium flex items-center gap-0.5">금일 에러 <Icon name="ChevronDown" size={9} className="text-rose-300"/></div>
                  <div className="text-[14px] font-bold text-rose-700 tnum">{err.today}<span className="text-[9.5px] font-medium text-rose-400 ml-0.5">건</span></div>
                </div>
                <div onClick={(e)=>{e.stopPropagation();setFleetDetail(prev=>(prev&&prev.fId===fId&&prev.type==="tasks")?null:{fId,type:"tasks"});}}
                  title="클릭 → 작업 현황 보기"
                  className={"rounded-lg px-2 py-1.5 cursor-pointer transition hover:ring-2 hover:ring-emerald-200 "+(fleetDetail&&fleetDetail.fId===fId&&fleetDetail.type==="tasks"?"bg-emerald-100 ring-2 ring-emerald-300":"bg-emerald-50")}>
                  <div className="text-[9.5px] text-emerald-600 font-medium flex items-center gap-0.5">성공률 <Icon name="ChevronDown" size={9} className="text-emerald-300"/></div>
                  <div className="text-[14px] font-bold text-emerald-700 tnum">{task.success+task.failed>0?Math.round(task.success/(task.success+task.failed)*100):"-"}<span className="text-[10px] font-normal ml-0.5">%</span></div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── Fleet 지표 클릭 상세 (에러 항목 / 작업 현황) ── */}
      {fleetDetail&&(()=>{
        const f=fleets.find(fl=>fl.id===fleetDetail.fId);
        const fName=f?.name||fleetDetail.fId;
        if(fleetDetail.type==="errors"){
          const errs=[...(ERROR_LOG[fleetDetail.fId]||[])].sort((a,b)=>b.time.localeCompare(a.time));
          const errSumF=errs.length;
          return(
            <div className="bg-white border border-rose-200 rounded-xl shadow-sm overflow-hidden mb-4">
              <div className="h-11 px-4 border-b border-rose-100 bg-rose-50/50 flex items-center gap-2">
                <Icon name="AlertTriangle" size={14} className="text-rose-500"/>
                <span className="text-[13px] font-semibold text-slate-900">{fName} · 에러 항목</span>
                <span className="text-[11px] text-slate-400 tnum">총 {errSumF}건</span>
                <button onClick={()=>setFleetDetail(null)} className="ml-auto text-slate-400 hover:text-slate-600"><Icon name="X" size={15}/></button>
              </div>
              <div className="p-4">
                {errs.length===0
                  ? <div className="py-5 text-center text-[12px] text-slate-400">에러 항목이 없습니다.</div>
                  : <table className="w-full text-[12.5px]">
                      <thead><tr className="text-left text-slate-400 border-b border-slate-100">
                        <th className="font-medium py-2 px-2 w-[80px]">발생 시각</th>
                        <th className="font-medium py-2 w-[100px]">에러 로봇</th>
                        <th className="font-medium py-2 w-[110px]">에러 코드</th>
                        <th className="font-medium py-2">내용</th>
                        <th className="font-medium py-2 pr-2 w-[100px]">오더 ID</th>
                      </tr></thead>
                      <tbody>
                        {errs.map((e,ei)=>{
                          const crit=CRITICAL_PREFIX.includes(e.code.split("_")[0]);
                          return(
                            <tr key={e.code+ei} className="border-b border-slate-50">
                              <td className="py-2 px-2 tnum text-slate-500">{e.time}</td>
                              <td className="py-2 tnum text-slate-700">{e.robotId}</td>
                              <td className="py-2"><span className="tnum text-[11.5px] font-semibold text-slate-700 flex items-center gap-1.5">{crit&&<span className="w-1.5 h-1.5 rounded-full bg-rose-500"/>}{e.code}</span></td>
                              <td className="py-2 text-slate-600">{e.label}</td>
                              <td className="py-2 pr-2">{e.orderId
                                ? <span className="tnum text-blue-600 font-medium">{e.orderId}</span>
                                : <span className="text-slate-300 text-[11px]">작업 외</span>}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>}
              </div>
            </div>
          );
        } else {
          const fleetRobotIds=robots.filter(r=>r.fleet===fleetDetail.fId).map(r=>r.id);
          const orders=initOrders.filter(o=>fleetRobotIds.includes(o.robotId));
          const stLabel={done:"완료",running:"진행중",queued:"대기",error:"에러"};
          const stStyle={done:"text-emerald-700 bg-emerald-50",running:"text-blue-700 bg-blue-50",queued:"text-slate-600 bg-slate-100",error:"text-rose-700 bg-rose-50"};
          const fmtT=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
          return(
            <div className="bg-white border border-emerald-200 rounded-xl shadow-sm overflow-hidden mb-4">
              <div className="h-11 px-4 border-b border-emerald-100 bg-emerald-50/50 flex items-center gap-2">
                <Icon name="ClipboardList" size={14} className="text-emerald-600"/>
                <span className="text-[13px] font-semibold text-slate-900">{fName} · 작업 현황</span>
                <span className="text-[11px] text-slate-400 tnum">총 {orders.length}건</span>
                <button onClick={()=>setFleetDetail(null)} className="ml-auto text-slate-400 hover:text-slate-600"><Icon name="X" size={15}/></button>
              </div>
              <div className="p-4">
                {orders.length===0
                  ? <div className="py-5 text-center text-[12px] text-slate-400">작업 내역이 없습니다.</div>
                  : <table className="w-full text-[12.5px]">
                      <thead><tr className="text-left text-slate-400 border-b border-slate-100">
                        <th className="font-medium py-2 px-2 w-[110px]">작업 ID</th>
                        <th className="font-medium py-2 w-[100px]">로봇</th>
                        <th className="font-medium py-2 w-[70px]">시작</th>
                        <th className="font-medium py-2 w-[70px]">완료</th>
                        <th className="font-medium py-2 w-[80px]">상태</th>
                        <th className="font-medium py-2 pr-2">레시피</th>
                      </tr></thead>
                      <tbody>
                        {orders.map(o=>{
                          const rc=recipes.find(r=>r.id===o.recipeId);
                          return(
                            <tr key={o.id} className="border-b border-slate-50">
                              <td className="py-2 px-2 tnum text-slate-700 font-medium">{o.id}</td>
                              <td className="py-2 tnum text-slate-600">{o.robotId}</td>
                              <td className="py-2 tnum text-slate-500">{fmtT(o.start)}</td>
                              <td className="py-2 tnum text-slate-500">{o.end!=null?fmtT(o.end):<span className="text-slate-300">—</span>}</td>
                              <td className="py-2"><span className={"inline-block px-1.5 py-0.5 rounded text-[11px] font-medium "+(stStyle[o.status]||"text-slate-600 bg-slate-100")}>{stLabel[o.status]||o.status}</span></td>
                              <td className="py-2 pr-2 text-slate-600 truncate">{rc?.name||"—"}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>}
              </div>
            </div>
          );
        }
      })()}

      <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        {/* 헤더 + 필터 */}
        <div className="border-b border-slate-200">
          <div className="h-11 px-4 flex items-center gap-2">
            <Icon name="Table2" size={14} className="text-slate-500"/>
            <span className="text-[13px] font-semibold text-slate-900">로봇별 상세 현황</span>
            <span className="text-[11px] text-slate-400 tnum">{tableRobots.length}대</span>
            <div className="ml-auto flex items-center gap-2">
              {/* Fleet 다중 선택 */}
              <MultiSelectDropdown
                label="Fleet"
                value={tblFleetF}
                onChange={setTblFleetF}
                options={fleets.map(f=>({id:f.id,label:f.name,color:f.color}))}
                colorMap={Object.fromEntries(fleets.map(f=>[f.id,f.color]))}
              />
              {/* 상태 다중 선택 */}
              <MultiSelectDropdown
                label="상태"
                value={tblStatusF}
                onChange={setTblStatusF}
                options={statuses.map(s=>({id:s.id,label:s.label}))}
              />
              {/* 초기화 */}
              {(tblFleetF.size>0||tblStatusF.size>0)&&(
                <button onClick={()=>{setTblFleetF(new Set());setTblStatusF(new Set());}}
                  className="h-8 px-2.5 rounded-lg border border-rose-200 bg-white hover:bg-rose-50 text-rose-500 text-[12px] flex items-center gap-1">
                  <Icon name="RotateCcw" size={12}/> 초기화
                </button>
              )}
            </div>
          </div>
        </div>
        <table className="w-full text-[12.5px]">
          <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200 bg-slate-50/40">
            <th className="font-medium px-4 py-2.5">로봇 ID</th>
            <th className="font-medium py-2.5">Fleet</th>
            <th className="font-medium py-2.5 text-right w-[90px]">처리량</th>
            <th className="font-medium py-2.5 w-[150px]">성공률</th>
            <th className="font-medium py-2.5 text-right w-[80px]">에러</th>
            <th className="font-medium py-2.5 text-right pr-4 w-[110px]">평균 작업시간</th>
          </tr></thead>
          <tbody>
            {tableRobots.length===0&&(
              <tr><td colSpan={6} className="px-4 py-10 text-center text-[12.5px] text-slate-400">
                <Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>
                조건에 맞는 로봇이 없습니다.
              </td></tr>
            )}
            {tableRobots.map(r=>{
              const sm=statusMap[r.status], fm=fleetMeta(r.fleet);
              // 로봇별 기간 성과 지표 (id 기반 안정적 생성)
              const h=[...r.id].reduce((a,c)=>a+c.charCodeAt(0),0);
              const errors = r.status==="down" ? 3+(h%4) : (h%4);
              const throughput = 38 + (h%62);
              const successRate = Math.max(70, 100 - errors*3 - (h%4));
              const avgMin = (3 + (h%45)/10).toFixed(1);
              const srColor = successRate>=95?"#10b981":successRate>=85?"#d97706":"#e11d48";
              return(
                <tr key={r.id} className="border-b border-slate-100 hover:bg-slate-50/60">
                  <td className="px-4 py-3"><span className="font-semibold text-slate-900 tnum">{r.id}</span></td>
                  <td className="py-3 text-[11.5px] text-slate-700">{fm.name}</td>
                  <td className="py-3 text-right">
                    <span className="text-[12.5px] font-semibold text-slate-900 tnum">{throughput}</span>
                    <span className="text-[10.5px] text-slate-400 ml-0.5">건</span>
                  </td>
                  <td className="py-3 text-right">
                    <span className="tnum text-[11.5px] font-semibold" style={{color:srColor}}>{successRate}%</span>
                  </td>
                  <td className="py-3 text-right">
                    {errors>0
                      ? <span className="text-[11.5px] font-semibold text-rose-600 tnum">{errors}건</span>
                      : <span className="text-[11.5px] text-slate-300 tnum">0건</span>}
                  </td>
                  <td className="py-3 pr-4 text-right">
                    <span className="text-[12px] text-slate-700 tnum">{avgMin}분</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function RobotFormModal({title,init,lockId,existing,onClose,onSave}){
  const [id,setId]=useState(init?init.id:"");
  const [fleet,setFleet]=useState(init?init.fleet:fleets[0].id);
  const fleetVerOpts=(fId)=>{
    const nm=fleets.find(f=>f.id===fId)?.name;
    const vs=[...new Set(initFleetRegistry.filter(fr=>fr.name===nm).map(fr=>fr.version))];
    return vs.length?vs:[...new Set(initFleetRegistry.map(fr=>fr.version))];
  };
  const [version,setVersion]=useState(init?init.version:fleetVerOpts(fleets[0].id)[0]);
  const [initNode,setInitNode]=useState(init?init.initNode:mapNodes[0].id);
  const verList=(()=>{const vs=fleetVerOpts(fleet);return (init&&!vs.includes(init.version))?[init.version,...vs]:vs;})();
  const dup=!lockId&&existing.some(r=>r.id===id);
  const valid=id.trim().length>0&&!dup;
  return(
    <MgmtModal title={title} icon="Bot" onClose={onClose}
      footer={<>
        <button onClick={onClose} className="h-9 px-4 rounded-lg border border-slate-200 text-[12.5px] font-medium text-slate-600 hover:bg-slate-50">취소</button>
        <button onClick={()=>valid&&onSave({id:id.trim(),fleet,version,initNode,inUse:init?init.inUse:true})} disabled={!valid}
          className={"h-9 px-4 rounded-lg text-[12.5px] font-bold "+(valid?"bg-blue-600 text-white hover:bg-blue-700":"bg-slate-200 text-slate-400 cursor-not-allowed")}>저장</button>
      </>}>
      <MgmtField label="로봇 ID">
        <input value={id} onChange={e=>setId(e.target.value)} disabled={lockId} placeholder="예: Tool007" className={mgmtInpCls+(lockId?" bg-slate-50 text-slate-400":"")}/>
        {dup&&<div className="text-[11px] text-rose-500 mt-1">이미 존재하는 ID입니다.</div>}
      </MgmtField>
      <MgmtField label="Fleet 종류">
        <select value={fleet} onChange={e=>{const v=e.target.value;setFleet(v);setVersion(fleetVerOpts(v)[0]);}} className={mgmtSelCls}>
          {fleets.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
      </MgmtField>
      <MgmtField label="버전 (Fleet 관리에 등록된 버전)">
        <select value={version} onChange={e=>setVersion(e.target.value)} className={mgmtSelCls}>
          {verList.map(v=><option key={v} value={v}>{v}</option>)}
        </select>
      </MgmtField>
      <MgmtField label="초기 노드 설정">
        <select value={initNode} onChange={e=>setInitNode(e.target.value)} className={mgmtSelCls}>
          {mapNodes.map(n=><option key={n.id} value={n.id}>{n.id} · {n.label}</option>)}
        </select>
      </MgmtField>
    </MgmtModal>
  );
}
