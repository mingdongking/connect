const initPending = [
  {id:"new.user1", name:"신규1", dept:"A-FAB 기술팀",        fleets:["amr"],       role:"Engineer", requestedAt:"2026-05-12 09:30"},
  {id:"new.user2", name:"신규2", dept:"스마트팩토리팀",       fleets:["agv","arm"], role:"Admin",    requestedAt:"2026-05-13 14:22"},
  {id:"new.user3", name:"신규3", dept:"Digital Twin Center", fleets:["amr","agv","arm","semi"], role:"Engineer", requestedAt:"2026-05-14 10:05"},
];

function PermissionsView({ mode="employee" }) {
  const isPartner = mode==="partner";
  const [tab,setTab]=useState("list");
  const [users,setUsers]=useState(isPartner?initPartnerUsers:initUsers);
  const [pending,setPending]=useState(isPartner?initPartnerPending:initPending);
  const [fleetF,setFleetF]=useState(new Set());
  const [roleF,setRoleF]=useState(new Set());
  const [deptF,setDeptF]=useState(new Set());
  const [q,setQ]=useState("");
  const [page,setPage]=useState(1);
  const PAGE_SIZE=10;
  const [editUser,setEditUser]=useState(null);
  const [toast,setToast]=useState(null);
  const canEdit = ROLES.indexOf(CURRENT_USER.role) >= ROLES.indexOf("Admin");

  function showToast(msg,type="success"){setToast({msg,type});setTimeout(()=>setToast(null),2500);}

  const filtered = users.filter(u=>{
    if(fleetF.size>0 && !u.fleets.some(f=>fleetF.has(f))) return false;
    if(roleF.size>0 && !roleF.has(u.role)) return false;
    if(deptF.size>0 && !deptF.has(u.dept)) return false;
    if(q && !u.id.toLowerCase().includes(q.toLowerCase()) &&
           !u.name.includes(q) &&
           !u.dept.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  const paged = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  function resetPage(){ setPage(1); }

  function handleDelete(id){
    if(id===CURRENT_USER.id) return showToast("자신의 계정은 삭제할 수 없습니다.","error");
    setUsers(p=>p.filter(u=>u.id!==id));
    showToast("사용자 권한이 삭제되었습니다.");
  }
  function handleApprove(p){
    setUsers(prev=>[...prev,{id:p.id,name:p.name,dept:p.dept,fleets:p.fleets,role:p.role,joined:new Date().toISOString().slice(0,10)}]);
    setPending(prev=>prev.filter(x=>x.id!==p.id));
    showToast(`${p.id} 승인 완료`);
  }
  function handleReject(id){setPending(prev=>prev.filter(x=>x.id!==id));showToast("승인 요청이 거절되었습니다.","warn");}
  function handleEditSave(userId,newRole,newFleets,newDept){
    setUsers(p=>p.map(u=>u.id===userId?{...u,role:newRole,fleets:newFleets,dept:newDept}:u));
    setEditUser(null);
    showToast("권한이 수정되었습니다.");
  }

  const fleetBadge = (fId) => {
    const f = fleets.find(fl=>fl.id===fId);
    return f ? <span key={fId} className="inline-flex items-center gap-1 px-1.5 py-px rounded text-[10px] font-semibold" style={{background:f.color+"20",color:f.color}}>{f.name}</span> : null;
  };

  return (
    <div className="h-full overflow-auto p-6 bg-slate-50">
      {/* Header */}
      <div className="flex items-end justify-between mb-5">
        <div>
          <h1 className="text-[20px] font-semibold text-slate-900 tracking-tight">{isPartner?"권한 관리(협력사)":"권한 관리(임직원)"}</h1>
          <p className="text-[12.5px] text-slate-500 mt-0.5">{isPartner?"협력사 사용자 접근 권한을 관리합니다.":"Fleet 별 사용자 접근 권한을 관리합니다."} Admin 이상 권한 소유자만 수정 가능합니다.</p>
        </div>
      </div>

      {/* Card */}
      <div className="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
        {/* Tabs + toolbar */}
        <div className="border-b border-slate-200">
          <div className="px-4 flex items-center gap-1 h-12">
            <button onClick={()=>setTab("list")} className={"h-8 px-4 rounded-md text-[13px] font-medium flex items-center gap-2 "+(tab==="list"?"bg-blue-50 text-blue-700":"text-slate-600 hover:bg-slate-50")}>
              <Icon name="Users" size={14}/> 권한 목록
              <span className={"text-[11px] px-1.5 py-0.5 rounded-full tnum "+(tab==="list"?"bg-blue-100 text-blue-700":"bg-slate-100 text-slate-500")}>{users.length}</span>
            </button>
            <button onClick={()=>setTab("pending")} className={"h-8 px-4 rounded-md text-[13px] font-medium flex items-center gap-2 "+(tab==="pending"?"bg-amber-50 text-amber-700":"text-slate-600 hover:bg-slate-50")}>
              <Icon name="Clock" size={14}/> 승인 대기
              {pending.length>0&&<span className={"text-[11px] px-1.5 py-0.5 rounded-full tnum font-semibold "+(tab==="pending"?"bg-amber-200 text-amber-800":"bg-rose-100 text-rose-600")}>{pending.length}</span>}
            </button>
          </div>
          {/* 필터 툴바 */}
          {tab==="list"&&(
            <div className="px-4 pb-3 flex items-center gap-2 flex-wrap">
              {/* 검색 */}
              <div className="relative">
                <Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>
                <input value={q} onChange={e=>{setQ(e.target.value);resetPage();}}
                  placeholder="ID · 이름 · 부서 검색"
                  className="h-8 pl-7 pr-7 w-[200px] rounded-md border border-slate-200 bg-slate-50 text-[12px] outline-none focus:border-blue-400 focus:bg-white"/>
                {q&&<button onClick={()=>{setQ("");resetPage();}} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><Icon name="X" size={11}/></button>}
              </div>
              {/* 부서 */}
              <MultiSelectDropdown
                label={isPartner?"업체":"부서"}
                value={deptF}
                onChange={v=>{setDeptF(v);resetPage();}}
                options={(isPartner?PARTNER_COMPANIES:DEPTS).map(d=>({id:d,label:d}))}
              />
              {/* Fleet */}
              <MultiSelectDropdown
                label="Fleet"
                value={fleetF}
                onChange={v=>{setFleetF(v);resetPage();}}
                options={fleets.map(f=>({id:f.id,label:f.name,color:f.color}))}
                colorMap={Object.fromEntries(fleets.map(f=>[f.id,f.color]))}
              />
              {/* 권한 */}
              <MultiSelectDropdown
                label="권한"
                value={roleF}
                onChange={v=>{setRoleF(v);resetPage();}}
                options={ROLES.map(r=>({id:r,label:r}))}
              />
              <span className="ml-auto text-[11.5px] text-slate-400 tnum">{filtered.length}명</span>
            </div>
          )}
        </div>

        {/* 권한 목록 */}
        {tab==="list"&&(<>
          <table className="w-full text-[12.5px]">
            <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200 bg-slate-50/40">
              <th className="font-medium px-4 py-2.5">사용자 ID</th>
              <th className="font-medium py-2.5">이름</th>
              <th className="font-medium py-2.5">부서</th>
              <th className="font-medium py-2.5 min-w-[180px]">Fleet 권한</th>
              <th className="font-medium py-2.5">권한 등급</th>
              <th className="font-medium py-2.5">등록일</th>
              {canEdit&&<th className="font-medium py-2.5 text-right pr-4">액션</th>}
            </tr></thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={7} className="px-4 py-12 text-center text-[12.5px] text-slate-400"><Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>검색 결과가 없습니다.</td></tr>}
              {paged.map(u=>(
                <tr key={u.id} className="border-b border-slate-100 hover:bg-slate-50/60 group">
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-gradient-to-br from-slate-400 to-slate-600 grid place-items-center text-white text-[11px] font-semibold shrink-0">{u.name[0]}</div>
                      <span className="font-mono text-[12px] text-slate-800">{u.id}</span>
                      {u.id===CURRENT_USER.id&&<span className="text-[9.5px] font-semibold px-1.5 py-px rounded bg-blue-100 text-blue-700">나</span>}
                    </div>
                  </td>
                  <td className="py-3 text-slate-800 font-medium">{u.name}</td>
                  <td className="py-3 text-[11.5px] text-slate-600">{u.dept}</td>
                  <td className="py-3">
                    <div className="flex flex-wrap gap-1">
                      {u.fleets.length===fleets.length
                        ? <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px] font-medium"><Icon name="Globe" size={10}/> 전체</span>
                        : u.fleets.map(fId=>fleetBadge(fId))
                      }
                    </div>
                  </td>
                  <td className="py-3">
                    <span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11.5px] font-semibold "+ROLE_COLOR[u.role]}>
                      {u.role==="Master"&&<Icon name="Crown" size={10}/>}
                      {u.role==="Admin"&&<Icon name="ShieldCheck" size={10}/>}
                      {u.role==="Engineer"&&<Icon name="Wrench" size={10}/>}
                      {u.role}
                    </span>
                  </td>
                  <td className="py-3 tnum text-[11.5px] text-slate-500">{u.joined}</td>
                  {canEdit&&(
                    <td className="py-3 pr-4 text-right">
                      <div className="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition">
                        {u.id!==CURRENT_USER.id&&<>
                          <button onClick={()=>setEditUser({...u,fleets:[...u.fleets]})} className="h-7 px-2.5 rounded border border-slate-200 bg-white hover:bg-blue-50 hover:border-blue-300 text-[11px] font-medium text-slate-600 hover:text-blue-700 flex items-center gap-1">
                            <Icon name="Pencil" size={11}/> 수정
                          </button>
                          <button onClick={()=>handleDelete(u.id)} className="h-7 px-2 rounded border border-rose-200 bg-white hover:bg-rose-50 text-[11px] font-medium text-rose-500 hover:text-rose-700 flex items-center gap-1">
                            <Icon name="Trash2" size={11}/> 삭제
                          </button>
                        </>}
                      </div>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>

          {/* 페이징 */}
          <div className="h-12 px-4 border-t border-slate-200 flex items-center justify-between bg-slate-50/40">
            <span className="text-[11.5px] text-slate-500 tnum">
              {filtered.length===0?"0명":`${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,filtered.length)} / ${filtered.length}명`}
            </span>
            <div className="flex items-center gap-1">
              <button onClick={()=>setPage(1)} disabled={page===1} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronsLeft" size={13}/></button>
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronLeft" size={13}/></button>
              {Array.from({length:totalPages},(_,i)=>i+1)
                .filter(p=>p===1||p===totalPages||Math.abs(p-page)<=1)
                .reduce((acc,p,i,arr)=>{if(i>0&&arr[i-1]!==p-1)acc.push("...");acc.push(p);return acc;},[])
                .map((p,i)=>p==="..."
                  ?<span key={"e"+i} className="w-7 h-7 grid place-items-center text-[12px] text-slate-400">{"…"}</span>
                  :<button key={p} onClick={()=>setPage(p)} className={"w-7 h-7 grid place-items-center rounded text-[12px] font-medium "+(p===page?"bg-blue-600 text-white":"hover:bg-slate-100 text-slate-600")}>{p}</button>
                )
              }
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronRight" size={13}/></button>
              <button onClick={()=>setPage(totalPages)} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600"><Icon name="ChevronsRight" size={13}/></button>
            </div>
          </div>
        </>)}

        {/* 승인 대기 */}
        {tab==="pending"&&(
          pending.length===0
            ?<div className="py-16 text-center"><Icon name="CheckCircle2" size={28} className="mx-auto mb-3 text-emerald-400"/><div className="text-[13px] font-medium text-slate-600">승인 대기 요청이 없습니다.</div></div>
            :<table className="w-full text-[12.5px]">
              <thead><tr className="text-left text-[11px] text-slate-500 border-b border-slate-200 bg-slate-50/40">
                <th className="font-medium px-4 py-2.5">사용자 ID</th>
                <th className="font-medium py-2.5">이름</th>
                <th className="font-medium py-2.5">부서</th>
                <th className="font-medium py-2.5">요청 Fleet</th>
                <th className="font-medium py-2.5">요청 권한</th>
                <th className="font-medium py-2.5">요청 일시</th>
                <th className="font-medium py-2.5 text-right pr-4">액션</th>
              </tr></thead>
              <tbody>
                {pending.map(p=>(
                  <tr key={p.id} className="border-b border-slate-100 hover:bg-slate-50/60">
                    <td className="px-4 py-3 font-mono text-[12px] text-slate-800">{p.id}</td>
                    <td className="py-3 text-slate-800 font-medium">{p.name}</td>
                    <td className="py-3 text-[11.5px] text-slate-600">{p.dept}</td>
                    <td className="py-3">
                      <div className="flex flex-wrap gap-1">
                        {p.fleets.length===fleets.length
                          ?<span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px]"><Icon name="Globe" size={10}/> 전체</span>
                          :p.fleets.map(fId=>fleetBadge(fId))
                        }
                      </div>
                    </td>
                    <td className="py-3"><span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11.5px] font-semibold "+ROLE_COLOR[p.role]}>{p.role}</span></td>
                    <td className="py-3 tnum text-[11.5px] text-slate-500">{p.requestedAt}</td>
                    <td className="py-3 pr-4 text-right">
                      <div className="flex items-center justify-end gap-1.5">
                        {canEdit?<>
                          <button onClick={()=>handleApprove(p)} className="h-7 px-3 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white text-[11.5px] font-medium flex items-center gap-1"><Icon name="Check" size={11}/> 승인</button>
                          <button onClick={()=>handleReject(p.id)} className="h-7 px-3 rounded-md border border-rose-200 bg-white hover:bg-rose-50 text-rose-600 text-[11.5px] font-medium flex items-center gap-1"><Icon name="X" size={11}/> 거절</button>
                        </>:<span className="text-[11px] text-slate-400 flex items-center gap-1"><Icon name="Lock" size={10}/> Admin 이상 권한 필요</span>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
        )}
      </div>

      {/* 수정 모달 */}
      {editUser&&(
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4" onClick={()=>setEditUser(null)}>
          <div className="w-[460px] bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden" onClick={e=>e.stopPropagation()}>
            <div className="h-12 px-5 border-b border-slate-200 flex items-center gap-2">
              <div className="w-7 h-7 rounded-md bg-blue-50 grid place-items-center text-blue-600"><Icon name="Pencil" size={14}/></div>
              <h3 className="text-[14px] font-semibold text-slate-900">권한 수정</h3>
              <button onClick={()=>setEditUser(null)} className="ml-auto w-7 h-7 grid place-items-center rounded hover:bg-slate-100 text-slate-500"><Icon name="X" size={14}/></button>
            </div>
            <div className="p-5 space-y-4">
              {/* 사용자 정보 */}
              <div className="flex items-center gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-slate-400 to-slate-600 grid place-items-center text-white font-semibold">{editUser.name[0]}</div>
                <div><div className="font-mono text-[13px] font-semibold text-slate-900">{editUser.id}</div><div className="text-[11px] text-slate-500">{editUser.name} {"·"} {editUser.dept}</div></div>
              </div>
              {/* 부서 */}
              <div>
                <div className="text-[11px] font-medium text-slate-500 mb-1.5">부서</div>
                <div className="relative">
                  <select value={editUser.dept} onChange={e=>setEditUser({...editUser,dept:e.target.value})} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] outline-none focus:border-blue-400 appearance-none">
                    {(isPartner?PARTNER_COMPANIES:DEPTS).map(d=><option key={d} value={d}>{d}</option>)}
                  </select>
                  <Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                </div>
              </div>
              {/* Fleet 권한 {"—"} 다중 선택 */}
              <div>
                <div className="text-[11px] font-medium text-slate-500 mb-1.5 flex items-center justify-between">
                  <span>Fleet 접근 권한</span>
                  <button onClick={()=>setEditUser({...editUser,fleets:editUser.fleets.length===fleets.length?[]:fleets.map(f=>f.id)})}
                    className="text-[10.5px] text-blue-600 hover:text-blue-800">
                    {editUser.fleets.length===fleets.length?"전체 해제":"전체 선택"}
                  </button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {fleets.map(f=>{
                    const on=editUser.fleets.includes(f.id);
                    return (
                      <button key={f.id} onClick={()=>{
                        const next=on?editUser.fleets.filter(x=>x!==f.id):[...editUser.fleets,f.id];
                        setEditUser({...editUser,fleets:next});
                      }}
                      className={"h-9 rounded-lg border-2 flex items-center gap-2 px-3 transition "+(on?"border-current":"border-slate-200 hover:border-slate-300")}
                      style={on?{background:f.color+"15",borderColor:f.color,color:f.color}:{color:"#64748b"}}>
                        
                        <span className="text-[12px] font-medium">{f.name}</span>
                        {on&&<Icon name="Check" size={11} className="ml-auto"/>}
                      </button>
                    );
                  })}
                </div>
              </div>
              {/* 권한 등급 */}
              <div>
                <div className="text-[11px] font-medium text-slate-500 mb-1.5">권한 등급</div>
                <div className="grid grid-cols-3 gap-2">
                  {ROLES.map(r=>(
                    <button key={r} onClick={()=>setEditUser({...editUser,role:r})}
                      className={"h-10 rounded-lg border-2 text-[12.5px] font-semibold transition flex flex-col items-center justify-center gap-0.5 "+
                        (editUser.role===r?ROLE_COLOR[r]+" border-current":"border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50")}>
                      {r==="Master"&&<Icon name="Crown" size={12}/>}
                      {r==="Admin"&&<Icon name="ShieldCheck" size={12}/>}
                      {r==="Engineer"&&<Icon name="Wrench" size={12}/>}
                      {r}
                    </button>
                  ))}
                </div>
                <div className="mt-2 text-[10.5px] text-slate-400 flex items-center gap-1"><Icon name="Info" size={10}/> Engineer &lt; Admin &lt; Master 순으로 권한이 높아집니다.</div>
              </div>
            </div>
            <div className="h-14 px-5 border-t border-slate-200 bg-slate-50/50 flex items-center gap-2">
              <button onClick={()=>setEditUser(null)} className="ml-auto h-9 px-3.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">취소</button>
              <button onClick={()=>handleEditSave(editUser.id,editUser.role,editUser.fleets,editUser.dept)}
                disabled={editUser.fleets.length===0}
                className="h-9 px-4 rounded-md bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-[12.5px] font-medium flex items-center gap-1.5">
                <Icon name="Check" size={13}/> 저장
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast&&(
        <div className={"fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-lg shadow-xl flex items-center gap-2.5 text-[12.5px] font-medium "+(toast.type==="error"?"bg-rose-600 text-white":toast.type==="warn"?"bg-amber-500 text-white":"bg-slate-900 text-white")}>
          <Icon name={toast.type==="error"?"AlertCircle":toast.type==="warn"?"AlertTriangle":"Check"} size={14}/>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════ */
function App() {
  useEffect(()=>{const el=document.createElement("style");el.textContent=CSS;document.head.appendChild(el);return()=>document.head.removeChild(el);},[]);
  const [active,setActive]=useState("home");
  const [cmdOpen,setCmdOpen]=useState(false);
  const [focusRcp,setFocusRcp]=useState(null);
  const [recipeRev,setRecipeRev]=useState(0);
  const [logsInitCat3,setLogsInitCat3]=useState(null);
  const [isDark,setIsDark]=useState(false);
  const [pendingOrder,setPendingOrder]=useState(null);
  // 글로벌 팝업 (transform 스택 컨텍스트 회피)
  const [globalPopup,setGlobalPopup]=useState(null); // {type, data}
  useEffect(()=>{ document.documentElement.classList.toggle("dm", isDark); },[isDark]);

  function navigate(id, opts={}){
    if(id==="popup"){ setGlobalPopup(opts.popup||null); return; }
    setActive(id);
    if(opts.logsCat3) setLogsInitCat3(opts.logsCat3);
    if(opts.pendingOrder){ setPendingOrder(opts.pendingOrder); }
  }

  function saveRecipe(recipe) {
    const idx = recipes.findIndex(r=>r.id===recipe.id);
    if (idx>=0) recipes[idx] = recipe;
    else recipes.push(recipe);
    setRecipeRev(n=>n+1); // 전체 re-render 트리거
  }

  useEffect(()=>{
    const fn=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setCmdOpen(o=>!o);}else if(e.key==="Escape")setCmdOpen(false);};
    window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
  },[]);

  function handleJump({view,payload}){
    if(view==="schedule"&&payload?.focusRecipeId){setFocusRcp(payload.focusRecipeId);setTimeout(()=>setFocusRcp(null),4500);}
    setActive(view);
  }
  const activeMeta = NAV_FLAT.find(n=>n.id===active);
  return (
    <div className="h-screen w-screen flex overflow-hidden bg-slate-50">
      {/* ── 글로벌 팝업 레이어 (transform 영향 없음) ── */}
      {globalPopup?.type==="cmd-delivery"&&(
        <div className="fixed inset-0 z-[9999] bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4" onClick={()=>setGlobalPopup(null)}>
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-[360px] p-5" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center gap-3 mb-3">
              <div className="w-9 h-9 rounded-xl bg-amber-100 grid place-items-center shrink-0"><Icon name="AlertTriangle" size={18} className="text-amber-600"/></div>
              <div className="text-[14px] font-bold text-slate-900">작업 요청 화면 이동 필요</div>
            </div>
            <p className="text-[12.5px] text-slate-600 leading-relaxed mb-4">선택한 Fleet은 작업 요청 화면에서<br/>Pick/Drop 위치를 지정해야 합니다.<br/>작업 요청 화면으로 이동하시겠습니까?</p>
            <div className="flex gap-2 justify-end">
              <button onClick={()=>setGlobalPopup(null)} className="h-8 px-4 rounded-lg border border-slate-200 text-[12.5px] font-medium text-slate-700 hover:bg-slate-50">아니오</button>
              <button onClick={()=>{setGlobalPopup(null);navigate("order-template");}} className="h-8 px-4 rounded-lg bg-blue-600 text-white text-[12.5px] font-semibold hover:bg-blue-700">네</button>
            </div>
          </div>
        </div>
      )}
      {globalPopup?.type==="cmd-queue"&&globalPopup?.data&&(
        <div className="fixed inset-0 z-[9999] bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4" onClick={()=>setGlobalPopup(null)}>
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-[360px] p-5" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center gap-3 mb-3">
              <div className="w-9 h-9 rounded-xl bg-blue-100 grid place-items-center shrink-0"><Icon name="Clock" size={18} className="text-blue-600"/></div>
              <div className="text-[14px] font-bold text-slate-900">대기 후 진행 예약</div>
            </div>
            <p className="text-[12.5px] text-slate-600 leading-relaxed mb-4">
              현재 작업이 완료되고 바로<br/>
              <span className="font-semibold text-slate-900">{globalPopup?.data?.newRecipe}</span> 작업을 진행할게요!
            </p>
            <div className="flex justify-end">
              <button onClick={()=>setGlobalPopup(null)} className="h-8 px-5 rounded-lg bg-blue-600 text-white text-[12.5px] font-semibold hover:bg-blue-700">확인</button>
            </div>
          </div>
        </div>
      )}
      <Sidebar active={active} onChange={setActive}/>
      <div className="flex-1 min-w-0 flex flex-col">
        <Header activeLabel={activeMeta?.label||""} onOpenCmd={()=>setCmdOpen(true)}/>
        <main className="flex-1 min-h-0 relative">
          <div style={{display:active==="home"?"contents":"none"}}><MonitoringHome onNavigate={navigate}/></div>
          <div style={{display:active==="work"?"contents":"none"}}><RecipeView onSaveRecipe={saveRecipe}/></div>
          <div style={{display:active==="order-template"?"contents":"none"}}><OrderTemplateView onNavigate={navigate}/></div>
          <div style={{display:active==="schedule"?"contents":"none"}}><SchedulerView initialFocusRecipeId={focusRcp} pendingOrder={pendingOrder} onMounted={()=>setPendingOrder(null)} onNavigate={navigate}/></div>
          <div style={{display:active==="analytics"?"contents":"none"}}><AnalyticsView/></div>
          <div style={{display:active==="robot-status"?"contents":"none"}}><RobotStatusView/></div>
          <div style={{display:active==="infra-status"?"contents":"none"}}><InfraStatusView/></div>
          <div style={{display:active==="logs"?"contents":"none"}}><LogsView initCat3={logsInitCat3} onMounted={()=>setLogsInitCat3(null)}/></div>
          <div style={{display:active==="basis"?"contents":"none"}}><BasisView/></div>
          <div style={{display:active==="basis-fleet"?"contents":"none"}}><FleetMgmtView/></div>
          <div style={{display:active==="basis-robot"?"contents":"none"}}><RobotMgmtView/></div>
          <div style={{display:active==="basis-cart"?"contents":"none"}}><ToolCartView/></div>
          <div style={{display:active==="basis-map"?"contents":"none"}}><MapMgmtView/></div>
          <div style={{display:active==="basis-infra"?"contents":"none"}}><BasisEmptyView label="인프라 관리" icon="Server"/></div>
          <div style={{display:active==="basis-alarm"?"contents":"none"}}><AlarmMgmtView/></div>
          <div style={{display:active==="permissions"?"contents":"none"}}><PermissionsView/></div>
          <div style={{display:active==="permissions-approval"?"contents":"none"}}><PermissionsView tab="approval"/></div>
          <div style={{display:active==="permissions-partner"?"contents":"none"}}><PermissionsView mode="partner"/></div>
          <div style={{display:active==="permissions-partner-approval"?"contents":"none"}}><BasisEmptyView label="승인/거절 이력 (협력사)" icon="ClipboardList"/></div>
          <div style={{display:active==="map-editor"?"contents":"none"}}><MapEditorView/></div>
        </main>
      </div>
      <CommandPalette open={cmdOpen} onClose={()=>setCmdOpen(false)} onJump={handleJump}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
