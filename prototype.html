/* ════════════════════════════════
   DARK MODE  (.dm on <html>)
════════════════════════════════ */
html.dm { color-scheme: dark; }

/* ── 전체 기본값 ── */
html.dm body,
html.dm #root,

html.dm .hover\:bg-slate-50:hover   { background-color:#1e293b !important; }

/* ── 입력 요소 ── */
html.dm input,
html.dm select,

  background-color:#1e293b !important;

}

/* ── 인라인 white 덮어쓰기 (강제) ── */
html.dm [style*="background:white"],
html.dm [style*="background: white"],
html.dm [style*="background:#fff"],
html.dm [style*="background-color:white"],
html.dm [style*="background-color: white"],
html.dm [style*="background: rgb(255"] {
  background-color:#1e293b !important;
}

/* ── 슬라이드 패널 / 모달 / 드롭다운 ── */
html.dm [style*="background:"white""],
html.dm aside,
html.dm header,
html.dm .rounded-xl,
html.dm .rounded-lg,
html.dm .rounded-md {
  /* 아래 규칙에서 보정 */
}

/* ── 특정 컴포넌트 배경 강제 ── */

/* ── 슬라이드 패널 (position:fixed/absolute, bg white inline) ── */

html.dm div[style*="background: #fff"],
html.dm div[style*="background:"white""] {

/* ── 드롭다운 팝업 ── */
html.dm .shadow-xl,

/* ── 로봇 맵 마커 흰색 배경 ── */

html.dm *[style] {

}

/* ── 슬라이드패널 탭 버튼 ── */

html.dm *::-webkit-scrollbar     { background:#0f172a; }

function Sidebar({ active, onChange }) {
  // 현재 active의 부모 찾기
  const activeParent = NAV.find(n=>n.children?.find(c=>c.id===active));
  const [expanded, setExpanded] = useState(()=>new Set(activeParent?[activeParent.id]:[]));

  useEffect(()=>{
    const parent = NAV.find(n=>n.children?.find(c=>c.id===active));
    if (parent) setExpanded(prev=>new Set([...prev, parent.id]));
  }, [active]);

  function toggleExpand(id){ setExpanded(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;}); }

  return (
    <aside className="w-56 shrink-0 h-full border-r border-slate-200 bg-white flex flex-col">
      <div className="h-14 flex items-center gap-2.5 px-4 border-b border-slate-200">
        <div className="leading-tight">
          <div className="text-[13px] font-semibold text-slate-900">Connect</div>
        </div>
      </div>
      <nav className="flex-1 overflow-y-auto p-2">
        <div className="text-[10.5px] font-medium text-slate-400 uppercase tracking-wider px-2.5 pt-3 pb-1.5">Workspace</div>
        {NAV.map(n => {
          const isOn = n.id===active;
          const hasChildren = !!n.children;
          const isExpanded = expanded.has(n.id);
          const childActive = hasChildren && n.children.some(c=>c.id===active);

          return (
            <div key={n.id}>
              <button
                onClick={()=>{ onChange(n.id); if(hasChildren) toggleExpand(n.id); }}
                className={"w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-[13px] font-medium transition-colors mb-0.5 "+
                  (isOn||childActive?"bg-blue-50 text-blue-700":"text-slate-700 hover:bg-slate-100")}>
                <Icon name={n.icon} size={16} strokeWidth={(isOn||childActive)?2:1.75} className={(isOn||childActive)?"text-blue-600":"text-slate-500"}/>
                <span>{n.label}</span>
                {hasChildren ? (
                  <Icon name={isExpanded?"ChevronDown":"ChevronRight"} size={13} className="ml-auto text-slate-400"/>
                ) : (
                  isOn && <span className="ml-auto w-1 h-4 rounded-full bg-blue-600"/>
                )}
              </button>
              {/* 자식 메뉴 */}
              {hasChildren && isExpanded && (
                <div className="ml-3 pl-2 border-l border-slate-200 mb-1">
                  {n.children.map(c=>{
                    const cOn = c.id===active;
                    return (
                      <button key={c.id} onClick={()=>onChange(c.id)}
                        className={"w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[12.5px] font-medium transition-colors mb-0.5 "+
                          (cOn?"bg-blue-50 text-blue-700":"text-slate-600 hover:bg-slate-100")}>
                        <Icon name={c.icon} size={14} strokeWidth={cOn?2:1.75} className={cOn?"text-blue-500":"text-slate-400"}/>
                        <span>{c.label}</span>
                        {cOn && <span className="ml-auto w-1 h-3.5 rounded-full bg-blue-600"/>}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </nav>
      <div className="p-3 border-t border-slate-200">
        <div className="rounded-lg bg-slate-50 border border-slate-200 p-2.5">
          <div className="flex items-center gap-2 text-[11.5px] text-slate-500">
            <Icon name="Activity" size={12} className="text-emerald-500"/>
            <span>모든 시스템 정상</span>

        </div>
      </div>
    </aside>
  );
}

function CommandPalette({ open, onClose, onJump }) {
  const [q, setQ] = useState("");

  useEffect(()=>{ if(open) setTimeout(()=>ref.current?.focus(),50); else setQ(""); },[open]);
  if (!open) return null;
  const ql = q.toLowerCase();
  const sections = [
    { title:"템플릿", icon:"Workflow",
      items: recipes.filter(r=>!q||r.name.toLowerCase().includes(ql)).slice(0,5).map(r=>({
        key:"r-"+r.id, left:r.name, right:r.id, jump:{view:"schedule",payload:{focusRecipe:r.id}}
      }))
    },
    { title:"로봇", icon:"Bot",
      items: robots.filter(r=>!q||r.id.toLowerCase().includes(ql)).slice(0,4).map(r=>({
        key:"b-"+r.id, left:r.id, right:r.task||"Idle", jump:{view:"home",payload:{}}

      items: NAV_FLAT.filter(n=>!q||n.label.includes(q)).map(n=>({
        key:"n-"+n.id, left:n.label, right:"메뉴", jump:{view:n.id,payload:{}}
      }))
    },
  ].filter(s=>s.items.length>0);
  return (
    <div className="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-sm flex items-start justify-center pt-[14vh]" onClick={onClose}>
      <div className="w-[580px] bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 px-4 h-14 border-b border-slate-200">
          <Icon name="Search" size={18} className="text-slate-400"/>
          <input ref={ref} value={q} onChange={e=>setQ(e.target.value)}
            placeholder="레시피, 로봇 ID, 또는 메뉴를 입력하세요..."

          {sections.length===0&&<div className="px-4 py-8 text-center text-[13px] text-slate-400">결과가 없습니다.</div>}

function KpiFleetFilter({ selected, setSelected }) {
  const [open,setOpen]=React.useState(false);
  const allOn = selected.size===fleets.length;
  const label = allOn ? "전체 Fleet"
    : selected.size===0 ? "선택 안함"
    : selected.size===1 ? (fleets.find(f=>selected.has(f.id))?.name||"1개")
    : selected.size+"개 Fleet";
  const toggle=(id)=>{const n=new Set(selected); n.has(id)?n.delete(id):n.add(id); setSelected(n);};
  const toggleAll=()=>{ setSelected(allOn?new Set():new Set(fleets.map(f=>f.id))); };
  return(
    <div className="relative" onClick={e=>e.stopPropagation()} onDoubleClick={e=>e.stopPropagation()}>
      <button onClick={()=>setOpen(o=>!o)}
        className="flex items-center gap-1 text-[10.5px] text-slate-600 border border-slate-200 rounded-md pl-2 pr-1.5 py-0.5 hover:border-slate-300 bg-white">
        {label}<Icon name="ChevronDown" size={11} className="text-slate-400"/>
      </button>
      {open&&<>
        <div className="fixed inset-0 z-10" onClick={()=>setOpen(false)}/>
        <div className="absolute right-0 top-full mt-1 z-20 bg-white border border-slate-200 rounded-lg shadow-lg py-1 w-44">
          <button onClick={toggleAll} className="w-full flex items-center gap-2 px-2.5 py-1.5 text-[12px] hover:bg-slate-50">
            <span className={"w-3.5 h-3.5 rounded border flex items-center justify-center "+(allOn?"bg-blue-600 border-blue-600":"border-slate-300")}>{allOn&&<Icon name="Check" size={10} className="text-white"/>}</span>
            <span className="font-medium text-slate-700">전체</span>
          </button>
          <div className="h-px bg-slate-100 my-1"/>
          {fleets.map(f=>{const on=selected.has(f.id);return(
            <button key={f.id} onClick={()=>toggle(f.id)} className="w-full flex items-center gap-2 px-2.5 py-1.5 text-[12px] hover:bg-slate-50">
              <span className={"w-3.5 h-3.5 rounded border flex items-center justify-center "+(on?"border-transparent":"border-slate-300")} style={on?{background:f.color}:{}}>{on&&<Icon name="Check" size={10} className="text-white"/>}</span>
              <span className="text-slate-700 truncate">{f.name}</span>
            </button>
          );})}
        </div>
      </>}
    </div>
  );
}

              <span className="text-[10.5px] font-medium text-slate-500 uppercase mr-1">상태</span>
              <button onClick={()=>setStatusFilter(new Set())} className={"h-6 px-2 rounded text-[10.5px] font-medium border "+(statusFilter.size===0?"bg-slate-900 text-white border-slate-900":"bg-white text-slate-600 border-slate-200")}>전체</button>
              {statuses.map(s=>{const on=statusFilter.has(s.id);return <button key={s.id} onClick={()=>toggle(statusFilter,s.id,setStatusFilter)} className={"h-6 px-2 rounded text-[10.5px] font-medium border flex items-center gap-1 "+(on?"text-white border-transparent":"bg-white text-slate-700 border-slate-200")} style={on?{background:s.color}:{}}><span className="w-1.5 h-1.5 rounded-full" style={{background:on?"#fff":s.color}}/>{s.short}<span className={"tnum "+(on?"opacity-80":"text-slate-400")}>{counts[s.id]}</span></button>;})}
            </div>
            <div className="h-4 w-px bg-slate-200"/>
            {/* Fleet 드롭다운 멀티셀렉트 */}
            <div className="relative">
              {fleetFilterOpen&&<div className="fixed inset-0 z-10" onClick={()=>setFleetFilterOpen(false)}/>}
              <button onClick={()=>setFleetFilterOpen(o=>!o)}
                className={"h-6 px-2.5 rounded text-[10.5px] font-medium border flex items-center gap-1.5 transition "+(fleetFilter.size>0?"bg-blue-600 text-white border-blue-600":"bg-white text-slate-600 border-slate-200 hover:border-slate-300")}>
                <span>Fleet</span>
                {fleetFilter.size>0&&<span className="bg-white/30 text-white text-[9px] font-bold px-1 rounded-sm">{fleetFilter.size}</span>}
                <Icon name="ChevronDown" size={10} className={fleetFilterOpen?"rotate-180 transition-transform":"transition-transform"}/>
              </button>
              {fleetFilterOpen&&(
                <div className="absolute z-20 top-full mt-1 left-0 w-[160px] bg-white rounded-lg shadow-xl border border-slate-200 overflow-hidden">
                  <div className="px-3 py-1.5 text-[10px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100">Fleet 선택 (복수 가능)</div>
                  {fleets.map(f=>{
                    const on=fleetFilter.has(f.id);
                    return(
                      <button key={f.id} onClick={()=>{const n=new Set(fleetFilter);on?n.delete(f.id):n.add(f.id);setFleetFilter(n);}}
                        className={"w-full flex items-center gap-2.5 px-3 py-2 hover:bg-slate-50 "+(on?"":"opacity-60")}>
                        <div className={"w-4 h-4 rounded border-2 grid place-items-center shrink-0 transition "+(on?"border-transparent":"border-slate-300")} style={on?{background:f.color}:{}}>
                          {on&&<Icon name="Check" size={10} className="text-white"/>}
                        </div>
                        <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:f.color}}/>
                        <span className={"text-[12px] "+(on?"text-slate-800 font-medium":"text-slate-500")}>{f.name}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
            {/* 필터 초기화 버튼 */}
            {(fleetFilter.size>0||statusFilter.size>0)&&(
              <button onClick={()=>{setFleetFilter(new Set());setStatusFilter(new Set());}}
                className="h-6 px-2 rounded text-[10.5px] font-medium border border-slate-200 bg-white text-slate-500 hover:bg-slate-50 flex items-center gap-1">
                <Icon name="X" size={10}/> 초기화
              </button>
            )}
          </div>
          {/* Map canvas */}
          <div ref={mapCanvasRef}
            className={"relative dot-bg overflow-hidden "+(mapFullscreen?"flex-1":"")}
            onMouseDown={e=>{
              if(editMode) return;
              if(e.button!==0) return;
              e.preventDefault();
              mapPanRef.current={startX:e.clientX,startY:e.clientY,origTx:mapTx,origTy:mapTy,moved:false};
              setIsPanning(true);
            }}
            onMouseMove={e=>{
              handleMapMouseMove(e);
              if(!mapPanRef.current) return;
              const dx=e.clientX-mapPanRef.current.startX, dy=e.clientY-mapPanRef.current.startY;
              if(Math.abs(dx)<2&&Math.abs(dy)<2) return;
              mapPanRef.current.moved=true;
              setMapTx(mapPanRef.current.origTx+dx);
              setMapTy(mapPanRef.current.origTy+dy);
            }}
            onMouseUp={e=>{ handleMapMouseUp(e); mapPanRef.current=null; setIsPanning(false); }}
            onMouseLeave={e=>{ handleMapMouseUp(e); mapPanRef.current=null; setIsPanning(false); }}
            style={{cursor: isPanning?"grabbing":editMode?"default":"grab", ...(mapFullscreen?{}:{height:460})}}>
            {/* 줌/핏 컨트롤 */}
            {!editMode&&(
              <div className="absolute top-2 right-2 z-10 flex flex-col gap-1">
                <button onClick={()=>setMapScale(s=>Math.min(s*1.25,5))} className="w-7 h-7 bg-white border border-slate-200 rounded-md shadow-sm hover:bg-slate-50 text-slate-700 font-bold text-[16px] grid place-items-center select-none">+</button>
                <button onClick={()=>setMapScale(s=>Math.max(s/1.25,0.2))} className="w-7 h-7 bg-white border border-slate-200 rounded-md shadow-sm hover:bg-slate-50 text-slate-700 font-bold text-[16px] grid place-items-center select-none">-</button>
                <button onClick={()=>{setMapTx(0);setMapTy(0);setMapScale(1);}} title="전체 보기" className="w-7 h-7 bg-white border border-slate-200 rounded-md shadow-sm hover:bg-slate-50 grid place-items-center"><Icon name="Maximize2" size={12} className="text-slate-600"/></button>
              </div>
            )}
            {/* 스케일 표시 */}
            {!editMode&&(
              <div className="absolute bottom-2 left-2 z-10 text-[10px] font-mono bg-white/80 px-1.5 py-0.5 rounded border border-slate-200 text-slate-500 select-none">
                {Math.round(mapScale*100)}%
              </div>
            )}
            {/* 변환 레이어 */}
            <div style={{position:"absolute", left:0, top:0, transform:`translate(${mapTx}px,${mapTy}px) scale(${mapScale})`, transformOrigin:"0 0", willChange:"transform", userSelect:"none"}}>
            {/* Zone areas */}
            {/* Zone areas */}
            {layers.has("zone")&&editZones.map(z=>(
              <div key={z.id} className="absolute rounded pointer-events-none"
                style={{
                  left: z.x, top: z.y, width: z.w, height: z.h,
                  border: `1.5px dashed ${z.color}60`,
                  background: z.color + "12",
                }}>
                <span className="absolute top-1.5 left-2 text-[10px] font-semibold uppercase"
                  style={{color: z.color + "cc"}}>{z.name}</span>
              </div>
            ))}

            {/* Edges (SVG) */}
            {layers.has("edge")&&(
            <svg style={{position:"absolute", left:0, top:0, width:2000, height:2000, overflow:"visible", pointerEvents:"none"}}>
              <defs>
                <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8" opacity="0.7"/>
                </marker>
                <marker id="arr-sel" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/>
                </marker>
                <marker id="arr-hl" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L6,3 z" fill="#f59e0b"/>
                </marker>
              </defs>
              {mapEdges.map(e=>{
                const a=mapNodes.find(n=>n.id===e.from), b=mapNodes.find(n=>n.id===e.to);
                if(!a||!b) return null;
                const isSel    = selectedEdgeId===e.id;
                const isEditHl = editMode && editHighlightEdgeId===e.id;
                const ep = edgeProps[e.id]||{};
                const inactive = ep.inactive;
                const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
                const dist = Math.round(Math.sqrt((b.x-a.x)**2+(b.y-a.y)**2));
                const edgeColor = isSel?"#2563eb":isEditHl?"#f59e0b":inactive?"#e2e8f0":"#94a3b8";
                const edgeW     = (isSel||isEditHl)?2.5:1.5;
                const arrId     = isSel?"arr-sel":isEditHl?"arr-hl":"arr";
                return(
                  <g key={e.id} style={{pointerEvents:"all", cursor:"pointer"}}
                    onClick={()=>{
                      setSelectedEdgeId(isSel?null:e.id);
                      setSelectedNodeId(null);
                      setFocusRobot(null);
                      setFocusCart(null);
                      setPanelOpen(true); setCmdTab("props");
                    }}
                    onDoubleClick={()=>{
                      if(!editMode) return;
                      setEditHighlightEdgeId(e.id);
                      setEditTab("edge");
                      setSelectedEdgeId(e.id);
                      setSelectedNodeId(null);
                      setFocusRobot(null);
                      setFocusCart(null);
                      setPanelOpen(true);
                      setCmdTab("props");
                    }}>
                    <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="transparent" strokeWidth="10"/>
                    <line x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                      stroke={edgeColor} strokeWidth={edgeW}
                      strokeDasharray={inactive?"3 3":"5 3"}
                      opacity={inactive?0.4:isEditHl?1:0.8}
                      markerEnd={e.dir==="bi"?undefined:`url(#${arrId})`}/>
                    {e.dir==="bi"&&<line x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                      stroke={edgeColor} strokeWidth={edgeW}
                      strokeDasharray={inactive?"3 3":"5 3"} opacity={inactive?0.4:isEditHl?1:0.8}
                      markerEnd={`url(#${arrId})`} markerStart={`url(#${arrId})`}/>}
                    {isSel&&<text x={mx} y={my-6} textAnchor="middle" fill="#2563eb" fontSize={9} fontWeight="600">{e.id} {"·"} {dist}px</text>}
                    {isEditHl&&!isSel&&<text x={mx} y={my-6} textAnchor="middle" fill="#b45309" fontSize={9} fontWeight="700">{e.id}</text>}
                    {/* 레인컷 여부 ON → 중앙 X 표시 */}
                    {ep.laneCut&&(
                      <g>
                        <circle cx={mx} cy={my} r={7} fill="white" stroke="#e11d48" strokeWidth={1.5}/>
                        <line x1={mx-4} y1={my-4} x2={mx+4} y2={my+4} stroke="#e11d48" strokeWidth={2} strokeLinecap="round"/>
                        <line x1={mx+4} y1={my-4} x2={mx-4} y2={my+4} stroke="#e11d48" strokeWidth={2} strokeLinecap="round"/>
                      </g>
                    )}
                  </g>
                );
              })}
            </svg>)}

            {/* Nodes */}
            {layers.has("node")&&mapNodes.map(node=>{
              const isSelNode  = selectedNodeId === node.id;
              const isEditHl   = editMode && editHighlightNodeId === node.id;
              const nodeColor  = isSelNode ? "#2563eb" : isEditHl ? "#f59e0b" : "white";
              const borderClr  = isSelNode ? "#2563eb" : isEditHl ? "#f59e0b" : "#64748b";
              const nodeSize   = isSelNode ? 14 : isEditHl ? 13 : 10;
              return (
                <div key={node.id} className="absolute cursor-pointer group"
                  style={{left:node.x, top:node.y, transform:"translate(-50%,-50%)", zIndex:10}}
                  onClick={()=>{
                    setSelectedNodeId(isSelNode ? null : node.id);
                    setSelectedEdgeId(null);
                    setFocusRobot(null);
                    setFocusCart(null);
                    setMoveTarget(node.id);
                    setPanelOpen(true);
                    setCmdTab(isSelNode ? cmdTab : "props");
                  }}
                  onDoubleClick={()=>{
                    if(!editMode) return;
                    setEditHighlightNodeId(node.id);
                    setEditTab("node");
                    setSelectedNodeId(node.id);
                    setSelectedEdgeId(null);
                    setFocusRobot(null);
                    setFocusCart(null);
                    setPanelOpen(true);
                    setCmdTab("props");
                  }}>
                  {isEditHl&&<div style={{
                    position:"absolute", inset:-8, borderRadius:6,
                    background:"rgba(245,158,11,0.15)",
                    border:"1.5px solid rgba(245,158,11,0.5)",
                    animation:"pulse 1.5s ease-in-out infinite",
                  }}/>}
                  <div style={{
                    width: nodeSize, height: nodeSize,
                    borderRadius: 3,
                    background: nodeColor,
                    border: `2px solid ${borderClr}`,
                    boxShadow: isSelNode
                      ? "0 0 0 4px rgba(37,99,235,0.2), 0 2px 6px rgba(15,23,42,0.2)"
                      : isEditHl ? "0 0 0 4px rgba(245,158,11,0.25)"
                      : "0 1px 3px rgba(15,23,42,0.15)",
                    transition:"all 0.15s",
                  }}/>
                  <div style={{
                    position:"absolute", top: nodeSize+3, left:"50%",
                    transform:"translateX(-50%)",
                    fontSize: 9, fontWeight: (isSelNode||isEditHl) ? 700 : 600,
                    color: isSelNode ? "#1d4ed8" : isEditHl ? "#b45309" : "#475569",
                    whiteSpace:"nowrap",
                    background: isSelNode ? "rgba(239,246,255,0.95)" : isEditHl ? "rgba(255,251,235,0.95)" : "rgba(255,255,255,0.85)",
                    padding:"1px 4px", borderRadius:3, lineHeight:1.4,
                    border: isSelNode ? "1px solid #bfdbfe" : isEditHl ? "1px solid #fcd34d" : "none",
                    transition:"all 0.15s",
                  }}>
                    {node.label}
                  </div>
                </div>
              );
            })}

            {/* Robots */}
            {layers.has("robot")&&mapRobots.map(r=>{
              const isFocus=focusRobot===r.id||focusCart===carts.find(c=>c.robotId===r.id&&c.status==="trns"&&r.st!=="down")?.id;
              const isVis=visible.includes(r);
              const sm=statusMap[r.st], fm=fleets.find(f=>f.id===r.fleet)||{color:"#64748b"};
              const attachedCart=carts.find(c=>c.robotId===r.id&&c.status==="trns"&&r.st!=="down");
              return (
                <div key={r.id} onClick={()=>{
                  if(!isVis) return;
                  if(attachedCart){
                    // 결합 아이콘 클릭 → Properties 탭, 로봇+카트 동시 표시
                    setFocusRobot(r.id);
                    setFocusCart(attachedCart.id);
                    setSelectedNodeId(null);
                    setSelectedEdgeId(null);
                    setPanelOpen(true);
                    setCmdTab("props");
                  } else {
                    const newFocus = focusRobot===r.id ? null : r.id;
                    setFocusRobot(newFocus);
                    setFocusCart(null);
                    setSelectedNodeId(null);
                    setSelectedEdgeId(null);
                    setPanelOpen(true);
                    setCmdTab(r.st==="down"?"props":"command");
                    if(newFocus){onCmdFleetChange(r.fleet);setManualRobot(r.id);}
                  }
                }}
                  className={"absolute -translate-x-1/2 -translate-y-1/2 transition-opacity "+(isVis?"cursor-pointer opacity-100":"opacity-15 grayscale pointer-events-none")}
                  style={{left:r.x,top:r.y,zIndex:10}}>

                  {attachedCart?(
                    /* ── 이송중 결합 아이콘: 컴팩트 단일 아이콘 ── */
                    <div className={"flex flex-col items-center "+(isFocus?"scale-125":"scale-100")}
                      style={{transition:"all .15s"}}>
                      <div className="relative">
                        {/* 메인 아이콘 - fleet 색상 배경에 배송 심볼 */}
                        <div className={"w-10 h-10 rounded-xl shadow-lg flex items-center justify-center border-2 border-white "+
                          (isFocus?"ring-4":"ring-0")}
                          style={{background:`linear-gradient(135deg, ${fm.color}, ${fm.color}cc)`,ringColor:fm.color+"40"}}>
                          {/* 카트+화살표 심볼 */}
                          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                            <rect x="2" y="9" width="14" height="9" rx="2" fill="white" opacity="0.9"/>
                            <path d="M6 9V6a3 3 0 016 0v3" stroke="white" strokeWidth="1.5" strokeLinecap="round" opacity="0.9"/>
                            <circle cx="6" cy="19" r="1.5" fill="white"/>
                            <circle cx="12" cy="19" r="1.5" fill="white"/>
                            <path d="M16 13l3-3m0 0l-3-3m3 3H14" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.7"/>
                          </svg>
                        </div>
                        {/* 상태 dot */}
                        <span className="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white" style={{background:sm.color}}/>
                        {/* 이송중 pulse */}
                        {isVis&&<div className="absolute inset-0 rounded-xl animate-ping opacity-20" style={{background:fm.color}}/>}
                      </div>
                      <div className="text-center mt-0.5">
                        <div className={"text-[9px] font-bold tnum whitespace-nowrap "+(isFocus?"text-slate-900":"text-slate-600")}>{r.id}</div>
                        <div className="text-[8px] text-emerald-600 font-medium whitespace-nowrap">{attachedCart.id}</div>
                      </div>
                    </div>
                  ):(
                    /* ── 일반 로봇 아이콘 ── */
                    <>
                      {r.st==="run"&&isVis&&<div className="absolute w-8 h-8 rounded-full pulse-ring border-2" style={{borderColor:fm.color,left:-16,top:-16}}/>}
                      <div className={"w-8 h-8 rounded-full grid place-items-center shadow-md border-2 text-white relative "+(isFocus?"scale-125 z-10 ring-4 ring-blue-300/40":"")} style={{background:fm.color,borderColor:"white"}}>
                        <Icon name={r.id.startsWith("Part")?"Cog":"Bot"} size={13}/>
                        <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-white" style={{background:sm.color}}/>
                      </div>
                      {(()=>{
                        const ac=carts.find(c=>c.robotId===r.id&&c.status==="trns"&&r.st!=="down");
                        return(
                          <div className={"absolute top-full left-1/2 -translate-x-1/2 mt-1 text-center "}>
                            <div className={"text-[10px] font-semibold tnum whitespace-nowrap px-1 rounded "+(isFocus?"bg-slate-900 text-white":"text-slate-700")}>{r.id}</div>
                            {ac&&<div className="text-[8.5px] font-medium text-emerald-600 whitespace-nowrap">{ac.id}</div>}
                          </div>
                        );
                      })()}
                    </>
                  )}
                </div>
              );
            })}

            {/* Tool Cart 아이콘 - cart 레이어 ON + (Delivery-Tool fleet 선택 OR 에러) */}
            {layers.has("cart")&&carts.map(cart=>{
              const CART_COLORS={idle:"#94a3b8",resv:"#3b82f6",trns:"#10b981",waiting:"#f59e0b",inuse:"#22c55e",inuser:"#8b5cf6",notuse:"#475569"};
              const CART_LABELS={idle:"대기",resv:"예약",trns:"이송",waiting:"수령대기",inuse:"사용중",inuser:"반납중",notuse:"사용불가"};
              const color=CART_COLORS[cart.status]||"#94a3b8";
              const isFocused=focusCart===cart.id;
              const isDisabled=cartReportedMissing.has(cart.id)||cartFailedDisabled.has(cart.id);
              const relRobot=cart.robotId?mapRobots.find(r=>r.id===cart.robotId):null;
              const isAttached=cart.status==="trns"&&relRobot&&relRobot.st!=="down";
              const isError=cart.status==="trns"&&relRobot?.st==="down";
              // Delivery-Tool(amr) fleet가 visible에 있는지 확인
              const amrActive=visible.some(r=>r.fleet==="amr");
              // 표시 조건: amr fleet 활성화됐거나 에러 Cart
              if(!amrActive&&!isError) return null;
              // 로봇에 붙어있으면 결합 아이콘으로 표시, 여기선 렌더 안 함
              if(isAttached) return null;
              // 에러 Cart: 로봇 옆으로 오프셋
              const displayX=isError&&relRobot?relRobot.x+36:cart.x;
              const displayY=isError&&relRobot?relRobot.y-10:cart.y;
              return(
                <div key={cart.id}
                  onClick={()=>{setFocusCart(cart.id);setFocusRobot(null);setSelectedNodeId(null);setSelectedEdgeId(null);setPanelOpen(true);setCmdTab("props");setCartHistoryOpen(false);}}
                  className="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer select-none"
                  style={{left:displayX,top:displayY,zIndex:5}}>
                  {isFocused&&<div className="absolute rounded-full border-2 border-dashed" style={{borderColor:color,left:-16,top:-16,width:32,height:32}}/>}
                  <div className={"w-8 h-8 rounded-lg grid place-items-center border-2 shadow-sm "+(isFocused?"ring-2 scale-110":"")}
                    style={{background:isDisabled?"#f1f5f9":isError?"#fef2f2":color+"22",borderColor:isDisabled?"#cbd5e1":isError?"#dc2626":color,opacity:isDisabled?0.6:1,filter:isDisabled?"grayscale(1)":"none"}}>
                    <Icon name="ShoppingCart" size={13} style={{color:isDisabled?"#94a3b8":isError?"#dc2626":color}}/>
                  </div>
                  {isDisabled&&<div className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-slate-400 rounded-full flex items-center justify-center text-white"><Icon name="Ban" size={9}/></div>}
                  {isError&&!isDisabled&&<div className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-rose-500 rounded-full flex items-center justify-center text-[9px] text-white font-bold">!</div>}
                  <div className="absolute top-full left-1/2 -translate-x-1/2 mt-0.5 text-center whitespace-nowrap">
                    <div className="text-[9px] font-bold" style={{color:isDisabled?"#94a3b8":color}}>{cart.id}</div>
                    <div className="text-[7.5px]" style={{color:isDisabled?"#94a3b8":color,opacity:0.8}}>{isDisabled?"비활성":CART_LABELS[cart.status]}</div>
                  </div>
                </div>
              );
            })}

            {/* Edit Mode: Zone 오버레이 (드래그 가능) */}
            {editMode&&(
              <svg className="absolute inset-0 w-full h-full" style={{pointerEvents:"none", overflow:"visible"}}>
                {editZones.map(z=>{
                  const isSel = selectedZoneId===z.id;
                  return(
                    <g key={z.id} style={{pointerEvents:"all", cursor: dragState?.zoneId===z.id?"grabbing":"grab"}}
                      onMouseDown={e=>handleZoneMouseDown(e,z.id)}
                      onClick={e=>{e.stopPropagation(); setSelectedZoneId(z.id);}}>
                      <rect x={z.x} y={z.y} width={z.w} height={z.h} rx={6}
                        fill={z.color} fillOpacity={isSel?0.22:0.12}
                        stroke={z.color} strokeWidth={isSel?2.5:1.5}
                        strokeDasharray={isSel?"none":"6 3"}/>
                      {isSel&&(
                        <>

                    {id:"manual", label:"로봇 지정 재할당", icon:"UserCheck",desc:"직접 로봇을 선택하여 재할당합니다"},
                    {id:"cancel", label:"Manual Cancel",   icon:"XCircle",desc:"해당 오더를 취소합니다"},
                    {id:"complete",label:"Manual Complete",icon:"CheckCircle2",desc:"해당 오더를 완료 처리합니다"},
                  ];
                  const isDone=errorActionDone===sel.id;
                  return(

                      {/* 헤더 */}
                      <div className="px-3 py-2.5 bg-rose-600 flex items-center gap-2">
                        <Icon name="AlertOctagon" size={14} className="text-white shrink-0"/>
                        <div>
                          <div className="text-[12.5px] font-bold text-white">오류 로봇 조치</div>
                          <div className="text-[10.5px] text-rose-200">{sel.id} · OBS_402 장애물 감지</div>
                        </div>
                        {isDone&&<span className="ml-auto text-[10px] font-bold bg-white text-rose-600 px-2 py-px rounded-full">조치완료</span>}
                      </div>

                      {/* 중단된 오더 정보 */}
                      <div className="px-3 py-2.5 bg-rose-50 border-b border-rose-200">
                        <div className="text-[10px] font-semibold text-rose-400 uppercase tracking-wide mb-1.5">중단된 오더</div>
                        {stoppedOrder?(
                          <div>
                            {/* 요약 행 */}
                            <div className="flex items-center gap-2">
                              <div className="w-6 h-6 rounded bg-rose-100 grid place-items-center shrink-0">
                                <Icon name="ClipboardList" size={12} className="text-rose-600"/>
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="text-[12px] font-semibold text-slate-900 truncate">{stoppedRecipe?.name||stoppedOrder.recipeId}</div>
                                <div className="text-[10.5px] text-slate-500 tnum">{stoppedOrder.id}</div>
                              </div>
                              <button onClick={()=>setOrderDetailOpen(o=>!o)}
                                className="shrink-0 flex items-center gap-0.5 text-[10.5px] font-semibold text-rose-500 hover:text-rose-700 transition">
                                {orderDetailOpen?"접기":"자세히"}
                                <Icon name={orderDetailOpen?"ChevronUp":"ChevronDown"} size={11}/>
                              </button>
                            </div>
                            {/* 진행률 바 */}
                            {sel.progress!=null&&(
                              <div className="mt-2">
                                <div className="flex justify-between text-[10px] text-rose-500 mb-0.5">
                                  <span>진행률</span><span className="tnum font-semibold">{sel.progress}%</span>
                                </div>
                                <div className="h-1.5 bg-rose-200 rounded-full overflow-hidden">
                                  <div className="h-full bg-rose-500 rounded-full" style={{width:sel.progress+"%"}}/>
                                </div>
                              </div>
                            )}
                            {/* 펼침 상세 */}
                            {orderDetailOpen&&(
                              <div className="mt-2.5 rounded-lg border border-rose-200 bg-white overflow-hidden">
                                {/* 오더 메타 */}
                                <div className="px-2.5 py-2 bg-slate-50 border-b border-slate-100 grid grid-cols-2 gap-x-3 gap-y-1">
                                  {[
                                    ["시작",fmtTime(stoppedOrder.start)],
                                    ["Fleet",fleets.find(f=>f.id===sel.fleet)?.name||sel.fleet],
                                    ["요청자",["USR-019","USR-042","USR-007"][initOrders.indexOf(stoppedOrder)%3]||"USR-001"],
                                    ["오더ID",stoppedOrder.id],
                                  ].map(([l,v])=>(
                                    <div key={l}>
                                      <div className="text-[9.5px] text-slate-400">{l}</div>
                                      <div className="text-[11px] font-semibold text-slate-800 tnum">{v}</div>
                                    </div>
                                  ))}
                                </div>
                                {/* 스텝 목록 */}
                                {stoppedRecipe&&stoppedRecipe.steps&&(
                                  <div className="divide-y divide-slate-100">
                                    {stoppedRecipe.steps.map((step,si)=>{
                                      const node=mapNodes.find(n=>n.id===step.nodeId);
                                      const progressPct=sel.progress||0;
                                      const totalSteps=stoppedRecipe.steps.length;
                                      const doneSteps=Math.floor(progressPct/100*totalSteps);
                                      const isCurrent=si===doneSteps;
                                      const isDone=si<doneSteps;
                                      const slots=step.slots||[{actionType:step.actionType,duration:step.duration}];
                                      return(
                                        <div key={si} className={"flex items-start gap-2 px-2.5 py-2 "+(isCurrent?"bg-rose-50":"")}>
                                          <div className={"w-5 h-5 rounded-full border-2 shrink-0 mt-0.5 flex items-center justify-center "+
                                            (isDone?"border-emerald-500 bg-emerald-500":isCurrent?"border-rose-500 bg-rose-100":"border-slate-300 bg-white")}>
                                            {isDone
                                              ?<Icon name="Check" size={9} className="text-white"/>
                                              :isCurrent
                                                ?<div className="w-2 h-2 rounded-full bg-rose-500"/>
                                                :<span className="text-[9px] font-bold text-slate-400">{si+1}</span>
                                            }
                                          </div>
                                          <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-1.5">
                                              <span className={"text-[11.5px] font-semibold "+(isDone?"text-emerald-700":isCurrent?"text-rose-800":"text-slate-500")}>
                                                {node?.label||step.nodeId}
                                              </span>
                                              {isCurrent&&<span className="text-[9.5px] font-bold px-1.5 py-px rounded-full bg-rose-500 text-white">중단</span>}
                                            </div>
                                            <div className="flex flex-wrap gap-1 mt-0.5">
                                              {slots.map((sl,j)=>{
                                                const act=actionTypes.find(a=>a.id===sl.actionType);
                                                return(
                                                  <span key={j} className="text-[10px] text-slate-500 flex items-center gap-0.5">
                                                    <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{background:act?.color||"#94a3b8"}}/>
                                                    {act?.label||sl.actionType}
                                                    {j<slots.length-1&&<span className="ml-0.5">{step.mode==="parallel"?"∥":"→"}</span>}
                                                  </span>
                                                );
                                              })}
                                            </div>
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        ):(
                          <div className="text-[11.5px] text-slate-400 italic">연결된 오더 없음</div>
                        )}
                      </div>

                      {/* 조치 */}
                      <div className="p-3">
                        {(()=>{
                          const totalSteps=(stoppedRecipe?.steps||[]).length||5;
                          const stoppedStepIdx=Math.floor((sel.progress||0)/100*totalSteps);
                          const stoppedSlots=(stoppedRecipe?.steps||[])[stoppedStepIdx]?.slots||[{actionType:(stoppedRecipe?.steps||[])[stoppedStepIdx]?.actionType}];
                          const stoppedAction=stoppedSlots[0]?.actionType||"";
                          const isEarlyStage=["ASSIGN","MOVE"].includes(stoppedAction);
                          const isStep1Done=errorStep>=1;
                          const isDone=errorStep>=2;
                          const isFailed=stoppedOrder&&errorResolutions[stoppedOrder.id]&&errorResolutions[stoppedOrder.id].failed;

                          if(isDone&&isFailed) return(
                            <div className="space-y-2">
                              <div className="bg-rose-50 border border-rose-200 rounded-lg px-3 py-2.5 flex items-start gap-2">
                                <Icon name="XCircle" size={14} className="text-rose-600 shrink-0 mt-0.5"/>
                                <div>
                                  <div className="text-[12px] font-bold text-rose-800">작업 실패 처리됨</div>
                                  <div className="text-[10.5px] text-rose-600">사유: 가용 로봇 없음 · 작업 현황 목록에 기록되었습니다.</div>
                                </div>
                              </div>
                              <button onClick={()=>{setErrorStep(0);setErrorAction(null);setReassignRobot("");setFocusRobot(null);}}
                                className="w-full h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-[12px] font-semibold flex items-center justify-center gap-1.5 transition">
                                <Icon name="Check" size={12}/> 확인
                              </button>
                            </div>
                          );

                          if(isDone) return(
                            <div className="space-y-2">
                              <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2.5 flex items-center gap-2">
                                <Icon name="CheckCircle2" size={14} className="text-emerald-600 shrink-0"/>
                                <div>
                                  <div className="text-[12px] font-bold text-emerald-800">조치 완료</div>
                                  <div className="text-[10.5px] text-emerald-600">
                                    {isEarlyStage
                                      ?(errorAction==="auto"?"시스템 자동 재할당 요청됨":"로봇 "+reassignRobot+" 재할당 완료")
                                      :"작업 현황 목록에서 Manual Complete 처리 필요"}
                                  </div>
                                </div>
                              </div>
                              <button onClick={()=>{setErrorStep(0);setErrorAction(null);setReassignRobot("");setConfirmPending(false);clearTimeout(confirmTimerRef.current);}}                                className="w-full h-7 rounded border border-slate-200 text-[11.5px] text-slate-500 hover:bg-slate-50">초기화</button>
                            </div>
                          );

                          return(
                            <div className="space-y-2">
                              {/* Step 1 */}
                              <div className={"rounded-lg border overflow-hidden "+(isStep1Done?"border-emerald-300 bg-emerald-50":"border-slate-200 bg-white")}>
                                <div className="px-2.5 py-2.5 flex items-center gap-2">
                                  <div className={"w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 text-[10px] font-bold "+
                                    (isStep1Done?"border-emerald-500 bg-emerald-500 text-white":"border-slate-400 text-slate-500")}>
                                    {isStep1Done?<Icon name="Check" size={10}/>:"1"}
                                  </div>
                                  <div className="flex-1">
                                    <div className={"text-[12px] font-semibold "+(isStep1Done?"text-emerald-800":"text-slate-800")}>에러 로봇 오더 취소</div>
                                    <div className="text-[10.5px] text-slate-400">{sel.id}에서 오더 할당 해제</div>
                                  </div>
                                  {isStep1Done?(
                                    <button disabled className="h-7 px-3 rounded-md bg-slate-200 text-slate-400 text-[11px] font-bold cursor-not-allowed shrink-0">
                                      완료
                                    </button>
                                  ):(
                                    confirmPending?(
                                      <button
                                        onClick={()=>{
                                          clearTimeout(confirmTimerRef.current);
                                          setConfirmPending(false);
                                          setErrorStep(1);
                                          if(sel) setCancelledErrorRobots(prev=>new Set([...prev, sel.id]));
                                          if(stoppedOrder) setErrorResolutions(prev=>({...prev,[stoppedOrder.id]:{robotId:sel.id,type:isEarlyStage?"move":"transfer",cancelled:true,reassignedTo:null}}));
                                        }}
                                        className="h-7 px-2.5 rounded-md bg-rose-700 hover:bg-rose-800 text-white text-[11px] font-bold shrink-0 flex items-center gap-1 animate-pulse">
                                        <Icon name="AlertTriangle" size={11}/> 정말 취소할까요?
                                      </button>
                                    ):(
                                      <button
                                        onClick={()=>{
                                          setConfirmPending(true);
                                          confirmTimerRef.current=setTimeout(()=>setConfirmPending(false),3000);
                                        }}
                                        className="h-7 px-3 rounded-md bg-rose-600 hover:bg-rose-700 text-white text-[11.5px] font-bold shrink-0">
                                        실행
                                      </button>
                                    )
                                  )}
                                </div>
                              </div>

                              {/* Step 2 */}
                              <div className={"rounded-lg border overflow-hidden transition-opacity "+(!isStep1Done?"opacity-40 pointer-events-none border-slate-200":"border-slate-200")} >
                                <div className="px-2.5 py-2 bg-slate-50 border-b border-slate-100 flex items-center gap-2">
                                  <div className="w-5 h-5 rounded-full border-2 border-slate-400 flex items-center justify-center shrink-0 text-[10px] font-bold text-slate-500">2</div>
                                  <div className="text-[12px] font-semibold text-slate-800">
                                    {isEarlyStage?"새 로봇 재할당":"작업자 직접 배송 후 처리"}
                                  </div>
                                </div>
                                <div className="p-2.5">
                                  {isEarlyStage?(
                                    availRobots.length===0?(
                                      <div className="space-y-2">
                                        <div className="flex items-start gap-2 bg-rose-50 border border-rose-200 rounded-lg px-2.5 py-2">
                                          <Icon name="AlertTriangle" size={13} className="text-rose-500 shrink-0 mt-0.5"/>
                                          <div className="text-[11px] text-rose-700 leading-relaxed">
                                            <span className="font-semibold">{fleets.find(f=>f.id===sel.fleet)?.name||sel.fleet} Fleet에 가용 로봇이 없습니다.</span><br/>
                                            재할당할 수 있는 로봇이 없어 이 작업을 완수할 수 없습니다.
                                          </div>
                                        </div>
                                        <button onClick={()=>{
                                          if(stoppedOrder) setErrorResolutions(prev=>({...prev,[stoppedOrder.id]:{...(prev[stoppedOrder.id]||{robotId:sel.id,type:"move",cancelled:true}),failed:true,failReason:"가용 로봇 없음",reassignedTo:null}}));
                                          setPendingManual(prev=>stoppedOrder?prev.filter(p=>p.orderId!==stoppedOrder.id):prev);

                                        }}
                                          className="w-full h-8 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-[12px] font-bold flex items-center justify-center gap-1.5 transition">
                                          <Icon name="XCircle" size={12}/> 작업 실패 처리
                                        </button>
                                        <div className="text-[10px] text-slate-400 text-center leading-relaxed">
                                          실패 처리 시 작업 현황에<br/>"작업 실패 (가용 로봇 없음)"으로 기록됩니다.
                                        </div>
                                      </div>
                                    ):(
                                    <div className="space-y-1.5">
                                      {[
                                        {id:"auto",   label:"자동 재할당",     icon:"Zap",       desc:"시스템이 가용 로봇 자동 선택 (처음부터)"},
                                        {id:"manual", label:"로봇 지정 재할당", icon:"UserCheck", desc:"직접 로봇을 선택 (처음부터)"},
                                      ].map(a=>(
                                        <div key={a.id}>
                                          <button onClick={()=>{setErrorAction(p=>p===a.id?null:a.id);setReassignRobot("");}}
                                            className={"w-full flex items-center gap-2 px-2.5 py-2 rounded-lg border text-left transition "+
                                              (errorAction===a.id?"border-blue-500 bg-blue-50":"border-slate-200 bg-white hover:border-slate-300")}>
                                            <div className={"w-3.5 h-3.5 rounded-full border-2 shrink-0 flex items-center justify-center "+
                                              (errorAction===a.id?"border-blue-500":"border-slate-300")}>
                                              {errorAction===a.id&&<div className="w-2 h-2 rounded-full bg-blue-500"/>}
                                            </div>
                                            <Icon name={a.icon} size={12} className={errorAction===a.id?"text-blue-600":"text-slate-400"}/>
                                            <div>
                                              <div className={"text-[11.5px] font-semibold "+(errorAction===a.id?"text-blue-900":"text-slate-700")}>{a.label}</div>
                                              <div className="text-[10px] text-slate-400">{a.desc}</div>
                                            </div>
                                          </button>
                                          {a.id==="manual"&&errorAction==="manual"&&(
                                            <div className="mt-1 ml-1 relative">
                                              <select value={reassignRobot} onChange={e=>setReassignRobot(e.target.value)}
                                                className="w-full h-8 pl-2.5 pr-7 rounded-md border border-blue-300 bg-white text-[12px] outline-none appearance-none focus:border-blue-500">
                                                <option value="">로봇 선택...</option>
                                                {availRobots.map(r=>(
                                                  <option key={r.id} value={r.id}>{r.id} · 배터리 {r.battery}%</option>
                                                ))}
                                              </select>
                                              <Icon name="ChevronDown" size={11} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                                              {availRobots.length===0&&<div className="mt-1 text-[10.5px] text-amber-600 flex items-center gap-1"><Icon name="AlertTriangle" size={10}/>가용 로봇 없음</div>}
                                            </div>
                                          )}
                                        </div>
                                      ))}
                                      <button disabled={!errorAction||(errorAction==="manual"&&!reassignRobot)}
                                        onClick={()=>{
                                          const target=errorAction==="auto"?(availRobots[0]?.id||"자동 선택"):reassignRobot;
                                          if(stoppedOrder) setErrorResolutions(prev=>({...prev,[stoppedOrder.id]:{...(prev[stoppedOrder.id]||{robotId:sel.id,type:"move",cancelled:true}),reassignedTo:target}}));
                                          setErrorStep(2);
                                        }}
                                        className={"w-full h-8 mt-0.5 rounded-lg text-[12px] font-bold flex items-center justify-center gap-1.5 transition "+
                                          (errorAction&&(errorAction!=="manual"||reassignRobot)
                                            ?"bg-blue-600 hover:bg-blue-700 text-white"
                                            :"bg-slate-100 text-slate-300 cursor-not-allowed")}>
                                        <Icon name="RotateCcw" size={12}/> 재할당 완료
                                      </button>
                                    </div>
                                    )
                                  ):(
                                    <div className="space-y-2">
                                      <div className="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-2">
                                        <Icon name="AlertTriangle" size={12} className="text-amber-600 shrink-0 mt-0.5"/>
                                        <div className="text-[11.5px] text-amber-800 leading-relaxed">
                                          화물이 적재된 상태입니다.<br/>
                                          <span className="font-semibold">작업자가 cart를 목적지까지 직접 이동</span> 후 아래 방법으로 처리하세요.<br/>
                                          <span className="font-semibold text-emerald-700">방법①</span> 작업 현황 → 목록 확인하기에서 해당 작업을 Manual Complete 하세요.<br/>
                                          <span className="font-semibold text-emerald-700">방법②</span> 직접 배송해야 할 Cart를 지도에서 클릭하여, Properties 영역에서 Manual Complete 하세요.
                                        </div>
                                      </div>
                                      <button onClick={()=>{
                                        const relCart=stoppedOrder?carts.find(c=>c.orderId===stoppedOrder.id):null;
                                        if(stoppedOrder){
                                          setPendingManual(prev=>{
                                            if(prev.find(p=>p.orderId===stoppedOrder.id)) return prev;
                                            return [...prev,{
                                              orderId:stoppedOrder.id,
                                              recipeName:stoppedRecipe?.name||stoppedOrder.recipeId,
                                              robotId:sel.id,
                                              cartId:relCart?.id||null,
                                              registeredAt:"방금",
                                            }];
                                          });
                                        }
                                        setErrorStep(2);
                                        setFocusRobot(null);
                                        setSelectedNodeId(null);
                                        setSelectedEdgeId(null);
                                        setFocusCart(relCart?relCart.id:null);
                                        setCmdTab("props");
                                      }}
                                        className="w-full h-8 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-[12px] font-bold flex items-center justify-center gap-1.5 transition">
                                        <Icon name="ClipboardList" size={12}/>
                                        설명 확인
                                      </button>
                                    </div>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })()}
                      </div>
                    </div>
                  );
                })()}

                {/* ── Cart Properties (단독 선택 시) ── */}
                {focusCart&&!focusRobot&&(()=>{
                  const cart=carts.find(c=>c.id===focusCart);
                  if(!cart)return null;
                  const CART_COLORS={idle:"#94a3b8",resv:"#3b82f6",trns:"#10b981",waiting:"#f59e0b",inuse:"#22c55e",inuser:"#8b5cf6",notuse:"#475569"};
                  const CART_LABELS={idle:"대기",resv:"예약중",trns:"이송중",waiting:"수령 대기",inuse:"사용중",inuser:"반납중",notuse:"사용불가"};
                  const color=CART_COLORS[cart.status]||"#94a3b8";
                  const relOrder=initOrders.find(o=>o.id===cart.orderId);
                  const relRecipe=relOrder?recipes.find(r=>r.id===relOrder.recipeId):null;
                  const relRobot=cart.robotId?mapRobots.find(r=>r.id===cart.robotId):null;
                  const isErrorCart=cart.status==="trns"&&relRobot?.st==="down";
                  const isDisabled=cartReportedMissing.has(cart.id)||cartFailedDisabled.has(cart.id);
                  const orderCancelled=relRobot?cancelledErrorRobots.has(relRobot.id):false;
                  const destNode=mapNodes.find(n=>n.id===cart.destNodeId);
                  return(
                    <div className="space-y-2">
                      {/* 헤더 카드 */}
                      <div className="rounded-xl border overflow-hidden" style={{borderColor:isDisabled?"#cbd5e1":color+"55"}}>
                        <div className="px-3 py-2.5 flex items-center gap-2.5" style={{background:isDisabled?"#f1f5f9":color+"15"}}>
                          <div className="w-9 h-9 rounded-lg grid place-items-center shrink-0" style={{background:isDisabled?"#e2e8f0":color+"22",border:`1.5px solid ${isDisabled?"#cbd5e1":color+"55"}`}}>
                            <Icon name="ShoppingCart" size={16} style={{color:isDisabled?"#94a3b8":color}}/>
                          </div>
                          <div className="flex-1">
                            <div className={"text-[13px] font-bold "+(isDisabled?"text-slate-400 line-through":"text-slate-900")}>{cart.id}</div>
                            <div className="text-[11px] font-semibold mt-px" style={{color:isDisabled?"#94a3b8":color}}>{isDisabled?"사용 불가":CART_LABELS[cart.status]}</div>
                          </div>
                          {isDisabled?(
                            <span className="text-[10px] font-bold bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full flex items-center gap-0.5 shrink-0">

                          <select value={np.type} onChange={e=>setNodeProp(node.id,"type",e.target.value)}

                            <option value="pickdrop">Pick / Drop</option>
                            <option value="charge">충전 (Charge)</option>
                            <option value="storage">Storage</option>
                            <option value="none">None</option>
                          </select>
                          <Icon name="ChevronDown" size={12} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                        </div>
                      </div>

                      {/* 특성 토글 */}
                      <div className="rounded-lg border border-slate-200 bg-white p-2.5">
                        <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide mb-1">특성</div>
                        <PropToggle label="회피 여부" val={np.avoidance} onToggle={()=>setNodeProp(node.id,"avoidance",!np.avoidance)}/>
                        <PropToggle label="상호 배제 영역" val={np.mutualExcl} onToggle={()=>setNodeProp(node.id,"mutualExcl",!np.mutualExcl)}/>
                      </div>
                      </div>{/* /tooltip wrapper */}

                      {/* 연결 엣지 */}
                      <div className="rounded-lg border border-slate-200 bg-white p-2.5">
                        <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide mb-1.5">연결 노드 ({connectedNodes.length})</div>

                          <button key={cn.id} onClick={()=>{setSelectedNodeId(cn.id);setSelectedEdgeId(null);setMoveTarget(cn.id);}}

                            <div className="w-1.5 h-1.5 rounded-sm bg-slate-300 group-hover:bg-blue-500 shrink-0"/>
                            <span className="text-[11.5px] text-slate-700 flex-1 truncate">{cn.label}</span>
                            <span className="text-[10px] text-slate-400 tnum">{cn.id}</span>
                          </button>
                        ))}
                      </div>
                      <button onClick={()=>setCmdTab("command")}
                        className="w-full h-8 rounded-md bg-indigo-600 hover:bg-indigo-700 text-white text-[12px] font-medium flex items-center justify-center gap-1.5">
                        <Icon name="Navigation" size={12}/> 이 노드로 노드 이동하기
                      </button>
                      {/* 취소 / 저장 {"—"} 편집 모드에서만 */}
                      {editMode&&(()=>{
                        const isDirty = JSON.stringify(nodeProps[node.id]) !== JSON.stringify(committedNodeProps[node.id]);
                        return (
                          <div className="flex gap-2 pt-1">
                            <button onClick={()=>cancelNodeProps(node.id)} disabled={!isDirty}
                              className={"flex-1 h-8 rounded-md border text-[12px] font-medium flex items-center justify-center gap-1 transition "+(isDirty?"border-slate-200 bg-white hover:bg-slate-50 text-slate-600":"border-slate-100 bg-slate-50 text-slate-300 cursor-not-allowed")}>
                              <Icon name="RotateCcw" size={11}/> 취소
                            </button>
                            <button onClick={()=>saveNodeProps(node.id)} disabled={!isDirty}
                              className={"flex-1 h-8 rounded-md text-[12px] font-medium flex items-center justify-center gap-1 transition "+(isDirty?"bg-blue-600 hover:bg-blue-700 text-white":"bg-slate-100 text-slate-300 cursor-not-allowed")}>
                              <Icon name="Save" size={11}/> 저장
                            </button>
                          </div>
                        );
                      })()}
                    </div>
                  );
                })()}

                {/* ── 엣지 Properties ── */}
                {selectedEdgeId && !selectedNodeId && (((sel?1:0)+(selectedNodeId?1:0)+(selectedEdgeId?1:0))<=1||multiDetailOpen) && (() => {
                  const edge = mapEdges.find(e=>e.id===selectedEdgeId);
                  if(!edge) return null;
                  const ep = edgeProps[edge.id]||{};
                  const fromNode = mapNodes.find(n=>n.id===edge.from);
                  const toNode   = mapNodes.find(n=>n.id===edge.to);
                  const dist = fromNode&&toNode ? Math.round(Math.sqrt((toNode.x-fromNode.x)**2+(toNode.y-fromNode.y)**2)) : 0;
                  const angle = fromNode&&toNode ? Math.round(Math.atan2(toNode.y-fromNode.y, toNode.x-fromNode.x)*180/Math.PI) : 0;
                  const dirLabel = edge.dir==="bi"?"양방향":"단방향";
                  const EdgeToggle=({label,val,onToggle})=>(
                    <div className="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                      <span className="text-[11.5px] text-slate-700">{label}</span>
                      <button onClick={editMode?onToggle:undefined} disabled={!editMode}
                        className={"w-9 h-5 rounded-full relative transition-colors shrink-0 "+(val?"bg-blue-500":"bg-slate-300")+(editMode?"":" opacity-60 cursor-not-allowed")}>
                        <div className={"absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all "+(val?"left-4":"left-0.5")}/>
                      </button>
                    </div>
                  );
                  return (
                    <div className="space-y-2.5">
                      {/* 헤더 */}
                      <div className="rounded-lg border border-purple-200 bg-purple-50/50 p-2.5">
                        <div className="flex items-center gap-2 mb-2.5">
                          <div className="w-6 h-6 rounded bg-purple-600 grid place-items-center shrink-0"><Icon name={edge.dir==="bi"?"ArrowLeftRight":"ArrowRight"} size={12} className="text-white"/></div>
                          <div className="flex-1 min-w-0">
                            <div className="text-[13px] font-semibold text-purple-900">{edge.id}</div>
                            <div className="text-[10px] text-purple-500">{dirLabel}</div>
                          </div>
                          <button onClick={()=>setSelectedEdgeId(null)} className="w-6 h-6 grid place-items-center rounded hover:bg-purple-100 text-purple-400"><Icon name="X" size={11}/></button>
                        </div>
                        <div className="grid grid-cols-2 gap-2 text-[11px]">
                          <div className="col-span-2 flex items-center gap-1.5 px-2 py-1.5 rounded bg-white border border-purple-100">
                            <span className="font-semibold text-purple-700 tnum">{edge.from}</span>
                            <Icon name={edge.dir==="bi"?"ArrowLeftRight":"ArrowRight"} size={11} className="text-purple-400 shrink-0"/>
                            <span className="font-semibold text-purple-700 tnum">{edge.to}</span>
                          </div>
                          <div><div className="text-[10px] text-purple-400">거리</div><div className="font-semibold text-purple-900 tnum">{dist} px</div></div>
                          <div><div className="text-[10px] text-purple-400">방향각</div><div className="font-semibold text-purple-900 tnum">{angle}°</div></div>
                        </div>
                      </div>

                      {/* 속도 + 특성 {"—"} 편집 모드 외 호버 시 tooltip */}
                      <div title={!editMode?"지도 편집에서 수정할 수 있어요":undefined}>
                      {/* 속도 */}
                      <div className="rounded-lg border border-slate-200 bg-white p-2.5 mb-2.5">
                        <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide mb-2">속도 (m/s)</div>
                        <div className="flex items-center gap-2">
                          <input type="range" min="0.1" max="3.0" step="0.1" value={ep.speed||1.0}
                            onChange={e=>editMode&&setEdgeProp(edge.id,"speed",Number(e.target.value))}
                            disabled={!editMode}
                            className={"flex-1 accent-blue-600"+(editMode?"":" opacity-50 cursor-not-allowed")}/>
                          <span className="text-[12px] font-semibold text-slate-900 tnum w-10 text-right">{(ep.speed||1.0).toFixed(1)}</span>
                        </div>
                      </div>

                      {/* 토글 특성 */}
                      <div className="rounded-lg border border-slate-200 bg-white p-2.5">
                        <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide mb-1">특성</div>
                        <EdgeToggle label="회전 여부"        val={ep.rotation}   onToggle={()=>setEdgeProp(edge.id,"rotation",  !ep.rotation)}/>
                        <EdgeToggle label="비활성"           val={ep.inactive}   onToggle={()=>setEdgeProp(edge.id,"inactive",   !ep.inactive)}/>
                        <EdgeToggle label="상호 배제 영역"   val={ep.mutualExcl} onToggle={()=>setEdgeProp(edge.id,"mutualExcl", !ep.mutualExcl)}/>
                        <EdgeToggle label="레인컷 여부"      val={ep.laneCut}    onToggle={()=>setEdgeProp(edge.id,"laneCut",    !ep.laneCut)}/>
                      </div>
                      </div>{/* /tooltip wrapper */}
                      {/* 취소 / 저장 {"—"} 편집 모드에서만 */}
                      {editMode&&(()=>{
                        const isDirty = JSON.stringify(edgeProps[edge.id]) !== JSON.stringify(committedEdgeProps[edge.id]);
                        return (
                          <div className="flex gap-2 pt-1">
                            <button onClick={()=>cancelEdgeProps(edge.id)} disabled={!isDirty}
                              className={"flex-1 h-8 rounded-md border text-[12px] font-medium flex items-center justify-center gap-1 transition "+(isDirty?"border-slate-200 bg-white hover:bg-slate-50 text-slate-600":"border-slate-100 bg-slate-50 text-slate-300 cursor-not-allowed")}>
                              <Icon name="RotateCcw" size={11}/> 취소
                            </button>
                            <button onClick={()=>saveEdgeProps(edge.id)} disabled={!isDirty}
                              className={"flex-1 h-8 rounded-md text-[12px] font-medium flex items-center justify-center gap-1 transition "+(isDirty?"bg-blue-600 hover:bg-blue-700 text-white":"bg-slate-100 text-slate-300 cursor-not-allowed")}>
                              <Icon name="Save" size={11}/> 저장
                            </button>
                          </div>
                        );
                      })()}
                    </div>
                  );
                })()}

                    <div className="text-[12.5px] font-medium text-slate-700">선택 없음</div>

                  </div>
                )}

                {sel && !focusCart && !selectedNodeId && !selectedEdgeId && (<>

                      <div className="rounded-md border border-slate-200 p-2.5">

                            <div className="text-[10px] text-slate-500">좌표 (X, Y)</div>
                            <div className="text-[12px] font-semibold text-slate-900 tnum">{Math.round(sel.x)}, {Math.round(sel.y)}</div>
