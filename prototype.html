function FleetActionModal({fleetRow, fleetId, onClose, bump, showToast}){
  const [sel,setSel]=useState("");
  const [newOpen,setNewOpen]=useState(false);
  const [nCode,setNCode]=useState("");
  const [nLabel,setNLabel]=useState("");
  const [nDur,setNDur]=useState("5");

  const applied=actionTypes.filter(a=>a.fleets.includes(fleetId));
  const available=actionTypes.filter(a=>!a.fleets.includes(fleetId));
  const usedCount=(actId)=>recipes.filter(r=>r.fleet===fleetId&&(r.steps||[]).some(s=>s.actionType===actId)).length;

  const addExisting=()=>{
    if(!sel) return;
    const a=actionTypes.find(x=>x.id===sel);
    if(a&&!a.fleets.includes(fleetId)){a.fleets.push(fleetId);bump();showToast(a.id+" 액션이 "+fleetRow.name+"에 추가됨 (모든 버전 공통)");}
    setSel("");
  };
  const removeAct=(a)=>{
    a.fleets=a.fleets.filter(x=>x!==fleetId);
    bump();showToast(a.id+" 액션이 "+fleetRow.name+"에서 제거됨");
  };
  const codeDup=actionTypes.some(a=>a.id===nCode.trim().toUpperCase());
  const newValid=nCode.trim().length>0&&!codeDup&&nLabel.trim().length>0&&Number(nDur)>0;
  const createNew=()=>{
    if(!newValid) return;
    const id=nCode.trim().toUpperCase();
    actionTypes.push({id,label:nLabel.trim(),icon:"Zap",color:"#2563eb",defaultDuration:Number(nDur),fleets:[fleetId]});
    bump();showToast(id+" 액션 생성·적용됨");
    setNCode("");setNLabel("");setNDur("5");setNewOpen(false);
  };

  return(
    <MgmtModal title={"Action Type 관리 — "+fleetRow.name} icon="Zap" width={500} onClose={onClose}
      footer={<button onClick={onClose} className="h-9 px-4 rounded-lg bg-blue-600 text-white text-[12.5px] font-bold hover:bg-blue-700">완료</button>}>

      <div className="rounded-lg bg-slate-50 border border-slate-200 px-3 py-2 text-[11px] text-slate-500 leading-relaxed">
        Action Type은 <b>Fleet 단위</b>로 관리되며 같은 Fleet의 <b>모든 버전에 공통</b> 적용됩니다.<br/>
        버전별로는 HW 사양(사이즈·최대속도·회전반경)만 달라질 수 있습니다.
      </div>

      {/* 적용된 액션 목록 */}
      <div>
        <div className="text-[11px] font-medium text-slate-500 mb-1.5">적용된 Action Type <span className="tnum">({applied.length})</span></div>
        <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 max-h-[240px] overflow-auto">
          {applied.length===0&&<div className="px-3 py-5 text-center text-[12px] text-slate-400">적용된 액션이 없습니다.</div>}
          {applied.map(a=>{
            const used=usedCount(a.id);
            return(
              <div key={a.id} className="flex items-center gap-2.5 px-3 py-2">
                <span className="text-[11.5px] font-bold tnum px-1.5 py-0.5 rounded shrink-0" style={{background:a.color+"15",color:a.color}}>{a.id}</span>
                <span className="text-[12px] text-slate-600">{a.label}</span>
                <span className="text-[10.5px] text-slate-400 tnum ml-auto">{a.defaultDuration}s</span>
                {used>0&&<span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200 shrink-0">템플릿 {used}개 사용 중</span>}
                <button onClick={()=>used===0&&removeAct(a)} disabled={used>0}
                  title={used>0?"이 Fleet의 작업 템플릿에서 사용 중이라 제거할 수 없습니다":"제거"}
                  className={"w-6 h-6 rounded grid place-items-center shrink-0 "+(used>0?"text-slate-200 cursor-not-allowed":"text-slate-400 hover:bg-rose-50 hover:text-rose-600")}>
                  <Icon name="X" size={12}/>
                </button>
              </div>
            );
          })}
        </div>
      </div>

      {/* 라이브러리에서 추가 */}
      <div>
        <div className="text-[11px] font-medium text-slate-500 mb-1.5">라이브러리에서 추가</div>
        <div className="flex gap-2">
          <select value={sel} onChange={e=>setSel(e.target.value)} className={mgmtSelCls+" flex-1"}>
            <option value="">액션 선택...</option>
            {available.map(a=><option key={a.id} value={a.id}>{a.id} · {a.label} ({a.defaultDuration}s)</option>)}
          </select>
          <button onClick={addExisting} disabled={!sel}
            className={"h-9 px-3.5 rounded-lg text-[12.5px] font-bold shrink-0 "+(sel?"bg-blue-600 text-white hover:bg-blue-700":"bg-slate-200 text-slate-400 cursor-not-allowed")}>추가</button>
        </div>
        {available.length===0&&<div className="text-[11px] text-slate-400 mt-1">모든 라이브러리 액션이 이미 적용되어 있습니다.</div>}
      </div>

      {/* 새 Action Type 만들기 */}
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        <button onClick={()=>setNewOpen(o=>!o)} className="w-full px-3 py-2 flex items-center gap-2 bg-slate-50 hover:bg-slate-100 transition">
          <Icon name="Plus" size={13} className="text-blue-600"/>
          <span className="text-[12px] font-semibold text-slate-700">새 Action Type 만들기</span>
          <Icon name={newOpen?"ChevronUp":"ChevronDown"} size={13} className="text-slate-400 ml-auto"/>
        </button>
        {newOpen&&(
          <div className="p-3 space-y-2.5 border-t border-slate-200">
            <div className="grid grid-cols-2 gap-2">
              <MgmtField label="액션 코드 (영문)">
                <input value={nCode} onChange={e=>setNCode(e.target.value.toUpperCase().replace(/[^A-Z_]/g,""))} placeholder="예: ROTATE" className={mgmtInpCls}/>
                {codeDup&&<div className="text-[10.5px] text-rose-500 mt-1">이미 존재하는 코드입니다.</div>}
              </MgmtField>
              <MgmtField label="라벨 (한글)">
                <input value={nLabel} onChange={e=>setNLabel(e.target.value)} placeholder="예: 회전" className={mgmtInpCls}/>
              </MgmtField>
            </div>
            <MgmtField label="기본 소요시간 (초)">
              <input value={nDur} onChange={e=>setNDur(e.target.value.replace(/[^0-9]/g,""))} className={mgmtInpCls}/>
            </MgmtField>
            <button onClick={createNew} disabled={!newValid}
              className={"w-full h-9 rounded-lg text-[12.5px] font-bold "+(newValid?"bg-blue-600 text-white hover:bg-blue-700":"bg-slate-200 text-slate-400 cursor-not-allowed")}>
              생성하고 {fleetRow.name}에 적용
            </button>
          </div>
        )}
      </div>

      <div className="text-[11px] text-slate-400 leading-relaxed">
        적용한 Action Type은 작업 관리 {">"} 템플릿 편집기에서 이 Fleet의 step 선택지로 바로 반영됩니다.
      </div>
    </MgmtModal>
  );
}

                  <td className="py-3"><a href={a.url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline text-[11.5px] tnum block truncate max-w-[210px]" title={a.url}>{a.url}</a></td>
                  <td className="py-3 pr-4 text-right">
                    <button onClick={()=>setEditTarget({...a})} className="w-7 h-7 rounded-md hover:bg-slate-100 text-slate-400 hover:text-blue-600 inline-grid place-items-center" title="편집"><Icon name="Pencil" size={13}/></button>
                    <button onClick={()=>setDelTarget(a)} className="w-7 h-7 rounded-md hover:bg-rose-50 text-slate-400 hover:text-rose-600 inline-grid place-items-center" title="삭제"><Icon name="Trash2" size={13}/></button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {addOpen&&<AlarmFormModal title="알람 등록" onClose={()=>setAddOpen(false)} existing={list}
        onSave={(a)=>{setList(ls=>[...ls,a]);setAddOpen(false);showToast(a.id+" 등록됨");}}/>}
      {editTarget&&<AlarmFormModal title={"알람 편집 — "+editTarget.id} init={editTarget} lockId onClose={()=>setEditTarget(null)} existing={list}
        onSave={(a)=>{setList(ls=>ls.map(x=>x.id===a.id?a:x));setEditTarget(null);showToast(a.id+" 수정됨");}}/>}
      {delTarget&&<MgmtDeleteModal label={delTarget.id} onClose={()=>setDelTarget(null)} onConfirm={()=>{setList(ls=>ls.filter(x=>x.id!==delTarget.id));showToast(delTarget.id+" 삭제됨");setDelTarget(null);}}/>}
      {toast&&<div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-[12.5px] px-4 py-2.5 rounded-lg shadow-lg">{toast}</div>}
    </div>
  );
}

function AlarmFormModal({title,init,lockId,existing,onClose,onSave}){
  const [id,setId]=useState(init?init.id:"");
  const [fleet,setFleet]=useState(init?init.fleet:fleets[0].id);
  const [source,setSource]=useState(init?init.source:"");
  const [desc,setDesc]=useState(init?init.desc:"");
  const [url,setUrl]=useState(init?init.url:"");
  const dup=!lockId&&existing.some(a=>a.id===id.trim().toUpperCase());
  const valid=id.trim().length>0&&!dup&&source.trim().length>0&&desc.trim().length>0;
  return(
    <MgmtModal title={title} icon="Bell" onClose={onClose}
      footer={<>
        <button onClick={onClose} className="h-9 px-4 rounded-lg border border-slate-200 text-[12.5px] font-medium text-slate-600 hover:bg-slate-50">취소</button>
        <button onClick={()=>valid&&onSave({id:lockId?init.id:id.trim().toUpperCase(),fleet,source:source.trim(),desc:desc.trim(),url:url.trim()})} disabled={!valid}
          className={"h-9 px-4 rounded-lg text-[12.5px] font-bold "+(valid?"bg-blue-600 text-white hover:bg-blue-700":"bg-slate-200 text-slate-400 cursor-not-allowed")}>저장</button>
      </>}>
      <MgmtField label="알람 ID (코드)">
        <input value={id} onChange={e=>setId(e.target.value.toUpperCase().replace(/[^A-Z0-9_]/g,""))} disabled={lockId} placeholder="예: EMS_001" className={mgmtInpCls+(lockId?" bg-slate-50 text-slate-400":"")}/>
        {dup&&<div className="text-[11px] text-rose-500 mt-1">이미 존재하는 알람 ID입니다.</div>}
      </MgmtField>
      <MgmtField label="Fleet 유형">
        <select value={fleet} onChange={e=>setFleet(e.target.value)} className={mgmtSelCls}>
          {fleets.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
      </MgmtField>
      <MgmtField label="알람 출발지">
        <input value={source} onChange={e=>setSource(e.target.value)} placeholder="예: 전방 라이다, EMS 버튼, 통신 모듈" className={mgmtInpCls}/>
      </MgmtField>
      <MgmtField label="알람 설명">
        <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="예: 전방 장애물 감지로 주행 정지" className={mgmtInpCls}/>
      </MgmtField>
      <MgmtField label="알람 조치 방법 URL">
        <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="예: https://wiki.example.com/alarm/EMS_001" className={mgmtInpCls}/>
      </MgmtField>
    </MgmtModal>
  );
}

function MapEditorView() {
  /* ── 상수 ─────────────────────────────────────────── */
  const ROLE_COLORS={standard:"#8b98a8",station:"#0f9d58",charger:"#1f6feb",holding:"#94a3b8",holding_candidate:"#94a3b8",siding:"#e0a000"};
  const NODE_ROLES=[{id:"standard",label:"Standard",key:"1"},{id:"station",label:"Station",key:"2"},{id:"charger",label:"Charger",key:"3"},{id:"holding",label:"Holding",key:"4"},{id:"siding",label:"Siding",key:"5"}];
  const VMAX_STEP=0.1,VMAX_DEFAULT=1.0,VMAX_MIN=0.1,VMAX_MAX=3.0;

  /* ── 초기 데이터 ────────────────────────────────────── */
  const initNodes=()=>mapNodes.map(n=>({id:n.id,x:n.x,y:n.y,name:n.label||n.id,role:"standard",is_charger:false,is_holding:false,graph_idx:0,capability:null}));
  const initEdges=()=>mapEdges.map(e=>({id:e.id,src:e.from,dst:e.to,bidir:e.dir==="bi",v_max:null,graph_idx:0,dirCycle:0}));
  const initGraphs=()=>fleets.map((f,i)=>({idx:i,id:f.id,name:f.name,color:f.color}));

  /* ── State ─────────────────────────────────────────── */
  const [nodes,setNodes]=useState(initNodes);
  const [edges,setEdges]=useState(initEdges);
  const [graphs,setGraphs]=useState(initGraphs);
  const [activeGraphs,setActiveGraphs]=useState(new Set([0]));
  const [primaryGraph,setPrimaryGraph]=useState(0);
  const [showInactive,setShowInactive]=useState(true);

  const [activeMapId,setActiveMapId]=useState(floors[0].id);
  const [mapDropOpen,setMapDropOpen]=useState(false);

  const [mode,setMode]=useState("stamp");
  const [buildTool,setBuildTool]=useState("node");
  const [stampRole,setStampRole]=useState("standard");

  const [tx,setTx]=useState(0);
  const [ty,setTy]=useState(0);
  const [scale,setScale]=useState(1);

  const [selNodeIds,setSelNodeIds]=useState(new Set());
  const [selEdgeId,setSelEdgeId]=useState(null);
  const [hovNodeId,setHovNodeId]=useState(null);
  const [hovEdgeId,setHovEdgeId]=useState(null);
  const [edgeSrc,setEdgeSrc]=useState(null);
  const [dragNode,setDragNode]=useState(null); // {id, startSvgX, startSvgY, origX, origY}

  const [speedSelIds,setSpeedSelIds]=useState(new Set());
  const [speedVal,setSpeedVal]=useState(VMAX_DEFAULT);

  const [gridSnap,setGridSnap]=useState(false);
  const [gridSize,setGridSize]=useState(20);
  const [showGrid,setShowGrid]=useState(true);

  const [bgUrl,setBgUrl]=useState(null);
  const [bgOpacity,setBgOpacity]=useState(0.5);

  const [clipboard,setClipboard]=useState(null);
  const [past,setPast]=useState([]);
  const [future,setFuture]=useState([]);
  const [validation,setValidation]=useState([]);
  const [toast,setToast]=useState(null);

  const svgRef=useRef(null);
  const panRef=useRef(null);
  const paintRef=useRef(null);
  const paintBtnRef=useRef(null); // 0=left(단방향), 2=right(양방향)
  const fileRef=useRef(null);
  const toastRef=useRef(null);
  const ctrlDragRef=useRef(null);
  const dragNodeRef=useRef(null);
  const selRectRef=useRef(null); // {x1,y1,x2,y2}
  const [selRect,setSelRect]=useState(null);

  const nodesRef=useRef(nodes); useEffect(()=>{nodesRef.current=nodes;},[nodes]);
  const edgesRef=useRef(edges); useEffect(()=>{edgesRef.current=edges;},[edges]);
  const selNodeIdsRef=useRef(selNodeIds); useEffect(()=>{selNodeIdsRef.current=selNodeIds;},[selNodeIds]);
  const selEdgeIdRef=useRef(selEdgeId); useEffect(()=>{selEdgeIdRef.current=selEdgeId;},[selEdgeId]);

  /* ── 헬퍼 ─────────────────────────────────────────── */
  const nodeById=useMemo(()=>new Map(nodes.map(n=>[n.id,n])),[nodes]);
  const showToast=msg=>{setToast(msg);if(toastRef.current)clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),1800);};
  const snap=(x,y)=>gridSnap&&gridSize>0?{x:Math.round(x/gridSize)*gridSize,y:Math.round(y/gridSize)*gridSize}:{x,y};
  const svgPt=(cx,cy)=>{const s=svgRef.current;if(!s)return{x:0,y:0};const p=s.createSVGPoint();p.x=cx;p.y=cy;const inv=s.getScreenCTM()?.inverse();if(!inv)return{x:0,y:0};const r=p.matrixTransform(inv);return{x:r.x,y:r.y};};
  const newNodeId=()=>"N"+String(nodes.length+1+Math.floor(Math.random()*100)).padStart(4,"0");
  const newEdgeId=()=>"E"+String(edges.length+1+Math.floor(Math.random()*100)).padStart(4,"0");
  const labelScale=1/Math.max(scale,0.001);

  /* ── History ────────────────────────────────────────── */
  const snapshot=()=>({nodes:nodesRef.current.map(n=>({...n})),edges:edgesRef.current.map(e=>({...e}))});
  const pushHistory=()=>{setPast(p=>[...p,snapshot()].slice(-50));setFuture([]);};
  const undo=()=>setPast(p=>{if(!p.length){showToast("되돌릴 내역 없음");return p;}const prev=p[p.length-1];setFuture(f=>[...f,snapshot()]);setNodes(prev.nodes);setEdges(prev.edges);showToast("Undo ↩");return p.slice(0,-1);});
  const redo=()=>setFuture(f=>{if(!f.length){showToast("다시 실행 없음");return f;}const next=f[f.length-1];setPast(p=>[...p,snapshot()]);setNodes(next.nodes);setEdges(next.edges);showToast("Redo ↪");return f.slice(0,-1);});

  /* ── Validation ─────────────────────────────────────── */
  useEffect(()=>{
    const warns=[];
    const degree=new Map(nodes.map(n=>[n.id,{in:0,out:0}]));
    edges.forEach(e=>{const a=degree.get(e.src),b=degree.get(e.dst);if(a){a.out++;if(e.bidir)a.in++;}if(b){b.in++;if(e.bidir)b.out++;}});
    nodes.forEach(n=>{const d=degree.get(n.id)||{in:0,out:0};if(!d.in&&!d.out)warns.push({msg:`고립 노드: ${n.id}`});});
    const parent=new Map(nodes.map(n=>[n.id,n.id]));
    const find=x=>{while(parent.get(x)!==x){parent.set(x,parent.get(parent.get(x)));x=parent.get(x);}return x;};
    edges.forEach(e=>{const ra=find(e.src),rb=find(e.dst);if(ra!==rb)parent.set(ra,rb);});
    const roots=new Set(nodes.map(n=>find(n.id)));
    if(roots.size>1)warns.push({msg:`비연결 컴포넌트 ${roots.size}개`});
    setValidation(warns);
  },[nodes,edges]);

  /* ── Pan / Zoom ─────────────────────────────────────── */
  const onWheel=e=>{
    e.preventDefault();
    const svg=svgRef.current;if(!svg)return;
    if(mode==="speed"&&e.shiftKey&&speedSelIds.size>0){
      const d=e.deltaY<0?VMAX_STEP:-VMAX_STEP;
      setEdges(es=>es.map(ex=>speedSelIds.has(ex.id)?{...ex,v_max:Math.min(VMAX_MAX,Math.max(VMAX_MIN,Math.round(((ex.v_max||VMAX_DEFAULT)+d)*10)/10))}:ex));
      return;
    }
    const rect=svg.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const f=e.deltaY<0?1.15:1/1.15;
    setScale(s=>{const ns=Math.min(10,Math.max(0.1,s*f));setTx(t=>mx-(mx-t)*(ns/s));setTy(t=>my-(my-t)*(ns/s));return ns;});
  };
  const onMouseDown=e=>{
    if(e.button===1||(e.button===0&&e.altKey)){panRef.current={x:e.clientX,y:e.clientY,tx,ty};e.preventDefault();}
  };
  const onMouseMove=e=>{
    if(panRef.current){const{x,y,tx:ox,ty:oy}=panRef.current;setTx(ox+(e.clientX-x));setTy(oy+(e.clientY-y));return;}
    // Node drag
    if(dragNodeRef.current){
      const p=svgPt(e.clientX,e.clientY);
      const{id,startSvgX,startSvgY,origX,origY}=dragNodeRef.current;
      const dx=p.x-startSvgX,dy=p.y-startSvgY;
      const{x:nx,y:ny}=snap(origX+dx,origY+dy);
      setNodes(ns=>ns.map(n=>n.id===id?{...n,x:nx,y:ny}:n));
      return;
    }
    // Ctrl+drag selection rect
    if(selRectRef.current){
      const p=svgPt(e.clientX,e.clientY);
      selRectRef.current={...selRectRef.current,x2:p.x,y2:p.y};
      setSelRect({...selRectRef.current});
      return;
    }
    if(paintRef.current){const p=svgPt(e.clientX,e.clientY);paintRef.current=[...paintRef.current,{x:p.x,y:p.y}];}
    if(ctrlDragRef.current){const p=svgPt(e.clientX,e.clientY);ctrlDragRef.current={...ctrlDragRef.current,curX:p.x,curY:p.y};setHovNodeId(h=>h);}
  };
  const onMouseUp=e=>{
    if(panRef.current){panRef.current=null;return;}
    if(dragNodeRef.current){
      pushHistory();
      dragNodeRef.current=null;
      setDragNode(null);
      return;
    }
    // Ctrl+drag selection rect 확정
    if(selRectRef.current){
      const r=selRectRef.current;
      const minX=Math.min(r.x1,r.x2),maxX=Math.max(r.x1,r.x2);
      const minY=Math.min(r.y1,r.y2),maxY=Math.max(r.y1,r.y2);
      if(maxX-minX>3||maxY-minY>3){
        const inside=nodesRef.current.filter(n=>n.x>=minX&&n.x<=maxX&&n.y>=minY&&n.y<=maxY);
        if(inside.length>0){setSelNodeIds(new Set(inside.map(n=>n.id)));showToast(`${inside.length}개 노드 선택`);}
      }
      selRectRef.current=null;setSelRect(null);return;
    }
    // Paint 완료 → paintBtnRef로 방향 결정
    if(paintRef.current&&mode==="paint"){
      applyPaint(paintRef.current,paintBtnRef.current===2,e.altKey);
      paintRef.current=null;paintBtnRef.current=null;return;
    }
    if(ctrlDragRef.current){
      const{srcId,curX,curY}=ctrlDragRef.current;
      ctrlDragRef.current=null;
      const target=nodes.find(n=>{const dx=n.x-curX,dy=n.y-curY;return Math.hypot(dx,dy)<10*labelScale&&n.id!==srcId;});
      pushHistory();
      if(target){
        setEdges(es=>[...es,{id:newEdgeId(),src:srcId,dst:target.id,bidir:false,v_max:null,graph_idx:primaryGraph,dirCycle:0}]);
        showToast(`+ Edge ${srcId}→${target.id}`);
      } else {
        const{x,y}=snap(curX,curY);
        const nid=newNodeId();
        setNodes(ns=>[...ns,{id:nid,x,y,name:nid,role:"standard",is_charger:false,is_holding:false,graph_idx:primaryGraph,capability:null}]);
        setEdges(es=>[...es,{id:newEdgeId(),src:srcId,dst:nid,bidir:false,v_max:null,graph_idx:primaryGraph,dirCycle:0}]);
        showToast(`+ Node ${nid} + Edge`);
      }
    }
  };

  /* ── Paint ──────────────────────────────────────────── */
  const applyPaint=(traj,forceBidir,altKey)=>{
    if(traj.length<2)return;
    pushHistory();
    const t0=traj[0],tN=traj[traj.length-1],tdx=tN.x-t0.x,tdy=tN.y-t0.y;
    setEdges(es=>es.map(e=>{
      const a=nodeById.get(e.src),b=nodeById.get(e.dst);if(!a||!b)return e;
      const ex=(a.x+b.x)/2-t0.x,ey=(a.y+b.y)/2-t0.y;
      const len=Math.hypot(tdx,tdy)||1;
      if(Math.abs(ex*tdx/len+ey*tdy/len)<18&&Math.abs(ey*tdx/len-ex*tdy/len)<12){
        if(forceBidir)return{...e,bidir:true,dirCycle:1};
        if(altKey)return{...e,bidir:false,src:e.dst,dst:e.src,dirCycle:0};
        const dot=tdx*(b.x-a.x)+tdy*(b.y-a.y);
        if(dot<0)return{...e,bidir:false,src:e.dst,dst:e.src,dirCycle:0};
        return{...e,bidir:false,dirCycle:0};
      }
      return e;
    }));
  };

  /* ── Node interaction ───────────────────────────────── */
  const handleNodeClick=(e,n)=>{
    e.stopPropagation();
    // Build+Node 모드에서 다른 그래프의 노드 위 클릭 → 새 노드 생성(겹치기 허용)
    if(mode==="build"&&buildTool==="node"&&(n.graph_idx||0)!==primaryGraph){
      const{x,y}=snap(n.x,n.y);const id=newNodeId();pushHistory();
      setNodes(ns=>[...ns,{id,x,y,name:id,role:"standard",is_charger:false,is_holding:false,graph_idx:primaryGraph,capability:null}]);
      showToast(`+ Node ${id} (겹침)`);return;
    }
    if(mode==="stamp"){pushHistory();setNodes(ns=>ns.map(x=>x.id!==n.id?x:{...x,role:stampRole,is_charger:stampRole==="charger",is_holding:stampRole==="holding"||stampRole==="holding_candidate"}));return;}
    if(mode==="build"){
      if(buildTool==="delete"){pushHistory();setNodes(ns=>ns.filter(x=>x.id!==n.id));setEdges(es=>es.filter(x=>x.src!==n.id&&x.dst!==n.id));setSelNodeIds(new Set());showToast(`- Node ${n.id}`);return;}
      if(buildTool==="edge"){
        if(e.ctrlKey||e.metaKey){ctrlDragRef.current={srcId:n.id,curX:n.x,curY:n.y};return;}
        if(!edgeSrc){setEdgeSrc(n.id);showToast(`Edge: ${n.id} 선택 → 다음 노드 클릭`);return;}
        if(edgeSrc===n.id){setEdgeSrc(null);return;}
        const bidir=e.shiftKey;
        if(edges.find(x=>(x.src===edgeSrc&&x.dst===n.id)||(x.src===n.id&&x.dst===edgeSrc))){showToast("이미 존재하는 엣지");setEdgeSrc(null);return;}
        pushHistory();
        setEdges(es=>[...es,{id:newEdgeId(),src:edgeSrc,dst:n.id,bidir,v_max:null,graph_idx:primaryGraph,dirCycle:bidir?1:0}]);
        showToast(`+ Edge ${edgeSrc}→${n.id}${bidir?" (bi)":""}`);
        setEdgeSrc(null);return;
      }
      if(buildTool==="node"){
        // Ctrl+drag handled on mousedown
        setSelNodeIds(prev=>{const s=new Set(prev);e.shiftKey?s.has(n.id)?s.delete(n.id):s.add(n.id):(s.clear(),s.add(n.id));return s;});
        return;
      }
    }
    if(mode==="speed")return;
    setSelNodeIds(prev=>{const s=new Set(prev);e.shiftKey?s.has(n.id)?s.delete(n.id):s.add(n.id):(s.clear(),s.add(n.id));return s;});
    setSelEdgeId(null);
  };

  const handleNodeMouseDown=(e,n)=>{
    if(mode==="build"&&buildTool==="edge"&&(e.ctrlKey||e.metaKey)){
      e.stopPropagation();e.preventDefault();
      ctrlDragRef.current={srcId:n.id,curX:n.x,curY:n.y};
      return;
    }
    // Allow drag in stamp or select mode (not build-delete, not pan)
    if(e.button===0&&!e.altKey&&mode!=="speed"&&!(mode==="build"&&buildTool==="delete")){
      e.stopPropagation();
      const p=svgPt(e.clientX,e.clientY);
      dragNodeRef.current={id:n.id,startSvgX:p.x,startSvgY:p.y,origX:n.x,origY:n.y};
      setDragNode(n.id);
    }
  };

  /* ── Edge interaction ───────────────────────────────── */
  const handleEdgeClick=(e,edge)=>{
    e.stopPropagation();
    if(mode==="build"&&buildTool==="delete"){pushHistory();setEdges(es=>es.filter(x=>x.id!==edge.id));setSelEdgeId(null);showToast(`- Edge ${edge.id}`);return;}
    if(mode==="build"&&buildTool==="edge"){pushHistory();setEdges(es=>es.map(x=>x.id!==edge.id?x:{...x,bidir:!x.bidir,dirCycle:x.bidir?0:1}));return;}
    if(mode==="speed"){e.shiftKey?setSpeedSelIds(prev=>{const s=new Set(prev);s.has(edge.id)?s.delete(edge.id):s.add(edge.id);return s;}):setSpeedSelIds(new Set([edge.id]));return;}
    setSelEdgeId(selEdgeId===edge.id?null:edge.id);
    setSelNodeIds(new Set());
  };
  const handleEdgeDblClick=(e,edge)=>{
    e.stopPropagation();
    pushHistory();
    setEdges(es=>es.map(ex=>{
      if(ex.id!==edge.id)return ex;
      const next=(ex.dirCycle+1)%3;
      if(next===0)return{...ex,bidir:false,src:edge.src,dst:edge.dst,dirCycle:0};
      if(next===1)return{...ex,bidir:true,dirCycle:1};
      return{...ex,bidir:false,src:edge.dst,dst:edge.src,dirCycle:2};
    }));
    showToast("Edge 방향 변경");
  };

  /* ── SVG click (empty area) ─────────────────────────── */
  const handleSvgClick=e=>{
    if(e.target===svgRef.current||e.target.dataset.bg){
      if(mode==="build"&&buildTool==="node"){
        const p=svgPt(e.clientX,e.clientY);const{x,y}=snap(p.x,p.y);
        const id=newNodeId();pushHistory();
        setNodes(ns=>[...ns,{id,x,y,name:id,role:"standard",is_charger:false,is_holding:false,graph_idx:primaryGraph,capability:null}]);
        showToast(`+ Node ${id}`);
      } else {
        setSelNodeIds(new Set());setSelEdgeId(null);setEdgeSrc(null);
        if(mode==="speed")setSpeedSelIds(new Set());
      }
    }
  };

  /* ── Paint mode start ───────────────────────────────── */
  const handleSvgMouseDown=e=>{
    const isCtrl=e.ctrlKey||e.metaKey;
    // Ctrl+drag on empty map → selection rectangle
    if(isCtrl&&e.button===0&&mode!=="build"){
      e.preventDefault();
      const p=svgPt(e.clientX,e.clientY);
      selRectRef.current={x1:p.x,y1:p.y,x2:p.x,y2:p.y};
      setSelRect({x1:p.x,y1:p.y,x2:p.x,y2:p.y});
      return;
    }
    // Paint mode: left(단방향), right(양방향), alt+left(역방향)
    if(mode==="paint"&&!panRef.current&&(e.button===0||e.button===2)){
      e.preventDefault();
      const p=svgPt(e.clientX,e.clientY);
      paintRef.current=[{x:p.x,y:p.y}];
      paintBtnRef.current=e.button;
      return;
    }
    onMouseDown(e);
  };

  /* ── Keyboard shortcuts ─────────────────────────────── */
  useEffect(()=>{
    const onKey=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
      const ctrl=e.ctrlKey||e.metaKey;
      // Undo/Redo
      if(ctrl&&e.key==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
      if(ctrl&&e.key==="y"){e.preventDefault();redo();return;}
      // Copy / Paste
      if(ctrl&&e.key==="c"&&selNodeIds.size>0){
        const sel=nodes.filter(n=>selNodeIds.has(n.id));
        const selEdges=edges.filter(ex=>selNodeIds.has(ex.src)&&selNodeIds.has(ex.dst));
        setClipboard({nodes:sel,edges:selEdges});
        showToast(`${sel.length}개 노드 복사`);return;
      }
      if(ctrl&&e.key==="v"&&clipboard){
        e.preventDefault();
        pushHistory();
        const idMap=new Map();
        const newNodes=clipboard.nodes.map(n=>{const id=newNodeId();idMap.set(n.id,id);return{...n,id,x:n.x+20,y:n.y+20,name:id};});
        const newEdges=clipboard.edges.map(ex=>({...ex,id:newEdgeId(),src:idMap.get(ex.src)||ex.src,dst:idMap.get(ex.dst)||ex.dst}));
        setNodes(ns=>[...ns,...newNodes]);
        setEdges(es=>[...es,...newEdges]);
        setSelNodeIds(new Set(newNodes.map(n=>n.id)));
        showToast(`${newNodes.length}개 노드 붙여넣기`);return;
      }
      // Delete
      if(e.key==="Delete"||e.key==="Backspace"){
        const curSelNodes=selNodeIdsRef.current;
        const curSelEdge=selEdgeIdRef.current;
        if(curSelNodes.size>0){
          const snap2=()=>({nodes:nodesRef.current.map(n=>({...n})),edges:edgesRef.current.map(ex=>({...ex}))});
          setPast(p=>[...p,snap2()].slice(-50));setFuture([]);
          setNodes(ns=>ns.filter(n=>!curSelNodes.has(n.id)));
          setEdges(es=>es.filter(ex=>!curSelNodes.has(ex.src)&&!curSelNodes.has(ex.dst)));
          showToast(`${curSelNodes.size}개 노드 삭제`);
          setSelNodeIds(new Set());return;
        }
        if(curSelEdge){
          const snap2=()=>({nodes:nodesRef.current.map(n=>({...n})),edges:edgesRef.current.map(ex=>({...ex}))});
          setPast(p=>[...p,snap2()].slice(-50));setFuture([]);
          setEdges(es=>es.filter(ex=>ex.id!==curSelEdge));
          showToast("Edge 삭제");setSelEdgeId(null);return;
        }
      }
      // Mode shortcuts
      const k=e.key.toLowerCase();
      if(!ctrl){
        if(k==="p")setMode("paint");if(k==="s")setMode("stamp");if(k==="b")setMode("build");if(k==="v")setMode("speed");
        if(k==="n")setBuildTool("node");if(k==="e")setBuildTool("edge");if(k==="d")setBuildTool("delete");
        if(k==="g"||k==="tab"){e.preventDefault();setPrimaryGraph(i=>(i+1)%graphs.length);}
        if(k==="1")setStampRole("standard");if(k==="2")setStampRole("station");if(k==="3")setStampRole("charger");
        if(k==="4")setStampRole("holding");if(k==="5")setStampRole("siding");
        if(k==="escape"){setSelNodeIds(new Set());setSelEdgeId(null);setEdgeSrc(null);setSpeedSelIds(new Set());ctrlDragRef.current=null;selRectRef.current=null;setSelRect(null);}
      }
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[mode,graphs.length,undo,redo,selNodeIds,selEdgeId,clipboard,nodes,edges,primaryGraph]);

  /* ── Wheel event (non-passive) ──────────────────────── */
  useEffect(()=>{
    const el=svgRef.current;if(!el)return;
    el.addEventListener("wheel",onWheel,{passive:false});
    return()=>el.removeEventListener("wheel",onWheel);
  },[mode,speedSelIds,scale,tx,ty]);

  /* ── Graph operations ───────────────────────────────── */
  const copyGraph=(idx)=>{
    const srcGraph=graphs[idx];
    const newIdx=graphs.length;
    const newGraph={idx:newIdx,id:"graph-copy-"+newIdx,name:srcGraph.name+" (복사)",color:"#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0")};
    const srcNodes=nodes.filter(n=>(n.graph_idx||0)===idx);
    const srcEdges=edges.filter(e=>(e.graph_idx||0)===idx);
    const idMap=new Map();
    const newNodes=srcNodes.map(n=>{const id="N"+String(nodes.length+srcNodes.indexOf(n)+1).padStart(4,"0");idMap.set(n.id,id);return{...n,id,name:id,graph_idx:newIdx};});
    const newEdges=srcEdges.map(e=>({...e,id:"E"+String(edges.length+srcEdges.indexOf(e)+1).padStart(4,"0"),src:idMap.get(e.src)||e.src,dst:idMap.get(e.dst)||e.dst,graph_idx:newIdx}));
    pushHistory();
    setGraphs(g=>[...g,newGraph]);
    setNodes(n=>[...n,...newNodes]);
    setEdges(ex=>[...ex,...newEdges]);
    setActiveGraphs(prev=>{const s=new Set(prev);s.add(newIdx);return s;});
    setPrimaryGraph(newIdx);
    showToast(`Graph 복사 → ${newGraph.name}`);
  };

  const deleteGraph=(idx)=>{
    if(graphs.length<=1){showToast("마지막 그래프는 삭제할 수 없습니다");return;}
    pushHistory();
    setNodes(ns=>ns.filter(n=>(n.graph_idx||0)!==idx));
    setEdges(es=>es.filter(e=>(e.graph_idx||0)!==idx));
    setGraphs(gs=>gs.filter((_,i)=>i!==idx));
    setActiveGraphs(prev=>{const s=new Set(prev);s.delete(idx);if(s.size===0)s.add(0);return s;});
    setPrimaryGraph(p=>p===idx?0:p>idx?p-1:p);
    showToast(`Graph ${graphs[idx]?.name} 삭제`);
  };
  const nodeShape=(n)=>{
    const c=ROLE_COLORS[n.role]||ROLE_COLORS.standard;
    const isSel=selNodeIds.has(n.id),isHov=n.id===hovNodeId;
    const r=n.role==="station"?7:n.role==="holding"||n.role==="holding_candidate"?4:5;
    const stroke=isSel?"#2563eb":isHov?"#64748b":c;
    const sw=isSel?2.5:isHov?1.5:1;
    if(n.is_charger||n.role==="charger")return<rect x={-r} y={-r} width={r*2} height={r*2} rx={1.5} fill={c} stroke={stroke} strokeWidth={sw}/>;
    if(n.role==="siding")return<polygon points={`0,${-r} ${r},0 0,${r} ${-r},0`} fill={c} stroke={stroke} strokeWidth={sw}/>;
    if(n.role==="holding_candidate")return<circle r={r} fill="none" stroke={c} strokeWidth={1.5} strokeDasharray="2 2"/>;
    return<circle r={r} fill={n.is_holding?"none":c} stroke={stroke} strokeWidth={sw} strokeDasharray={n.is_holding?"3 2":"none"}/>;
  };
  const edgeColor=(e)=>{
    const gi=e.graph_idx||0;
    if(!activeGraphs.has(gi)&&!showInactive)return null;
    if(!activeGraphs.has(gi))return"#c8d4e0";
    if(e.v_max!=null)return"#c77700";
    return graphs[gi]?.color||"#2459d1";
  };

  const transform=`translate(${tx},${ty}) scale(${scale})`;
  const selNode=selNodeIds.size===1?nodeById.get([...selNodeIds][0]):null;
  const selEdge=selEdgeId?edges.find(e=>e.id===selEdgeId):null;
  const activeMap=floors.find(f=>f.id===activeMapId)||floors[0];

  /* ── Render ─────────────────────────────────────────── */
  return (
    <div className="h-full flex flex-col bg-slate-50" onClick={()=>setMapDropOpen(false)}>
      {/* Top bar */}
      <div className="h-11 px-4 bg-white border-b border-slate-200 flex items-center gap-3 shrink-0">
        <Icon name="Map" size={15} className="text-blue-600"/>
        <span className="text-[13px] font-bold text-slate-900">Map Editor</span>

        {/* Map 선택 드롭다운 */}
        <div className="relative" onClick={e=>e.stopPropagation()}>
          <button onClick={()=>setMapDropOpen(o=>!o)}
            className="h-8 px-3 rounded-lg border border-slate-200 bg-white hover:border-blue-400 flex items-center gap-2 text-[12.5px] font-semibold text-slate-800 transition min-w-[140px]">
            <Icon name="Layers" size={12} className="text-blue-500"/>
            {floors.find(f=>f.id===activeMapId)?.label||activeMapId}
            <Icon name="ChevronDown" size={11} className="ml-auto text-slate-400"/>
          </button>
          {mapDropOpen&&(
            <div className="absolute top-full mt-1 left-0 z-50 bg-white rounded-lg border border-slate-200 shadow-lg overflow-hidden min-w-[160px]">
              {floors.map(m=>(
                <button key={m.id} onClick={()=>{setActiveMapId(m.id);setMapDropOpen(false);}}
                  className={"w-full flex items-center gap-2 px-3 py-2 text-[12px] font-medium text-left hover:bg-slate-50 transition "+(m.id===activeMapId?"bg-blue-50 text-blue-700":"text-slate-700")}>
                  {m.id===activeMapId&&<Icon name="Check" size={11} className="text-blue-500"/>}
                  <span className={m.id!==activeMapId?"ml-4":""}>{m.label}</span>
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="h-4 w-px bg-slate-200"/>
        <span className="text-[11.5px] text-slate-500">{nodes.length} nodes · {edges.length} edges</span>
        {validation.length>0&&<span className="flex items-center gap-1 text-[11px] font-semibold text-amber-600"><Icon name="AlertTriangle" size={11}/>{validation.length}건</span>}
        <div className="ml-auto flex items-center gap-1.5">
          <button onClick={()=>{setTx(0);setTy(0);setScale(1);}} className="h-7 px-2.5 rounded border border-slate-200 bg-white hover:bg-slate-50 text-[11.5px] text-slate-600 flex items-center gap-1.5"><Icon name="Home" size={12}/> Reset</button>
          <button onClick={undo} disabled={!past.length} className="h-7 px-2.5 rounded border border-slate-200 bg-white hover:bg-slate-50 text-[11.5px] text-slate-600 flex items-center gap-1.5 disabled:opacity-40"><Icon name="Undo2" size={12}/> Undo</button>
          <button onClick={redo} disabled={!future.length} className="h-7 px-2.5 rounded border border-slate-200 bg-white hover:bg-slate-50 text-[11.5px] text-slate-600 flex items-center gap-1.5 disabled:opacity-40"><Icon name="Redo2" size={12}/> Redo</button>
          <button className="h-7 px-3 rounded bg-blue-600 hover:bg-blue-700 text-white text-[11.5px] font-semibold flex items-center gap-1.5"><Icon name="Save" size={12}/> Save</button>
        </div>
      </div>

      <div className="flex-1 min-h-0 flex">
        {/* Left Panel */}
        <div className="w-72 border-r border-slate-200 bg-white overflow-y-auto flex flex-col shrink-0 text-[12px]">

          {/* Active Graphs - 다중 선택 */}
          <div className="p-3 border-b border-slate-100">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Graph</div>
            <div className="flex flex-col gap-1">
              {graphs.map((g,i)=>{
                const isActive=activeGraphs.has(i);
                const isPrimary=primaryGraph===i;
                const nCount=nodes.filter(n=>(n.graph_idx||0)===i).length;
                const eCount=edges.filter(e=>(e.graph_idx||0)===i).length;
                return(
                  <div key={i} className={"flex items-center gap-1.5 px-2 py-1.5 rounded-md transition "+(isActive?"":"hover:bg-slate-50")}
                    style={isActive?{background:g.color+"18"}:{}}>
                    <input type="checkbox" checked={isActive}
                      onChange={ev=>{setActiveGraphs(prev=>{const s=new Set(prev);ev.target.checked?s.add(i):s.delete(i);return s;});if(!activeGraphs.has(i))setPrimaryGraph(i);}}
                      className="w-3.5 h-3.5 shrink-0" style={isActive?{accentColor:g.color}:{}}/>
                    {/* Color picker */}
                    <input type="color" value={g.color}
                      onChange={ev=>setGraphs(gs=>gs.map((gr,gi)=>gi===i?{...gr,color:ev.target.value}:gr))}
                      className="w-5 h-5 rounded cursor-pointer border-0 p-0 shrink-0"
                      style={{appearance:"none",WebkitAppearance:"none",background:"none"}}
                      title="색상 변경"/>
                    <button onClick={()=>setPrimaryGraph(i)}
                      className="flex-1 flex items-center gap-1 text-left text-[11.5px] font-medium truncate"
                      style={{color:isActive?g.color:"#64748b"}}>
                      {g.name}
                      {isPrimary&&<span className="text-[9px] font-bold px-1 py-px rounded shrink-0" style={{background:g.color+"30",color:g.color}}>P</span>}
                    </button>
                    <span className="text-[10px] text-slate-400 tnum shrink-0">{nCount}N·{eCount}E</span>
                    <button onClick={()=>copyGraph(i)} title="복사" className="w-5 h-5 rounded hover:bg-slate-200 text-slate-400 hover:text-slate-600 grid place-items-center shrink-0">
                      <Icon name="Copy" size={9}/>
                    </button>
                    <button onClick={()=>deleteGraph(i)} title="삭제" className="w-5 h-5 rounded hover:bg-rose-100 text-slate-300 hover:text-rose-500 grid place-items-center shrink-0">
                      <Icon name="Trash2" size={9}/>
                    </button>
                  </div>
                );
              })}
            </div>
            <label className="mt-2 flex items-center gap-2 text-[11px] text-slate-500 cursor-pointer">
              <input type="checkbox" checked={showInactive} onChange={e=>setShowInactive(e.target.checked)} className="w-3.5 h-3.5"/>
              비활성 그래프 흐리게 표시
            </label>
            <div className="mt-1 text-[10px] text-slate-400">체크박스=표시, 이름 클릭=Primary 설정</div>
          </div>

          {/* Edit Mode */}
          <div className="p-3 border-b border-slate-100">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Edit Mode</div>
            <div className="grid grid-cols-4 gap-1 mb-3">
              {[{id:"stamp",label:"Stamp",key:"S",icon:"Stamp"},{id:"build",label:"Build",key:"B",icon:"Hammer"},{id:"paint",label:"Paint",key:"P",icon:"Brush"},{id:"speed",label:"Speed",key:"V",icon:"Zap"}].map(m=>(
                <button key={m.id} onClick={()=>setMode(m.id)}
                  className={"flex flex-col items-center py-1.5 rounded-md border text-[10px] font-semibold gap-0.5 transition "+(mode===m.id?"bg-blue-600 border-blue-600 text-white":"bg-white border-slate-200 text-slate-600 hover:border-slate-300")}>
                  <Icon name={m.icon} size={12}/>{m.label}<span className="opacity-50">[{m.key}]</span>
                </button>
              ))}
            </div>

            {/* Stamp */}
            {mode==="stamp"&&(
              <div className="space-y-1">
                <div className="text-[10.5px] text-slate-400 mb-1">Node Role</div>
                {NODE_ROLES.map(r=>(
                  <button key={r.id} onClick={()=>setStampRole(r.id)}
                    className={"flex items-center gap-2 w-full px-2 py-1 rounded text-[11.5px] font-medium transition "+(stampRole===r.id?"bg-blue-50 border border-blue-400 text-blue-800":"border border-transparent text-slate-700 hover:bg-slate-50")}>
                    <span className="w-3 h-3 rounded-full shrink-0" style={{background:ROLE_COLORS[r.id]}}/>
                    {r.label}<span className="ml-auto text-[9.5px] text-slate-400">[{r.key}]</span>
                  </button>
                ))}
              </div>
            )}

            {/* Build */}
            {mode==="build"&&(
              <div className="space-y-2">
                <div className="grid grid-cols-3 gap-1">
                  {[{id:"node",label:"Node",key:"N"},{id:"edge",label:"Edge",key:"E"},{id:"delete",label:"Delete",key:"D"}].map(t=>(
                    <button key={t.id} onClick={()=>{setBuildTool(t.id);setEdgeSrc(null);}}
                      className={"py-1.5 rounded border text-[11px] font-semibold transition "+(buildTool===t.id?"bg-blue-600 border-blue-600 text-white":"bg-white border-slate-200 text-slate-600 hover:border-slate-300")}>
                      {t.label} <span className="text-[9px] opacity-60">[{t.key}]</span>
                    </button>
                  ))}
                </div>
                {edgeSrc&&<div className="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5"><Icon name="ArrowRight" size={10} className="inline mr-1"/>시작: {edgeSrc}<br/><span className="text-[10px]">다음 노드 클릭 → 연결 · Shift=양방향</span></div>}
                <div className="text-[10.5px] text-slate-500 space-y-0.5 leading-relaxed">
                  <div className="font-semibold text-slate-600 mb-1">Node</div>
                  <div>· 빈 공간 클릭 → 추가</div>
                  <div>· Ctrl+C/V → 복제 (새 ID)</div>
                  <div>· Delete → 삭제</div>
                  <div className="font-semibold text-slate-600 mt-1.5 mb-1">Edge</div>
                  <div>· 노드A → 노드B 클릭</div>
                  <div>· Ctrl+드래그 → 엣지+노드 자동생성</div>
                  <div>· 더블클릭 → 방향 순환 (→/↔/←)</div>
                  <div>· Delete → 삭제</div>
                </div>
              </div>
            )}

            {/* Paint */}
            {mode==="paint"&&(
              <div className="text-[11px] text-slate-500 space-y-1 leading-relaxed">
                <div>드래그로 엣지 방향 일괄 변경</div>
                <div><span className="font-semibold text-green-700">좌클릭 드래그</span> → 단방향</div>
                <div><span className="font-semibold text-blue-700">우클릭 드래그</span> → 양방향</div>
                <div><span className="font-semibold">Alt+드래그</span> → 역방향</div>
              </div>
            )}

            {/* Speed */}
            {mode==="speed"&&(
              <div className="space-y-2">
                <div className="text-[11px] text-amber-700 font-semibold">v_max 편집 · {speedSelIds.size}개 선택</div>
                <div className="flex items-center gap-2">
                  <input type="number" value={speedVal} min={VMAX_MIN} max={VMAX_MAX} step={VMAX_STEP}
                    onChange={e=>setSpeedVal(+e.target.value)} className="flex-1 h-7 px-2 rounded border border-slate-200 text-[12px] font-semibold text-center"/>
                  <span className="text-[11px] text-slate-500 shrink-0">m/s</span>
                </div>
                <input type="range" value={speedVal} min={VMAX_MIN} max={VMAX_MAX} step={VMAX_STEP} onChange={e=>setSpeedVal(+e.target.value)} className="w-full"/>
                <div className="flex gap-1.5">
                  <button disabled={!speedSelIds.size} onClick={()=>{pushHistory();setEdges(es=>es.map(e=>speedSelIds.has(e.id)?{...e,v_max:speedVal}:e));showToast(`v_max=${speedVal}`);}} className="flex-1 h-7 rounded bg-amber-500 hover:bg-amber-600 text-white text-[11.5px] font-semibold disabled:opacity-40">Apply</button>
                  <button disabled={!speedSelIds.size} onClick={()=>{pushHistory();setEdges(es=>es.map(e=>speedSelIds.has(e.id)?{...e,v_max:null}:e));showToast("v_max 해제");}} className="flex-1 h-7 rounded border border-slate-200 bg-white text-[11.5px] disabled:opacity-40">Unset</button>
                </div>
                <div className="text-[10.5px] text-slate-400">Shift+휠 → ±0.1 미세조정</div>
              </div>
            )}
          </div>

          {/* Grid */}
          <div className="p-3 border-b border-slate-100">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Grid</div>
            <label className="flex items-center gap-2 text-[11.5px] text-slate-700 cursor-pointer mb-1.5">
              <input type="checkbox" checked={showGrid} onChange={e=>setShowGrid(e.target.checked)} className="w-3.5 h-3.5"/>
              Grid 표시
            </label>
            <label className="flex items-center gap-2 text-[11.5px] text-slate-700 cursor-pointer">
              <input type="checkbox" checked={gridSnap} onChange={e=>setGridSnap(e.target.checked)} className="w-3.5 h-3.5"/>
              Grid Snap
              <input type="number" value={gridSize} min="0.5" step="0.5"
                onChange={e=>setGridSize(+e.target.value)}
                className="w-14 h-6 px-1.5 rounded border border-slate-200 text-[11px] text-right ml-auto"/>
              <span className="text-[10.5px] text-slate-400 shrink-0">units</span>
            </label>
          </div>

          {/* Inspector */}
          <div className="p-3 border-b border-slate-100">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Inspector</div>
            {!selNode&&!selEdge?(
              <div className="text-[11.5px] text-slate-400 italic text-center py-2">
                {selNodeIds.size>1?`${selNodeIds.size}개 노드 선택됨`:"노드 또는 엣지를 클릭하세요"}
              </div>
            ):selNode?(
              <div className="space-y-2">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{background:ROLE_COLORS[selNode.role]}}/>
                  <span className="text-[12.5px] font-bold text-slate-900">{selNode.id}</span>
                  <button onClick={()=>{pushHistory();setNodes(ns=>ns.filter(n=>n.id!==selNode.id));setEdges(es=>es.filter(e=>e.src!==selNode.id&&e.dst!==selNode.id));setSelNodeIds(new Set());}} className="ml-auto w-6 h-6 rounded bg-rose-50 hover:bg-rose-100 text-rose-500 grid place-items-center"><Icon name="Trash2" size={11}/></button>
                </div>
                <div className="grid grid-cols-2 gap-1.5">
                  {[["X",selNode.x?.toFixed(1)],["Y",selNode.y?.toFixed(1)],["Role",selNode.role],["Graph",graphs[selNode.graph_idx||0]?.name]].map(([l,v])=>(
                    <div key={l}><div className="text-[9.5px] text-slate-400">{l}</div><div className="text-[11.5px] font-medium text-slate-800 truncate tnum">{v}</div></div>
                  ))}
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 mb-1">이름</div>
                  <input value={selNode.name} onChange={e=>setNodes(ns=>ns.map(n=>n.id===selNode.id?{...n,name:e.target.value}:n))} className="w-full h-7 px-2 rounded border border-slate-200 text-[11.5px] outline-none focus:border-blue-400"/>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 mb-1">Graph</div>
                  <select value={selNode.graph_idx||0} onChange={e=>setNodes(ns=>ns.map(n=>n.id===selNode.id?{...n,graph_idx:+e.target.value}:n))} className="w-full h-7 px-2 rounded border border-slate-200 text-[11.5px] outline-none">
                    {graphs.map((g,i)=><option key={i} value={i}>{g.name}</option>)}
                  </select>
                </div>
              </div>
            ):(
              <div className="space-y-2">
                <div className="flex items-center gap-2">
                  <span className="text-[12.5px] font-bold text-slate-900">{selEdge.id}</span>
                  <span className="text-[10px] font-semibold px-1.5 py-px rounded" style={{background:edgeColor(selEdge)+"22",color:edgeColor(selEdge)||"#64748b"}}>
                    {selEdge.bidir?"↔ 양방향":selEdge.dirCycle===2?"← 역방향":"→ 단방향"}
                  </span>
                  <button onClick={()=>{pushHistory();setEdges(es=>es.filter(e=>e.id!==selEdge.id));setSelEdgeId(null);}} className="ml-auto w-6 h-6 rounded bg-rose-50 hover:bg-rose-100 text-rose-500 grid place-items-center"><Icon name="Trash2" size={11}/></button>
                </div>
                <div className="grid grid-cols-2 gap-1.5">
                  {[["From",selEdge.src],["To",selEdge.dst],["v_max",selEdge.v_max!=null?selEdge.v_max+"m/s":"미설정"],["Graph",graphs[selEdge.graph_idx||0]?.name]].map(([l,v])=>(
                    <div key={l}><div className="text-[9.5px] text-slate-400">{l}</div><div className="text-[11.5px] font-medium text-slate-800 truncate tnum">{v}</div></div>
                  ))}
                </div>
                <div className="flex gap-1.5">
                  <button onClick={()=>handleEdgeDblClick({stopPropagation:()=>{}},selEdge)} className="flex-1 h-7 rounded border border-slate-200 bg-white hover:bg-slate-50 text-[11px] font-semibold text-slate-700">방향 순환 →↔←</button>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 mb-1">Graph</div>
                  <select value={selEdge.graph_idx||0} onChange={e=>setEdges(es=>es.map(ed=>ed.id===selEdge.id?{...ed,graph_idx:+e.target.value}:ed))} className="w-full h-7 px-2 rounded border border-slate-200 text-[11.5px] outline-none">
                    {graphs.map((g,i)=><option key={i} value={i}>{g.name}</option>)}
                  </select>
                </div>
              </div>
            )}
          </div>

          {/* Background */}
          <div className="p-3 border-b border-slate-100">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Background Image</div>
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=ev=>setBgUrl(ev.target?.result);r.readAsDataURL(f);}}}/>
            <div className="flex gap-1.5">
              <button onClick={()=>fileRef.current?.click()} className="flex-1 h-7 rounded border border-slate-200 bg-white hover:bg-slate-50 text-[11.5px] text-slate-600 flex items-center justify-center gap-1"><Icon name="Image" size={11}/> 선택</button>
              {bgUrl&&<button onClick={()=>setBgUrl(null)} className="w-7 h-7 rounded border border-slate-200 bg-white hover:bg-rose-50 text-rose-400 grid place-items-center"><Icon name="X" size={11}/></button>}
            </div>
            {bgUrl&&<div className="mt-2"><div className="flex justify-between text-[10.5px] text-slate-500 mb-1"><span>불투명도</span><span className="tnum">{Math.round(bgOpacity*100)}%</span></div><input type="range" min={0} max={1} step={0.05} value={bgOpacity} onChange={e=>setBgOpacity(+e.target.value)} className="w-full"/></div>}
          </div>

          {/* Validation */}
          <div className="p-3">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
              Validation
              {validation.length===0?<span className="text-[10px] text-emerald-600 font-semibold">✓ 정상</span>:<span className="text-[10px] text-amber-600 font-semibold">{validation.length}건</span>}
            </div>
            {validation.length===0?<div className="text-[11px] text-slate-400 italic">경고 없음</div>:(
              <div className="space-y-1">
                {validation.map((w,i)=>(
                  <div key={i} className="flex items-start gap-1.5 text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">
                    <Icon name="AlertTriangle" size={10} className="shrink-0 mt-px"/>{w.msg}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* SVG 지도 */}
        <div className="flex-1 relative overflow-hidden"
          onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}>
          <svg ref={svgRef} className="w-full h-full"
            style={{cursor:panRef.current?"grabbing":mode==="build"&&buildTool==="node"?"crosshair":mode==="stamp"?"cell":"default"}}
            onMouseDown={handleSvgMouseDown}
            onClick={handleSvgClick}
            onContextMenu={e=>e.preventDefault()}>

            {/* Background image */}
            {bgUrl&&<image href={bgUrl} x="0" y="0" width="100%" height="100%" opacity={bgOpacity} preserveAspectRatio="xMidYMid meet" data-bg="1"/>}

            <g transform={transform}>
              <defs>
                {/* Grid pattern */}
                {showGrid&&gridSize>0&&(
                  <pattern id="grid" width={gridSize} height={gridSize} patternUnits="userSpaceOnUse">
                    <path d={`M ${gridSize} 0 L 0 0 0 ${gridSize}`} fill="none" stroke="#e2e8f0" strokeWidth={0.5*labelScale}/>
                  </pattern>
                )}
                {/* Arrowhead markers */}
                {[...graphs.map(g=>g.color),"#c77700","#9aa5b1"].map((c,i)=>(
                  <marker key={i} id={"arr-"+i} markerWidth={6*labelScale} markerHeight={6*labelScale} refX={5*labelScale} refY={3*labelScale} orient="auto" markerUnits="userSpaceOnUse">
                    <path d={`M0,0 L${6*labelScale},${3*labelScale} L0,${6*labelScale} Z`} fill={c}/>
                  </marker>
                ))}
              </defs>

              {/* Grid background */}
              {showGrid&&gridSize>0&&(
                <rect x={-10000} y={-10000} width={20000} height={20000} fill="url(#grid)" data-bg="1"/>
              )}

              {/* Edges */}
              {edges.map(e=>{
                const a=nodeById.get(e.src),b=nodeById.get(e.dst);if(!a||!b)return null;
                const gi=e.graph_idx||0;
                if(!activeGraphs.has(gi)&&!showInactive)return null;
                const c=edgeColor(e);if(!c)return null;
                const isSel=e.id===selEdgeId,isHov=e.id===hovEdgeId,isSpd=speedSelIds.has(e.id);
                const sw=(isSel||isSpd?3:isHov?2.5:1.5)*labelScale;
                const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
                const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
                const nx=dx/len,ny=dy/len;
                const aw=7*labelScale,ah=4*labelScale;
                const arrFwd=`M${-aw/2},${-ah/2} L${aw/2},0 L${-aw/2},${ah/2} Z`;
                return(
                  <g key={e.id} style={{cursor:"pointer"}} opacity={activeGraphs.has(gi)?1:0.25}
                    onMouseEnter={()=>setHovEdgeId(e.id)} onMouseLeave={()=>setHovEdgeId(null)}
                    onClick={ev=>handleEdgeClick(ev,e)}
                    onDoubleClick={ev=>handleEdgeDblClick(ev,e)}>
                    <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="transparent" strokeWidth={12*labelScale}/>
                    <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={isSel?"#2563eb":c} strokeWidth={sw} strokeDasharray={e.v_max!=null?`${4*labelScale} ${2*labelScale}`:"none"}/>
                    {/* Forward arrow */}
                    <path d={arrFwd} fill={isSel?"#2563eb":c} transform={`translate(${mx+nx*5*labelScale},${my+ny*5*labelScale}) rotate(${Math.atan2(ny,nx)*180/Math.PI})`}/>
                    {/* Back arrow (bidir) */}
                    {e.bidir&&<path d={arrFwd} fill={isSel?"#2563eb":c} transform={`translate(${mx-nx*5*labelScale},${my-ny*5*labelScale}) rotate(${(Math.atan2(ny,nx)+Math.PI)*180/Math.PI})`}/>}
                    {e.v_max!=null&&<text x={mx+ny*9*labelScale} y={my-nx*9*labelScale} textAnchor="middle" dominantBaseline="middle" fontSize={8*labelScale} fontWeight="700" fill="#c77700">{e.v_max}</text>}
                    {isSel&&<line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#2563eb" strokeWidth={(sw+2)*labelScale} opacity={0.25}/>}
                  </g>
                );
              })}

              {/* Edge-src indicator */}
              {edgeSrc&&nodeById.get(edgeSrc)&&(()=>{const n=nodeById.get(edgeSrc);return<circle cx={n.x} cy={n.y} r={14*labelScale} fill="none" stroke="#f59e0b" strokeWidth={2*labelScale} strokeDasharray={`${3*labelScale} ${2*labelScale}`}/>;})()}

              {/* Ctrl+drag preview */}
              {ctrlDragRef.current&&nodeById.get(ctrlDragRef.current.srcId)&&(()=>{
                const sn=nodeById.get(ctrlDragRef.current.srcId);
                const{curX,curY}=ctrlDragRef.current;
                return<g><line x1={sn.x} y1={sn.y} x2={curX} y2={curY} stroke="#2563eb" strokeWidth={1.5*labelScale} strokeDasharray={`${4*labelScale} ${2*labelScale}`} opacity={0.7}/><circle cx={curX} cy={curY} r={6*labelScale} fill="#dbeafe" stroke="#2563eb" strokeWidth={1.5*labelScale} opacity={0.8}/></g>;
              })()}

              {/* Nodes */}
              {nodes.map(n=>{
                const gi=n.graph_idx||0;
                if(!activeGraphs.has(gi)&&!showInactive)return null;
                const opacity=activeGraphs.has(gi)?1:0.3;
                return(
                  <g key={n.id} opacity={opacity} transform={`translate(${n.x},${n.y})`}
                    style={{cursor:dragNode===n.id?"grabbing":mode==="stamp"?"cell":"grab"}}
                    onMouseEnter={()=>setHovNodeId(n.id)} onMouseLeave={()=>setHovNodeId(null)}
                    onClick={ev=>handleNodeClick(ev,n)}
                    onMouseDown={ev=>handleNodeMouseDown(ev,n)}>
                    <circle r={14*labelScale} fill="transparent"/>
                    {nodeShape(n)}
                    <text y={9*labelScale} textAnchor="middle" fontSize={7.5*labelScale} fontWeight="600" fill="#475569" style={{userSelect:"none",pointerEvents:"none"}}>{n.id}</text>
                  </g>
                );
              })}

              {paintRef.current&&paintRef.current.length>1&&(()=>{
                const d="M"+paintRef.current.map(p=>`${p.x},${p.y}`).join(" L");
                return<path d={d} fill="none" stroke="#2563eb" strokeWidth={2*labelScale} opacity={0.5} strokeDasharray={`${4*labelScale} ${2*labelScale}`}/>;
              })()}

              {/* Ctrl+drag 선택 영역 */}
              {selRect&&(
                <rect
                  x={Math.min(selRect.x1,selRect.x2)} y={Math.min(selRect.y1,selRect.y2)}
                  width={Math.abs(selRect.x2-selRect.x1)} height={Math.abs(selRect.y2-selRect.y1)}
                  fill="rgba(37,99,235,0.06)" stroke="#2563eb"
                  strokeWidth={1.5*labelScale} strokeDasharray={`${5*labelScale} ${3*labelScale}`}
                  style={{pointerEvents:"none"}}/>
              )}
            </g>
          </svg>

          {/* Toast */}
          {toast&&<div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[12px] font-medium px-3 py-1.5 rounded-lg shadow-lg pointer-events-none z-50">{toast}</div>}
        </div>

        {/* Right Panel */}

      </div>
    </div>
  );
}

function RecipeView({ onSaveRecipe }) {
  const [mode,setMode]=useState("list");
  const [editId,setEditId]=useState(null);
  const [metaMap,setMetaMap]=useState({
    "rcp-01":{creator:"samsung.kim", created:"2026-04-01", modifier:"park.lee",   modified:"2026-05-10"},
    "rcp-02":{creator:"choi.jun",    created:"2026-04-03", modifier:"samsung.kim",modified:"2026-05-09"},
    "rcp-03":{creator:"samsung.kim", created:"2026-04-05", modifier:"samsung.kim",modified:"2026-05-08"},
    "rcp-04":{creator:"park.lee",    created:"2026-04-10", modifier:"choi.jun",   modified:"2026-05-07"},
    "rcp-05":{creator:"choi.jun",    created:"2026-04-12", modifier:"park.lee",   modified:"2026-05-06"},
    "rcp-06":{creator:"park.lee",    created:"2026-04-15", modifier:"park.lee",   modified:"2026-05-05"},
  });

  function handleSave(recipe) {
    // 메타 업데이트
    const now = new Date();
    const dateStr = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    setMetaMap(prev=>({
      ...prev,
      [recipe.id]: prev[recipe.id]
        ? {...prev[recipe.id], modifier:"samsung.kim", modified:dateStr}
        : {creator:"samsung.kim", created:dateStr, modifier:"samsung.kim", modified:dateStr}
    }));
    onSaveRecipe(recipe);
    setMode("list");
  }

  if (mode==="builder") return <RecipeBuilder recipeId={editId} onBack={()=>setMode("list")} onSave={handleSave}/>;

  const tempCount = 3;

  return <RecipeList
    recipes={recipes}
    meta={metaMap}
    tempCount={tempCount}
    onEdit={(id)=>{setEditId(id);setMode("builder");}}
    onNew={()=>{setEditId(null);setMode("builder");}}
  />;
}

                    </span>
                  </td>
                  <td className="py-3 tnum text-slate-700">{dur}초</td>
                  <td className="py-3">
                    <span className={"inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11px] font-medium "+st.bg+" "+st.fg}>
                      {st.label}
                    </span>
                  </td>
                  <td className="py-3 font-mono text-[11.5px] text-slate-600">{m.creator}</td>
                  <td className="py-3 tnum text-[11.5px] text-slate-500">{m.created}</td>
                  <td className="py-3 font-mono text-[11.5px] text-slate-600">{m.modifier}</td>
                  <td className="py-3 tnum text-[11.5px] text-slate-500">{m.modified}</td>
                  <td className="py-3 pr-3">
                    {!r.locked && (
                    <button onClick={()=>onEdit(r.id)} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 text-slate-400 opacity-0 group-hover:opacity-100 transition">
                      <Icon name="Pencil" size={13}/>
                    </button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        {/* Pagination */}
        <div className="h-12 px-4 border-t border-slate-200 flex items-center justify-between bg-slate-50/40">
          <span className="text-[11.5px] text-slate-500 tnum">
            {filtered.length===0 ? "0건" : `${(page-1)*PAGE_SIZE+1}–${Math.min(page*PAGE_SIZE,filtered.length)} / ${filtered.length}건`}
          </span>
          <div className="flex items-center gap-1">
            <button onClick={()=>setPage(1)} disabled={page===1} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600">
              <Icon name="ChevronsLeft" size={13}/>
            </button>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600">
              <Icon name="ChevronLeft" size={13}/>
            </button>
            {Array.from({length:totalPages},(_,i)=>i+1)
              .filter(p=>p===1||p===totalPages||Math.abs(p-page)<=1)
              .reduce((acc,p,i,arr)=>{
                if(i>0&&arr[i-1]!==p-1) acc.push("...");
                acc.push(p); return acc;
              },[])
              .map((p,i)=>
                p==="..."
                  ? <span key={"e"+i} className="w-7 h-7 grid place-items-center text-[12px] text-slate-400">{"…"}</span>
                  : <button key={p} onClick={()=>setPage(p)}
                      className={"w-7 h-7 grid place-items-center rounded text-[12px] font-medium "+(p===page?"bg-blue-600 text-white":"hover:bg-slate-100 text-slate-600")}>
                      {p}
                    </button>
              )
            }
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600">
              <Icon name="ChevronRight" size={13}/>
            </button>
            <button onClick={()=>setPage(totalPages)} disabled={page===totalPages} className="w-7 h-7 grid place-items-center rounded hover:bg-slate-100 disabled:opacity-30 text-slate-600">
              <Icon name="ChevronsRight" size={13}/>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
function RecipeBuilder({ recipeId, onBack, onSave }) {
  const initial = recipes.find(r=>r.id===recipeId);
  const [name,setName]=useState(initial?initial.name:"신규 레시피");
  const [fleet,setFleet]=useState(initial?initial.fleet:"semi");
  const [fleetOpen,setFleetOpen]=useState(false);
  const [deliveryWarn,setDeliveryWarn]=useState(null); // fleet id pending confirm
  const [saved,setSaved]=useState(false); // Save 성공 토스트

  function handleSave() {
    const id = recipeId || ("rcp-"+Date.now());
    const recipe = { id, name, fleet, steps, nodes, status:"published" };
    if (onSave) onSave(recipe);
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  }
  const [nodes,setNodes]=useState(()=>{
    if(initial&&initial.nodes&&initial.nodes.length>0)return initial.nodes;
    if(initial)return initial.steps.map((s,i)=>({id:s.nodeId,x:120+(i%4)*160,y:140+Math.floor(i/4)*130,label:"Node "+(i+1)}));
    return[];
  });
  const [steps,setSteps]=useState(()=>initial?initial.steps.map(s=>s.slots?s:{nodeId:s.nodeId,mode:"sequential",slots:[{actionType:s.actionType,duration:s.duration}]}):[]);
  const [selIdx,setSelIdx]=useState(steps.length>0?0:null);
  const [selSlot,setSelSlot]=useState(0);
  const mapRef=useRef(null);
  const [mapMode,setMapMode]=useState("select");
  const [mapId,setMapId]=useState(floors[0].id);
  const [mapDropOpen,setMapDropOpen]=useState(false);
  const [dragFrom,setDragFrom]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [tempSaves,setTempSaves]=useState([]);
  const [tempListOpen,setTempListOpen]=useState(false);

  const selStep=selIdx!==null?steps[selIdx]:null;
  const selNode=selStep?nodes.find(n=>n.id===selStep.nodeId):null;
  const stepDur=s=>{
    if(!s.slots||!s.slots.length) return 0;
    if(s.mode==="parallel") return Math.max(...s.slots.map(sl=>sl.duration||0));
    return s.slots.reduce((sum,sl)=>sum+(sl.duration||0),0);
  };
  const totalDur=steps.reduce((s,st)=>s+stepDur(st),0);

  function addStepForNode(node){
    if(!nodes.find(n=>n.id===node.id))setNodes(p=>[...p,node]);
    const validActs=actionTypes.filter(a=>a.fleets.includes(fleet));
    const def=validActs[0]||actionTypes[0];
    setSteps(p=>{setSelIdx(p.length);setSelSlot(0);return[...p,{nodeId:node.id,mode:"sequential",slots:[{actionType:def.id,duration:def.defaultDuration}]}];});
  }
  function removeStep(idx){
    const nodeId=steps[idx].nodeId;
    const newSteps=steps.filter((_,i)=>i!==idx);
    setSteps(newSteps);
    if(!newSteps.find(s=>s.nodeId===nodeId)){setNodes(p=>p.filter(n=>n.id!==nodeId));}
    setSelIdx(null);setSelSlot(0);
  }
  function updateStep(idx,patch){setSteps(p=>p.map((s,i)=>i===idx?{...s,...patch}:s));}
  function updateSlot(stepIdx,slotIdx,patch){
    setSteps(p=>p.map((s,i)=>i!==stepIdx?s:{...s,slots:s.slots.map((sl,j)=>j!==slotIdx?sl:{...sl,...patch})}));
  }
  function addSlot(stepIdx){
    const validActs=actionTypes.filter(a=>a.fleets.includes(fleet));
    const def=validActs[0]||actionTypes[0];
    setSteps(p=>p.map((s,i)=>{
      if(i!==stepIdx||s.slots.length>=3) return s;
      const newSlots=[...s.slots,{actionType:def.id,duration:def.defaultDuration}];
      setSelSlot(newSlots.length-1);
      return {...s,slots:newSlots};
    }));
  }
  function removeSlot(stepIdx,slotIdx){
    setSteps(p=>p.map((s,i)=>{
      if(i!==stepIdx||s.slots.length<=1) return s;
      const newSlots=s.slots.filter((_,j)=>j!==slotIdx);
      setSelSlot(Math.min(slotIdx,newSlots.length-1));
      return {...s,slots:newSlots};
    }));
  }
  function handleMapClick(e){
    if(mapMode!=="create")return;
    const rect=mapRef.current.getBoundingClientRect();
    const x=Math.round(e.clientX-rect.left),y=Math.round(e.clientY-rect.top);
    const id="N"+(nodes.length+1);
    addStepForNode({id,x,y,label:"Custom "+(nodes.length+1)});
  }
  function doTempSave(){
    const now=new Date();
    const ts=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    setTempSaves(p=>[{id:Date.now(),name,fleet,steps:[...steps],nodes:[...nodes],savedAt:ts},...p.slice(0,19)]);
  }
  function switchMap(newMapId){
    if(steps.length>0){doTempSave();}
    setMapId(newMapId);
    setMapDropOpen(false);
  }
  function restoreTemp(t){
    setName(t.name);setFleet(t.fleet);setSteps([...t.steps]);setNodes([...t.nodes]);
    setSelIdx(null);setTempListOpen(false);
  }

  // Drag-to-reorder flow blocks
  function onBlockDragStart(e,i){setDragFrom(i);e.dataTransfer.effectAllowed="move";}
  function onBlockDragOver(e,i){e.preventDefault();if(dragFrom===null||dragFrom===i)return;setDragOver(i);}
  function onBlockDrop(e,i){
    e.preventDefault();
    if(dragFrom===null||dragFrom===i){setDragFrom(null);setDragOver(null);return;}
    const next=[...steps];const[moved]=next.splice(dragFrom,1);next.splice(i,0,moved);
    setSteps(next);setSelIdx(i);setDragFrom(null);setDragOver(null);
  }

  const currentFloor=floors.find(f=>f.id===mapId)||floors[0];

  return (
    <div className="h-full flex flex-col relative">

        <span className="text-slate-300">/</span>
        <span className="text-[13px] font-semibold text-slate-900 truncate max-w-[200px]">{name}</span>
        <div className="ml-auto flex items-center gap-2">

            <Icon name="Clock" size={12}/> 임시저장
          </button>
          <button onClick={handleSave}
            className={"h-8 px-3.5 rounded-md text-white text-[12.5px] font-medium flex items-center gap-1.5 transition-all "+(saved?"bg-emerald-500":"bg-blue-600 hover:bg-blue-700")}>
            <Icon name={saved?"Check":"Save"} size={12}/>
            {saved?"저장 완료!":"Save"}
          </button>
        </div>
      </div>

      <div className="flex-1 min-h-0 grid" style={{gridTemplateColumns:"260px 1fr"}}>
        {/* Left panel */}
        <div className="border-r border-slate-200 bg-white overflow-y-auto">

          {/* 1. 레시피명 */}
          <div className="p-4 border-b border-slate-200">
            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-1.5">템플릿명</div>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="템플릿 이름 입력"
              className="h-9 px-2.5 w-full rounded-md border border-slate-200 bg-white text-[13px] font-medium text-slate-900 outline-none focus:border-blue-400 placeholder:text-slate-300 placeholder:font-normal"/>
          </div>

          {/* 2. 대상 Fleet {"—"} 드롭다운 */}
          <div className="p-4 border-b border-slate-200">
            <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-1.5">대상 Fleet</div>
            <div className="relative">
              <button onClick={()=>setFleetOpen(o=>!o)}
                className={"h-9 w-full pl-3 pr-8 rounded-md border bg-white flex items-center gap-2 text-[12.5px] font-medium transition "+(fleetOpen?"border-blue-400 ring-2 ring-blue-100":"border-slate-200 hover:border-slate-300")}>
                
                <span className="text-slate-900">{fleets.find(f=>f.id===fleet)?.name}</span>

              </button>
              {fleetOpen&&<>
                <div className="fixed inset-0 z-10" onClick={()=>setFleetOpen(false)}/>

/* ══════════════════════════════════════════
   SCHEDULER (GANTT)
══════════════════════════════════════════ */
const GANTT = { startHour:6, endHour:20, pxPerMin:2.4, rowH:56, BUFFER:5 };
const GW = (GANTT.endHour-GANTT.startHour)*60*GANTT.pxPerMin;
const RCOL = 168;
const SC = {
  done:   {bg:"bg-slate-100",border:"border-slate-300",fg:"text-slate-700",label:"완료",chip:"#94a3b8"},
  running:{bg:"bg-blue-100", border:"border-blue-400", fg:"text-blue-900", label:"진행중",chip:"#2563eb"},
  queued: {bg:"bg-amber-50", border:"border-amber-300",fg:"text-amber-900",label:"예약",chip:"#d97706"},
  error:  {bg:"bg-rose-100", border:"border-rose-400", fg:"text-rose-900", label:"실패",chip:"#e11d48"},
  pending:{bg:"bg-purple-50",border:"border-purple-400",fg:"text-purple-900",label:"Pending",chip:"#7c3aed"},
};

function getOrderDur(o){
  if(o.duration) return o.duration;
  const r = recipes.find(r=>r.id===o.recipeId);
  return r ? recipeDuration(r) : 30;
}

function computePlacement(allOrders, robotId, desiredStart, duration, ignoreId) {
  const row = allOrders.filter(o=>o.robotId===robotId&&o.id!==ignoreId);
  let start=desiredStart, safety=0, conflict=false;
  while(safety++<100){
    const end=start+duration;
    const blocker=row.find(o=>{const dur=getOrderDur(o);const os=o.start-GANTT.BUFFER,oe=o.start+dur+GANTT.BUFFER;return start<oe&&end>os;});
    if(!blocker)break;
    conflict=true;
    start=blocker.start+getOrderDur(blocker)+GANTT.BUFFER;
  }
  return {start,conflict};
}

function MultiSelectDropdown({ label, value, onChange, options, colorMap }) {

  const [open, setOpen] = useState(false);
  const allSelected = value.size === 0;

  const toggle = id => {
    const n = new Set(value);
    n.has(id) ? n.delete(id) : n.add(id);
    onChange(n);
  };

  const displayLabel = allSelected
    ? `전체 ${label}`
    : value.size === 1
      ? options.find(o=>o.id===[...value][0])?.label || `${label} 1개`
      : `${label} ${value.size}개`;

  return (
    <div className="relative">
