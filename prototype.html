    {id:"TC-001",cat:"CPT"},{id:"TC-002",cat:"CTR"},{id:"TC-003",cat:"CBT"},
    {id:"TC-004",cat:"CLV"},{id:"TC-005",cat:"CPS"},
  ];

  const [fleet,    setFleet]     = useState(null);
  const [form,     setForm]      = useState({});
  const [confirmed, setConfirmed]= useState(false);
  const [schedMode, setSchedMode] = useState("immediate"); // "immediate" | "scheduled"
  const [schedDate, setSchedDate] = useState(()=>{
    const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  });
  const [schedHour, setSchedHour] = useState(new Date().getHours());
  const [schedMin,  setSchedMin]  = useState(Math.ceil(new Date().getMinutes()/10)*10%60);

  const setF = (k,v) => setForm(p=>({...p,[k]:v}));
  const fleetDef = FLEETS.find(f=>f.id===fleet);
  const pickNode = mapNodes.find(n=>n.id===form.pickNode);
  const dropNode = mapNodes.find(n=>n.id===form.dropNode);

  /* ── 노드 클릭 처리: 1번째=pick, 2번째=drop, 재클릭=취소 ── */
  function handleNodeClick(nodeId){
    if(!fleet) return;
    if(form.pickNode===nodeId){ setF("pickNode", null); return; }
    if(form.dropNode===nodeId){ setF("dropNode", null); return; }
    if(!form.pickNode){ setF("pickNode", nodeId); return; }
    if(!form.dropNode){ setF("dropNode", nodeId); return; }
    // 둘 다 선택된 경우 pick을 교체
    setF("pickNode", nodeId);
    setF("dropNode", null);
  }

  /* ── 미니맵 (전체 화면) ── */
  const W=600, H=420, scale=0.72, OX=40, OY=30;
  const MapArea = ()=>{
    const hint = !fleet ? "Fleet를 먼저 선택하세요"
      : !form.pickNode ? "노드 클릭 → Pick 위치 선택"
      : !form.dropNode ? "노드 클릭 → Drop 위치 선택"
      : null;
    return (
      <div className="flex-1 min-h-0 relative bg-[#f8fafc] rounded-xl border border-slate-200 overflow-hidden">
        {hint&&(
          <div className="absolute top-3 left-1/2 -translate-x-1/2 z-10 flex items-center gap-2 px-3 py-1.5 rounded-lg shadow-md pointer-events-none text-[12px] font-semibold"
            style={{background: !fleet?"#1e293bbb":!form.pickNode?"#2563ebee":"#059669ee", color:"white"}}>
            <Icon name="MousePointerClick" size={13}/>
            {hint}
          </div>
        )}
        <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`}
          style={{cursor:fleet?"pointer":"default"}}>
          {mapEdges.map(e=>{
            const a=mapNodes.find(n=>n.id===e.from), b=mapNodes.find(n=>n.id===e.to);
            if(!a||!b) return null;
            return <line key={e.id}
              x1={a.x*scale+OX} y1={a.y*scale+OY}
              x2={b.x*scale+OX} y2={b.y*scale+OY}
              stroke="#cbd5e1" strokeWidth={1.5} strokeDasharray="5 3" opacity={0.7}/>;
          })}
          {pickNode&&dropNode&&(
            <line x1={pickNode.x*scale+OX} y1={pickNode.y*scale+OY}
                  x2={dropNode.x*scale+OX} y2={dropNode.y*scale+OY}
              stroke="#6366f1" strokeWidth={2.5} strokeDasharray="8 4" opacity={0.7}/>
          )}
          {mapNodes.map(n=>{
            const cx=n.x*scale+OX, cy=n.y*scale+OY;
            const isPick=n.id===form.pickNode, isDrop=n.id===form.dropNode;
            return (
              <g key={n.id} style={{cursor:fleet?"pointer":"default"}}
                onClick={()=>handleNodeClick(n.id)}>
                {(isPick||isDrop)&&<circle cx={cx} cy={cy} r={16}
                  fill={isPick?"#2563eb22":"#10b98122"}
                  stroke={isPick?"#2563eb":"#10b981"} strokeWidth={1.5} strokeDasharray="3 2"/>}
                <rect x={cx-7} y={cy-7} width={14} height={14} rx={3}
                  fill={isPick?"#2563eb":isDrop?"#10b981":"white"}
                  stroke={isPick?"#2563eb":isDrop?"#10b981":"#94a3b8"}
                  strokeWidth={isPick||isDrop?2.5:1.5}/>
                <text x={cx} y={cy+22} textAnchor="middle"
                  fontSize={isPick||isDrop?9:8.5} fontWeight={isPick||isDrop?"700":"500"}
                  fill={isPick?"#1d4ed8":isDrop?"#059669":"#64748b"}>
                  {n.label}
                </text>
                {(isPick||isDrop)&&(
                  <text x={cx} y={cy-16} textAnchor="middle" fontSize={9.5} fontWeight="800"
                    fill={isPick?"#1d4ed8":"#059669"}>
                    {isPick?"● Pick":"● Drop"}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
        <div className="absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm rounded-lg border border-slate-200 px-3 py-2 flex gap-4 text-[11px]">
          <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-sm bg-blue-600"/><span className="text-slate-600">Pick (1번째)</span></div>
          <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-sm bg-emerald-500"/><span className="text-slate-600">Drop (2번째)</span></div>
          <div className="text-slate-400">{"·"} 재클릭 시 취소</div>
        </div>
      </div>
    );
  };
  /* ── 공통 UI ── */
  const Field = ({label,children,required})=>(
    <div className="space-y-1">
      <label className="text-[11.5px] font-semibold text-slate-600">{label}{required&&<span className="text-rose-500 ml-0.5">*</span>}</label>
      {children}
    </div>
  );
  const NodeSelect = ({field, label, color})=>{
    const nodeId = form[field];
    const node = mapNodes.find(n=>n.id===nodeId);
    return (
      <Field label={label} required>
        <div className="relative">
          <select value={nodeId||""} onChange={e=>setF(field,e.target.value)}
            className="w-full h-8 pl-2.5 pr-7 rounded-md border text-[12px] outline-none appearance-none"
            style={{borderColor:node?color+"80":"#e2e8f0", background:node?color+"08":"white", color:"#1e293b"}}>
            <option value="">드롭다운 또는 지도 직접 선택</option>
            {mapNodes.map(n=><option key={n.id} value={n.id}>{n.label} ({n.id})</option>)}
          </select>
          <Icon name="ChevronDown" size={11} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
        </div>
        {node&&<div className="text-[10.5px] mt-0.5 font-medium" style={{color}}>✓ {node.label} ({node.id})</div>}
      </Field>
    );
  };
  const Sel = ({val,onChange,opts,placeholder})=>(
    <div className="relative">
      <select value={val||""} onChange={e=>onChange(e.target.value)}
        className="w-full h-8 pl-2.5 pr-7 rounded-md border border-slate-200 bg-white text-[12px] text-slate-800 outline-none focus:border-blue-400 appearance-none">
        <option value="">{placeholder||"선택"}</option>
        {opts.map(o=><option key={o.id||o} value={o.id||o}>{o.label||o}</option>)}
      </select>
      <Icon name="ChevronDown" size={11} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
    </div>
  );
  const Inp = ({val,onChange,placeholder})=>(
    <input value={val||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      className="w-full h-8 px-2.5 rounded-md border border-slate-200 bg-white text-[12px] text-slate-800 outline-none focus:border-blue-400"/>
  );

  /* ── 유효성 검사 ── */
  const isValid = ()=>{
    if(!fleet||!form.pickNode||!form.dropNode) return false;
    if(fleetDef?.id==="amr"&&!form.cartId) return false;
    if(fleetDef?.id==="agv"&&!form.passengerId) return false;
    if(fleetDef?.id==="arm"&&!form.userId) return false;
    return true;
  };

  /* ── 요청 실행 ── */
  const publish = ()=>{
    const ordId = "ORD-"+Date.now().toString().slice(-5);
    const now = new Date();
    const startMin = schedMode==="immediate"
      ? now.getHours()*60+now.getMinutes()+2
      : schedHour*60+schedMin;
    const cartInfo = TOOL_CARTS.find(c=>c.id===form.cartId);
    const order = {
      id:ordId, fleet:fleetDef.id, fleetName:fleetDef.name, fleetColor:fleetDef.color,
      robotId:form.robotId||(fleetDef.robotIds[0]),
      pickNode:form.pickNode, dropNode:form.dropNode,
      startMin, duration:30,
      status: schedMode==="immediate" ? "running" : "queued",
      fromRequest: true,
      label:`${fleetDef.name} · ${form.pickNode}→${form.dropNode}`,
      detail: fleetDef.id==="amr"
        ? {cartId:form.cartId, cartCat:cartInfo?.cat}
        : fleetDef.id==="agv"
        ? {passengerId:form.passengerId}
        : {userId:form.userId},
      priority:form.priority||"normal", memo:form.memo||"", schedMode,
    };
    onNavigate("schedule", {pendingOrder:order});
  };

  return (
    <div className="h-full flex flex-col overflow-hidden bg-slate-50">
      {/* 헤더 */}
      <div className="h-14 px-6 border-b border-slate-200 bg-white flex items-center gap-3 shrink-0">
        <div className="flex items-center gap-2 text-[12px] text-slate-400">
          <span>작업 관리</span><Icon name="ChevronRight" size={12}/><span className="text-slate-700 font-semibold">작업 요청</span>
        </div>
        {fleetDef&&(
          <div className="flex items-center gap-1.5 ml-2 px-2.5 py-1 rounded-full text-[11.5px] font-semibold" style={{background:fleetDef.color+"15",color:fleetDef.color}}>
            {fleetDef.name}
          </div>
        )}
        <div className="ml-auto flex items-center gap-2">
          {isValid()&&(
            <button onClick={publish}
              className="h-9 px-5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[13px] font-semibold flex items-center gap-2 shadow-sm transition">
              <Icon name="Send" size={14}/> 요청 및 스케줄러 이동
            </button>
          )}
        </div>
      </div>

      <div className="flex-1 min-h-0 flex overflow-hidden">
        {/* 좌측 패널 */}
        <div className="w-72 shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-y-auto">
          {/* Fleet 선택 */}
          <div className="p-4 border-b border-slate-200">
            <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Fleet 선택</div>
            <div className="relative">
              <select value={fleet||""} onChange={e=>{setFleet(e.target.value||null);setForm({});}}
                className="w-full h-9 pl-3 pr-8 rounded-lg border border-slate-200 bg-white text-[13px] text-slate-800 outline-none focus:border-blue-400 appearance-none">
                <option value="">Fleet 선택...</option>
                {FLEETS.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
              </select>
              <Icon name="ChevronDown" size={13} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
            </div>
          </div>

          {/* 파라미터 폼 */}
          {fleetDef&&(
            <div className="p-4 flex flex-col gap-3 flex-1">
              <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide">위치 선택</div>
              <NodeSelect field="pickNode" label="Pick 위치" color="#2563eb"/>
              <NodeSelect field="dropNode" label="Drop 위치" color="#10b981"/>

              <div className="h-px bg-slate-100 my-1"/>
              <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide">상세 정보</div>

              {fleetDef.id==="amr"&&(
                <Field label="Tool Cart" required>
                  <Sel val={form.cartId} onChange={v=>setF("cartId",v)}
                    opts={TOOL_CARTS.map(c=>({id:c.id,label:`${c.id} · ${c.cat}`}))}
                    placeholder="Cart 선택"/>
                </Field>
              )}
              {fleetDef.id==="agv"&&(
                <Field label="승객 ID" required>
                  <Inp val={form.passengerId} onChange={v=>setF("passengerId",v)} placeholder="사번 또는 ID"/>
                </Field>
              )}
              {fleetDef.id==="arm"&&(
                <Field label="사용자 ID" required>
                  <Inp val={form.userId} onChange={v=>setF("userId",v)} placeholder="사번 또는 ID"/>
                </Field>
              )}

              <div className="h-px bg-slate-100 my-1"/>
              <div className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wide">요청 시간</div>
              {/* 즉시 요청 버튼 */}
              <div className="flex gap-2">
                <button onClick={()=>setSchedMode("immediate")}
                  className={"flex-1 h-8 rounded-lg border-2 text-[12px] font-semibold flex items-center justify-center gap-1.5 transition "+(schedMode==="immediate"?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 text-slate-600 hover:border-slate-300")}>
                  <Icon name="Zap" size={12}/> 즉시
                </button>
                <button onClick={()=>setSchedMode("scheduled")}
                  className={"flex-1 h-8 rounded-lg border-2 text-[12px] font-semibold flex items-center justify-center gap-1.5 transition "+(schedMode==="scheduled"?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 text-slate-600 hover:border-slate-300")}>
                  <Icon name="Clock" size={12}/> 예약
                </button>
              </div>
              {schedMode==="scheduled"&&(
                <div className="space-y-2">
                  <div className="relative">
                    <Icon name="Calendar" size={11} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                    <input type="date" value={schedDate} onChange={e=>setSchedDate(e.target.value)}
                      className="w-full h-8 pl-7 pr-2 rounded-md border border-slate-200 bg-white text-[12px] text-slate-800 outline-none focus:border-blue-400"/>
                  </div>
                  <div className="flex gap-2">
                    <div className="relative flex-1">
                      <select value={schedHour} onChange={e=>setSchedHour(Number(e.target.value))}
                        className="w-full h-8 pl-2.5 pr-6 rounded-md border border-slate-200 bg-white text-[12px] text-slate-800 outline-none focus:border-blue-400 appearance-none">
                        {Array.from({length:24},(_,i)=><option key={i} value={i}>{String(i).padStart(2,"0")}시</option>)}
                      </select>
                      <Icon name="ChevronDown" size={10} className="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                    </div>
                    <div className="relative flex-1">
                      <select value={schedMin} onChange={e=>setSchedMin(Number(e.target.value))}
                        className="w-full h-8 pl-2.5 pr-6 rounded-md border border-slate-200 bg-white text-[12px] text-slate-800 outline-none focus:border-blue-400 appearance-none">
                        {[0,10,20,30,40,50].map(m=><option key={m} value={m}>{String(m).padStart(2,"0")}분</option>)}
                      </select>
                      <Icon name="ChevronDown" size={10} className="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                    </div>
                  </div>
                  <div className="text-[10.5px] text-slate-500 text-center">
                    {schedDate} {String(schedHour).padStart(2,"0")}:{String(schedMin).padStart(2,"0")} 에 요청
                  </div>
                </div>
              )}
              {schedMode==="immediate"&&(
                <div className="text-[10.5px] text-blue-600 text-center py-1">요청 즉시 실행 (약 2분 후 시작)</div>
              )}
              <Field label="담당 로봇">
                <Sel val={form.robotId} onChange={v=>setF("robotId",v)}
                  opts={fleetDef.robotIds.map(id=>({id,label:id}))} placeholder="자동 배정"/>
              </Field>
              <Field label="우선순위">
                <Sel val={form.priority} onChange={v=>setF("priority",v)}
                  opts={[{id:"normal",label:"일반"},{id:"urgent",label:"긴급"}]} placeholder="일반"/>
              </Field>
              <Field label="메모">
                <Inp val={form.memo} onChange={v=>setF("memo",v)} placeholder="특이사항 (선택)"/>
              </Field>

              {/* 요청 버튼 */}
              <div className="mt-auto pt-3">
                <button onClick={publish} disabled={!isValid()}
                  className={"w-full h-10 rounded-xl text-[13px] font-bold flex items-center justify-center gap-2 transition "+(isValid()?"bg-blue-600 hover:bg-blue-700 text-white shadow-sm":"bg-slate-100 text-slate-300 cursor-not-allowed")}>
                  <Icon name="Send" size={14}/> 요청
                </button>
              </div>
            </div>
          )}

          {!fleetDef&&(
            <div className="flex-1 flex items-center justify-center p-6">
              <div className="text-center">
                <Icon name="Workflow" size={28} className="mx-auto text-slate-300 mb-3"/>
                <div className="text-[13px] font-semibold text-slate-500">Fleet를 선택하세요</div>
                <div className="text-[11.5px] text-slate-400 mt-1">좌측에서 Fleet를 선택하면<br/>파라미터 입력창이 나타납니다</div>
              </div>
            </div>
          )}
        </div>

        {/* 우측 지도 */}
        <div className="flex-1 min-w-0 p-5 flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <div className="text-[12px] font-semibold text-slate-600 flex items-center gap-1.5">
              <Icon name="Map" size={14} className="text-slate-500"/>
              위치 선택 {"·"} 지도에서 직접 노드를 클릭하거나 좌측 드롭다운을 사용하세요
            </div>
            <div className="flex items-center gap-2 text-[11px] text-slate-500">
              <div className="w-2.5 h-2.5 rounded-sm bg-blue-600"/>Pick
              <div className="w-2.5 h-2.5 rounded-sm bg-emerald-500"/>Drop
            </div>
          </div>
          <MapArea/>
        </div>
      </div>
    </div>
  );
}


function SchedulerView({ initialFocusRecipeId, pendingOrder, onMounted, onNavigate }) {
  const [orders,setOrders]=useState(initOrders.map(o=>({...o})));
  const [selOrder,setSelOrder]=useState(null);
  const [draggingRcp,setDraggingRcp]=useState(null);
  const [hoverPrev,setHoverPrev]=useState(null);
  const [slotPending,setSlotPending]=useState(null); // {recipe, groupId, filled:[{slot,robotId}], total}
  const [libOpen,setLibOpen]=useState(true);
  const [libTab,setLibTab]=useState("library");
  const [filterTemplate,setFilterTemplate]=useState(null);
  const [reqFleetF,setReqFleetF]=useState(new Set());
  const [reqTplF,setReqTplF]=useState(new Set());
  const [libFleetDropOpen,setLibFleetDropOpen]=useState(false);
  const [reqFleetDropOpen,setReqFleetDropOpen]=useState(false);
  const [reqTplDropOpen,setReqTplDropOpen]=useState(false);
  const [now,setNow]=useState(()=>{const d=new Date();return d.getHours()*60+d.getMinutes();});
  const [hlRcp,setHlRcp]=useState(initialFocusRecipeId||null);
  const [openExpanded,setOpenExpanded]=useState(null); // 아코디언 열린 key
  const [addOpen,setAddOpen]=useState(false);
  const [fleetF,setFleetF]=useState(new Set());
  const [libQ,setLibQ]=useState("");
  const [libFleetF,setLibFleetF]=useState(new Set());
  const [moving,setMoving]=useState(null);
  const [schedDate,setSchedDate]=useState("2026-05-13");
  const [schedMapId,setSchedMapId]=useState("p3-3f");
  const [schedMapOpen,setSchedMapOpen]=useState(false);
  const pressRef=useRef(null);
  const lastDragRef=useRef(0);
  const ganttRef=useRef(null);
  const headRef=useRef(null);
  const rColRef=useRef(null);

  // 오더 템플릿에서 넘어온 pendingOrder 등록
  useEffect(()=>{
    if(!pendingOrder) return;
    const newOrd = {
      id:       pendingOrder.id,
      robotId:  pendingOrder.robotId,
      recipeId: null,
      start:    pendingOrder.startMin,
      duration: pendingOrder.duration,
      status:   pendingOrder.schedMode==="immediate" ? "running" : "queued",
      fromRequest: true,
      label:    `${pendingOrder.fleetName} · ${pendingOrder.pickNode}→${pendingOrder.dropNode}`,
      fleetColor: pendingOrder.fleetColor,
      fleet:    pendingOrder.fleet,
      fleetName:pendingOrder.fleetName,
      pickNode: pendingOrder.pickNode,
      dropNode: pendingOrder.dropNode,
      detail:   pendingOrder.detail,
      priority: pendingOrder.priority,
      requesterId: "samsung.kim",   // 프로토타입: 현재 로그인 사용자
    };
    setOrders(p=>[...p, newOrd]);
    setSelOrder(newOrd);
    if(onMounted) onMounted();
  },[pendingOrder]);

  useEffect(()=>{if(filterTemplate) setReqTplF(new Set([filterTemplate])); else setReqTplF(new Set());},[filterTemplate]);

  const allR=robots;
  const visR=fleetF.size===0?allR:allR.filter(r=>fleetF.has(r.fleet));

  useEffect(()=>{const id=setInterval(()=>setNow(n=>n+1),8000);return()=>clearInterval(id);},[]);
  useEffect(()=>{
    // 초기 로드 시 현재 시점을 화면 중앙으로 스크롤
    if(!ganttRef.current) return;
    const centerOffset=(now-GANTT.startHour*60)*GANTT.pxPerMin - ganttRef.current.clientWidth/2;
    ganttRef.current.scrollLeft=Math.max(0,centerOffset);
  },[]);
  useEffect(()=>{
    const g=ganttRef.current,h=headRef.current;if(!g||!h)return;
    const fn=()=>{h.scrollLeft=g.scrollLeft;if(rColRef.current)rColRef.current.scrollTop=g.scrollTop;};
    g.addEventListener("scroll",fn);return()=>g.removeEventListener("scroll",fn);
  },[]);

  function timeFromX(clientX){
    const rect=ganttRef.current.getBoundingClientRect();
    const x=clientX-rect.left+ganttRef.current.scrollLeft;
    const min=GANTT.startHour*60+x/GANTT.pxPerMin;

                    ["Fleet", selOrder.fleetName||fleetMeta(recipes.find(r=>r.id===selOrder.recipeId)?.fleet||"amr").name],

                  {isEditable(selOrder)?<>

                    {selOrder.status==="queued"&&"현재 시점 이후 작업만 수정 가능"}
                  </div>}
                </div>
              </>);
            })()}
          </div>

          onCreate={payload=>{

          const dur=recipeDuration(r),p=computePlacement(orders,payload.robotId,payload.start,dur,null);

function AddFleetDropdown({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const current = fleets.find(f=>f.id===value);
  return (
    <div className="relative">
      <button onClick={()=>setOpen(o=>!o)}
        className={"h-9 w-full pl-3 pr-8 rounded-md border bg-white flex items-center gap-2 text-[12.5px] font-medium transition "+(open?"border-blue-400 ring-2 ring-blue-100":"border-slate-200 hover:border-slate-300")}>
        
        <span className="text-slate-900">{current?.name}</span>
        <Icon name="ChevronDown" size={12} className={"ml-auto text-slate-400 transition-transform "+(open?"rotate-180":"")}/>
      </button>
      {open&&<>
        <div className="fixed inset-0 z-10" onClick={()=>setOpen(false)}/>
        <div className="absolute z-20 top-full mt-1 left-0 right-0 bg-white rounded-lg shadow-xl border border-slate-200 py-1 overflow-hidden">
          {fleets.map(f=>(
            <button key={f.id} onClick={()=>{onChange(f.id);setOpen(false);}}
              className={"w-full flex items-center gap-2.5 px-3 py-2 hover:bg-blue-50 "+(f.id===value?"bg-blue-50":"")}>
              
              <span className={"text-[12.5px] flex-1 "+(f.id===value?"text-blue-700 font-semibold":"text-slate-700")}>{f.name}</span>
              {f.id===value&&<Icon name="Check" size={12} className="text-blue-600"/>}
            </button>
          ))}
        </div>
      </>}
    </div>
  );
}

function AddOrderDialog({ orders, onClose, onCreate, onNavigateRequest }) {
  const today=new Date();
  const todayStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  const [fleet,setFleetRaw]=useState("semi");
  const [deliveryWarn,setDeliveryWarn]=useState(null);
  function setFleet(f){ if(["amr","agv","arm"].includes(f)){ setDeliveryWarn(f); } else { setFleetRaw(f); } }
  const fr=recipes.filter(r=>r.fleet===fleet);
  const rb=robots.filter(r=>r.fleet===fleet);
  const [recipeId,setRecipeId]=useState(fr[0]?.id||"");
  const [robotId,setRobotId]=useState(rb[0]?.id||"");
  const [date,setDate]=useState(todayStr);
  const [hour,setHour]=useState(13);
  const [minute,setMinute]=useState(0);
  const [repeat,setRepeat]=useState(false);
  const [repeatDays,setRepeatDays]=useState(new Set());
  useEffect(()=>{const rs=recipes.filter(r=>r.fleet===fleet),rbs=robots.filter(r=>r.fleet===fleet);if(!rs.find(r=>r.id===recipeId))setRecipeId(rs[0]?.id||"");if(!rbs.find(r=>r.id===robotId))setRobotId(rbs[0]?.id||"");},[fleet]);
  const recipe=recipes.find(r=>r.id===recipeId);
  const dur=recipe?recipeDuration(recipe):0;
  const desired=hour*60+minute;
  const placement=recipe&&robotId?computePlacement(orders,robotId,desired,dur,null):{start:desired,conflict:false};
  const shifted=placement.conflict&&placement.start!==desired;
  const DAYS=[{id:0,label:"일"},{id:1,label:"월"},{id:2,label:"화"},{id:3,label:"수"},{id:4,label:"목"},{id:5,label:"금"},{id:6,label:"토"}];
  const toggleDay=d=>{const n=new Set(repeatDays);n.has(d)?n.delete(d):n.add(d);setRepeatDays(n);};
  const dayLabel=DAYS.filter(d=>repeatDays.has(d.id)).map(d=>d.label).join("·");
  const presetLabel=repeatDays.size===7?" (매일)":(!repeatDays.has(0)&&!repeatDays.has(6)&&repeatDays.size===5)?" (평일)":(repeatDays.has(0)&&repeatDays.has(6)&&repeatDays.size===2)?" (주말)":"";
  return (
    <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm grid place-items-center p-4" onClick={onClose}>
      <div className="w-[540px] bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden" onClick={e=>e.stopPropagation()}>
        {/* Delivery fleet 경고 팝업 */}
        {deliveryWarn&&(
          <div className="absolute inset-0 z-10 bg-white/95 backdrop-blur-sm flex items-center justify-center p-6">
            <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-sm p-6">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-10 h-10 rounded-xl bg-amber-100 grid place-items-center shrink-0"><Icon name="AlertTriangle" size={20} className="text-amber-600"/></div>
                <div>
                  <div className="text-[15px] font-bold text-slate-900">작업 요청 화면 이동 필요</div>
                  <div className="text-[12px] text-slate-500 mt-0.5">{fleetMeta(deliveryWarn).name}</div>
                </div>
              </div>
              <p className="text-[13px] text-slate-700 leading-relaxed mb-5">
                이 Fleet의 작업은 <strong>작업 요청 화면</strong>에서<br/>Pick/Drop 위치를 지정하여 요청해야 합니다.<br/>작업 요청 화면으로 이동하시겠습니까?
              </p>
              <div className="flex gap-3 justify-end">
                <button onClick={()=>setDeliveryWarn(null)} className="h-9 px-5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[13px] font-medium text-slate-700">아니요</button>
                <button onClick={()=>{onClose();if(onNavigateRequest)onNavigateRequest();}}
                  className="h-9 px-5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[13px] font-semibold">네, 이동합니다</button>
              </div>
            </div>
          </div>
        )}
        <div className="h-12 px-5 border-b border-slate-200 flex items-center gap-2">
          <div className="w-7 h-7 rounded-md bg-blue-50 grid place-items-center text-blue-600"><Icon name="CalendarPlus" size={14}/></div>

        </div>

          {/* Fleet */}
          <div>

          </div>
          {/* Recipe + Robot */}
          <div className="grid grid-cols-2 gap-3">
            <div><div className="text-[11px] font-medium text-slate-500 mb-1">레시피</div><div className="relative"><select value={recipeId} onChange={e=>setRecipeId(e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none focus:border-blue-400 appearance-none">{fr.map(r=><option key={r.id} value={r.id}>{r.name}{"·"}{recipeDuration(r)}분</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div></div>
            <div><div className="text-[11px] font-medium text-slate-500 mb-1">할당 로봇</div><div className="relative"><select value={robotId} onChange={e=>setRobotId(e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none focus:border-blue-400 appearance-none"><option value="">자동 배정</option>{rb.map(r=><option key={r.id} value={r.id}>{r.id} 지정</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div></div>

              <div className="relative">
                <Icon name="Calendar" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none z-10"/>

              </div>
              <div className="relative"><select value={hour} onChange={e=>setHour(+e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none appearance-none">{Array.from({length:24},(_,i)=><option key={i} value={i}>{String(i).padStart(2,"0")}시</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div>
              <div className="relative"><select value={minute} onChange={e=>setMinute(+e.target.value)} className="h-9 pl-3 pr-8 w-full rounded-md border border-slate-200 bg-white text-[12.5px] text-slate-800 outline-none appearance-none">{[0,5,10,15,20,25,30,35,40,45,50,55].map(m=><option key={m} value={m}>{String(m).padStart(2,"0")}분</option>)}</select><Icon name="ChevronDown" size={12} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/></div>
            </div>
          </div>
          {/* Repeat */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <div className="text-[11px] font-medium text-slate-500">반복 설정</div>

                </div>
                <Icon name="Repeat" size={12}/>
                반복 {repeat?"켜짐":"꺼짐"}
              </button>
            </div>
            {repeat && (
              <div className="rounded-lg border border-blue-200 bg-blue-50/40 p-3">
                <div className="text-[10.5px] font-semibold text-blue-600 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                  <Icon name="CalendarDays" size={11}/> 반복 요일 선택
                </div>
                <div className="flex items-center gap-1.5">
                  {DAYS.map(d=>{
                    const on=repeatDays.has(d.id);
                    const isSun=d.id===0,isSat=d.id===6;
                    return (
                      <button key={d.id} onClick={()=>toggleDay(d.id)}
                        className={"flex-1 h-10 rounded-lg text-[13px] font-bold border-2 transition-all "+(
                          on ? isSun?"border-rose-400 bg-rose-500 text-white shadow-sm"

                          : "border-slate-200 bg-white text-slate-500 hover:border-slate-300 hover:bg-slate-50"
                        )}>
                        {d.label}
                      </button>
                    );
                  })}
                </div>
                <div className="mt-2 h-5 flex items-center">
                  {repeatDays.size>0 ? (
                    <div className="flex items-center gap-1.5 text-[10.5px] text-blue-600">
                      <Icon name="Check" size={10}/>
                      <span className="font-medium">{dayLabel}{presetLabel} 반복</span>
                    </div>
                  ) : (
                    <div className="flex items-center gap-1 text-[10.5px] text-slate-400">
                      <Icon name="Info" size={10}/> 요일을 하나 이상 선택해주세요
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
          {/* Preview */}
          {recipe&&(
            <div className={"rounded-md border p-3 "+(shifted?"border-amber-300 bg-amber-50":"border-blue-200 bg-blue-50/60")}>
              <div className="flex items-center gap-2 text-[11.5px]">
                <Icon name={shifted?"AlertTriangle":"Sparkles"} size={12} className={shifted?"text-amber-600":"text-blue-600"}/>

                <span className="ml-auto text-slate-500 tnum">{robotId||"자동 배정"}{"·"}{fmtTime(placement.start)}{"—"}{fmtTime(placement.start+dur)}</span>
              </div>
              {repeat&&repeatDays.size>0&&(
                <div className="mt-1.5 text-[10.5px] text-blue-600 flex items-center gap-1.5">
                  <Icon name="Repeat" size={10}/>
                  <span>{dayLabel}{presetLabel} {"·"} 매주 반복 예약</span>
                </div>
              )}
            </div>
          )}
        </div>
        <div className="h-14 px-5 border-t border-slate-200 bg-slate-50/50 flex items-center gap-2">
          {repeat&&repeatDays.size>0&&<div className="text-[10.5px] text-blue-600 flex items-center gap-1"><Icon name="Repeat" size={11}/>{repeatDays.size}개 요일 반복</div>}
          <button onClick={onClose} className="ml-auto h-9 px-3.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">취소</button>
          <button onClick={()=>{if(!recipeId)return;if(repeat&&repeatDays.size===0)return;const assignRobot=robotId||rb[0]?.id;if(!assignRobot)return;onCreate({recipeId,robotId:assignRobot,start:placement.start,date,repeat,repeatDays:[...repeatDays]});}}
            disabled={!recipeId||(repeat&&repeatDays.size===0)}
            className="h-9 px-4 rounded-md bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-[12.5px] font-medium flex items-center gap-1.5 shadow-sm">
            <Icon name="Send" size={13}/> {repeat?"반복 스케줄 생성":"생성"}
          </button>
        </div>
      </div>
    </div>
  );
}

  // 데이터 필터
  function filterByFleet(data){ return data.filter(d=>selFleetNames.includes(d.fleet)||selFleetNames.length===0); }

  const orderFiltered = (hasRobot && cat3==="작업")
    ? filterByFleet(ORDER_DATA).filter(d=>!q||d.robotId.includes(q)||d.taskType.includes(q)||d.statusCode.includes(q))
    : [];
  const errorFiltered = (hasRobot && cat3==="Error")
    ? filterByFleet(ERROR_DATA).filter(d=>{
        if(levelF.size>0&&!levelF.has(d.severity.toLowerCase())) return false;
        if(q&&!d.robotId.includes(q)&&!d.errorCode.includes(q)&&!d.message.includes(q)) return false;
        return true;
      })
    : [];

  const isInfraOnly = hasInfra && !hasRobot;
  const isRobotOrder = hasRobot && cat3==="작업";
  const isRobotError = hasRobot && cat3==="Error";

  const statusBadge = (code)=>{
    const t = code.startsWith("DONE")?"emerald":code.startsWith("RUN")?"blue":code.startsWith("FAIL")?"rose":code.startsWith("WARN")?"amber":code.startsWith("CHG")?"purple":code.startsWith("SCHED")?"slate":"slate";
    const cols={emerald:"bg-emerald-50 text-emerald-700",blue:"bg-blue-50 text-blue-700",rose:"bg-rose-50 text-rose-700",amber:"bg-amber-50 text-amber-700",purple:"bg-purple-50 text-purple-700",slate:"bg-slate-100 text-slate-600"};
    return <span className={"text-[10.5px] font-semibold px-1.5 py-0.5 rounded "+cols[t]}>{code}</span>;
  };
  const sevBadge = (s)=>{
    const c=s==="Error"?"bg-rose-50 text-rose-700":s==="Warn"?"bg-amber-50 text-amber-700":"bg-slate-100 text-slate-600";
    return <span className={"text-[10.5px] font-semibold px-1.5 py-0.5 rounded flex items-center gap-1 w-fit "+c}><Icon name={s==="Error"?"AlertCircle":s==="Warn"?"AlertTriangle":"Info"} size={10}/>{s}</span>;
  };
  const actionBadge = (s)=>{
    const c=s==="해결됨"?"bg-emerald-50 text-emerald-700":s==="처리중"?"bg-blue-50 text-blue-700":s==="EMS호출"?"bg-rose-50 text-rose-700":s==="자동복구"?"bg-slate-100 text-slate-600":"bg-slate-100 text-slate-500";
    return <span className={"text-[10.5px] font-medium px-1.5 py-0.5 rounded "+c}>{s}</span>;
  };

  const TagBtn=({on,onClick,label,tone})=>{
    const cls=on?(tone==="rose"?"border-rose-400 bg-rose-50 text-rose-700":tone==="amber"?"border-amber-400 bg-amber-50 text-amber-700":"border-blue-500 bg-blue-50 text-blue-700"):"border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:bg-slate-50";
    return <button onClick={onClick} className={"h-8 px-3.5 rounded-lg text-[12px] font-medium border-2 transition "+cls}>{label}</button>;
  };

  const tdCls = "py-2.5 pr-3 text-[11.5px] text-slate-700 whitespace-nowrap";
  const thCls = "font-medium py-2.5 pr-3 text-[10.5px] text-slate-500 whitespace-nowrap";

  const totalCount = isRobotOrder?orderFiltered.length:isRobotError?errorFiltered.length:0;

  return (
    <div className="h-full flex flex-col bg-slate-50">
      <div className="px-6 pt-5 pb-0">
        <div className="flex items-end justify-between mb-4">
          <div>
            <h1 className="text-[20px] font-semibold text-slate-900 tracking-tight">로그 조회</h1>
            <p className="text-[12.5px] text-slate-500 mt-0.5">대분류 {"·"} 중분류 {"·"} 소분류 선택 후 로그를 조회하세요.</p>
          </div>
          <button className="h-9 px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700 flex items-center gap-1.5 shadow-sm">
            <Icon name="Download" size={13}/> CSV 내보내기
          </button>
        </div>

        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden mb-4">
          <div className="divide-y divide-slate-100">
            {/* 대분류 */}
            <div className="flex items-center gap-4 px-4 py-3">
              <span className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider w-14 shrink-0">대분류</span>
              <div className="flex items-center gap-2">
                {Object.keys(HIERARCHY).map(k=>(
                  <button key={k} onClick={()=>selectCat1(k)}
                    className={"h-8 px-4 rounded-lg text-[12.5px] font-semibold border-2 flex items-center gap-2 transition "+(cat1.has(k)?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
                    <Icon name={HIERARCHY[k].icon} size={12}/>
                    {k}
                    {cat1.has(k)&&<Icon name="Check" size={11} className="text-blue-500"/>}
                  </button>
                ))}
              </div>
            </div>

            {/* 중분류 */}
            <div className="flex items-start gap-4 px-4 py-3">
              <span className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider w-14 shrink-0 mt-1.5">중분류</span>
              <div className="flex flex-wrap gap-2">
                {(()=>{const single2=[...cat1].some(c=>HIERARCHY[c]?.single2);if(single2)return null;const allOn=sub2Options.length>0&&sub2Options.every(k=>cat2.has(k));return(
                  <button onClick={()=>setCat2(allOn?new Set([sub2Options[0]]):new Set(sub2Options))}
                    className={"h-8 px-3.5 rounded-lg text-[12px] font-semibold border-2 transition flex items-center gap-1.5 "+(allOn?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
                    {allOn&&<Icon name="Check" size={11} className="text-blue-500"/>}
                    전체
                  </button>
                );})()}
                {sub2Options.map(k=>{
                  const on=cat2.has(k);
                  const single2=[...cat1].some(c=>HIERARCHY[c]?.single2);
                  return(
                    <button key={k} onClick={()=>single2?setCat2(new Set([k])):toggle(setCat2,k)}
                      className={"h-8 px-3.5 rounded-lg text-[12px] font-medium border-2 transition flex items-center gap-1.5 "+(on?"border-blue-500 bg-blue-50 text-blue-700":"border-slate-200 bg-white text-slate-600 hover:border-slate-300")}>
                      {on&&<Icon name="Check" size={11} className="text-blue-500"/>}
                      {k}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 소분류 — 단일 선택 */}
            <div className="flex items-start gap-4 px-4 py-3">
              <span className="text-[10.5px] font-semibold text-slate-400 uppercase tracking-wider w-14 shrink-0 mt-1.5">소분류</span>
              <div className="flex flex-wrap gap-2">
                {sub3Options.map(k=>{
                  const on=cat3===k;
                  const isErr=k==="Error"||k==="오류";
                  return(
                    <button key={k} onClick={()=>setCat3(k)}
                      className={"h-8 px-3.5 rounded-lg text-[12px] font-semibold border-2 transition flex items-center gap-1.5 "+(
                        on ? isErr?"border-rose-400 bg-rose-50 text-rose-700":"border-blue-500 bg-blue-50 text-blue-700"
                           : "border-slate-200 bg-white text-slate-600 hover:border-slate-300"
                      )}>
                      {on&&<Icon name="Check" size={11} className={isErr?"text-rose-500":"text-blue-500"}/>}
                      {k}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 레벨 (Error 소분류 시에만) */}
            {showLevel&&(
              <div className="flex items-center gap-4 px-4 py-3 bg-rose-50/30">
                <span className="text-[10.5px] font-semibold text-rose-400 uppercase tracking-wider w-14 shrink-0">레벨</span>
                <div className="flex items-center gap-2">
                  {[{id:"error",label:"Error",tone:"rose"},{id:"warn",label:"Warn",tone:"amber"},{id:"info",label:"Info",tone:""}].map(t=>(
                    <TagBtn key={t.id} on={levelF.has(t.id)} onClick={()=>toggle(setLevelF,t.id)} label={t.label} tone={t.tone}/>
                  ))}
                  {levelF.size>0&&<button onClick={()=>setLevelF(new Set())} className="h-8 px-2.5 text-[11.5px] text-slate-400 hover:text-slate-600 flex items-center gap-1"><Icon name="RotateCcw" size={11}/> 초기화</button>}
                </div>
              </div>
            )}
          </div>

          {/* 검색 + 브레드크럼 */}
          <div className="flex items-center gap-3 px-4 py-2.5 border-t border-slate-100 bg-slate-50/50">
            <div className="flex items-center gap-1.5 text-[11px] flex-1 flex-wrap">
              <Icon name="Filter" size={11} className="text-slate-400 shrink-0"/>
              {[...cat1].map(c=><span key={c} className="px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 font-medium">{c}</span>)}
              <Icon name="ChevronRight" size={10} className="text-slate-300"/>
              {[...cat2].map(c=><span key={c} className="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 font-medium">{c}</span>)}
              <Icon name="ChevronRight" size={10} className="text-slate-300"/>
              <span className={"px-1.5 py-0.5 rounded font-semibold "+((cat3==="Error"||cat3==="오류")?"bg-rose-100 text-rose-700":"bg-slate-200 text-slate-700")}>{cat3}</span>
            </div>
            <div className="relative shrink-0">
              <Icon name="Search" size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"/>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="검색"
                className="h-8 pl-7 pr-6 w-40 rounded-lg border border-slate-200 bg-white text-[12px] outline-none focus:border-blue-400"/>
              {q&&<button onClick={()=>setQ("")} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><Icon name="X" size={11}/></button>}
            </div>
            <span className="text-[11.5px] text-slate-400 tnum shrink-0">{totalCount}건</span>
          </div>
        </div>
      </div>

      {/* 테이블 */}
      <div className="flex-1 overflow-auto px-6 pb-6">
        <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
          {/* ── Robot · 작업 컬럼 ── */}

            <div className="overflow-x-auto">
              <table className="w-full text-[12px] min-w-[1100px]">
                <thead><tr className="text-left border-b border-slate-200 bg-slate-50/40">
                  <th className={thCls+" px-4"}>Fleet</th>
                  <th className={thCls}>Robot ID</th>
                  <th className={thCls}>작업유형</th>
                  <th className={thCls}>상태코드</th>
                  <th className={thCls}>우선순위</th>
                  <th className={thCls}>시작</th>
                  <th className={thCls}>종료</th>
                  <th className={thCls}>취소</th>
                  <th className={thCls}>출발지</th>
                  <th className={thCls}>목적지</th>
                  <th className={thCls}>이동거리</th>
                  <th className={thCls}>배터리 소모</th>
                  <th className={thCls+" pr-4"}>Error Code</th>
                </tr></thead>
                <tbody>
                  {orderFiltered.length===0&&<tr><td colSpan={13} className="px-4 py-12 text-center text-slate-400 text-[12.5px]"><Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>데이터가 없습니다.</td></tr>}
                  {orderFiltered.map((d,i)=>{
                    const f=fleets.find(fl=>fl.name===d.fleet);
                    const isFail=d.statusCode.startsWith("FAIL");
                    return(
                      <tr key={i} className={"border-b border-slate-100 hover:bg-slate-50/60 "+(isFail?"bg-rose-50/20":"")}>
                        <td className={tdCls+" px-4"}>
                          <span className="inline-flex items-center gap-1.5 px-1.5 py-0.5 rounded text-[10.5px] font-medium" style={{background:(f?.color||"#64748b")+"20",color:f?.color||"#64748b"}}>
                            {d.fleet}
                          </span>
                        </td>
                        <td className={tdCls}><span className="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-[11px]">{d.robotId}</span></td>
                        <td className={tdCls}>{d.taskType}</td>
                        <td className={tdCls}>{statusBadge(d.statusCode)}</td>
                        <td className={tdCls}>
                          <span className={"text-[10.5px] font-semibold px-1.5 py-0.5 rounded "+(d.priority==="urgent"?"bg-rose-50 text-rose-700":d.priority==="normal"?"bg-blue-50 text-blue-700":"bg-slate-100 text-slate-600")}>{d.priority}</span>
                        </td>
                        <td className={tdCls+" tnum"}>{d.startAt}</td>
                        <td className={tdCls+" tnum"}>{d.endAt}</td>
                        <td className={tdCls+" tnum text-rose-500"}>{d.cancelAt!=="-"?d.cancelAt:"-"}</td>
                        <td className={tdCls}><span className="font-mono text-[11px]">{d.departure}</span></td>
                        <td className={tdCls}><span className="font-mono text-[11px]">{d.destination}</span></td>
                        <td className={tdCls+" tnum"}>{d.distance}</td>
                        <td className={tdCls+" tnum"}>{d.batteryUsed}</td>
                        <td className={tdCls+" pr-4"}>{d.errorCode!=="-"?<span className="font-mono text-[11px] text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">{d.errorCode}</span>:<span className="text-slate-300">{"—"}</span>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* ── Robot · Error 컬럼 ── */}
          {isRobotError&&(
            <div className="overflow-x-auto">
              <table className="w-full text-[12px] min-w-[1200px]">
                <thead><tr className="text-left border-b border-slate-200 bg-slate-50/40">
                  <th className={thCls+" px-4"}>Fleet</th>
                  <th className={thCls}>Robot ID</th>
                  <th className={thCls}>에러 코드</th>
                  <th className={thCls}>심각도</th>
                  <th className={thCls}>발생 시점</th>
                  <th className={thCls}>해제 시점</th>
                  <th className={thCls}>발생 위치</th>
                  <th className={thCls+" min-w-[200px]"}>에러 메시지</th>
                  <th className={thCls}>조치 상태</th>
                  <th className={thCls}>담당자</th>
                  <th className={thCls+" pr-4"}>연관 작업 ID</th>
                </tr></thead>
                <tbody>
                  {errorFiltered.length===0&&<tr><td colSpan={11} className="px-4 py-12 text-center text-slate-400 text-[12.5px]"><Icon name="SearchX" size={20} className="mx-auto mb-2 text-slate-300"/>데이터가 없습니다.</td></tr>}
                  {errorFiltered.map((d,i)=>{
                    const f=fleets.find(fl=>fl.name===d.fleet);
                    return(
                      <tr key={i} className={"border-b border-slate-100 hover:bg-slate-50/60 "+(d.severity==="Error"?"bg-rose-50/20":d.severity==="Warn"?"bg-amber-50/10":"")}>
                        <td className={tdCls+" px-4"}>
                          <span className="inline-flex items-center gap-1.5 px-1.5 py-0.5 rounded text-[10.5px] font-medium" style={{background:(f?.color||"#64748b")+"20",color:f?.color||"#64748b"}}>
                            {d.fleet}
                          </span>
                        </td>
                        <td className={tdCls}><span className="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-[11px]">{d.robotId}</span></td>
                        <td className={tdCls}><span className="font-mono text-[11px] text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">{d.errorCode}</span></td>
                        <td className={tdCls}>{sevBadge(d.severity)}</td>
                        <td className={tdCls+" tnum"}>{d.occurredAt}</td>
                        <td className={tdCls+" tnum"}>{d.resolvedAt||"-"}</td>
                        <td className={tdCls}><span className="font-mono text-[11px]">{d.location}</span></td>
                        <td className={tdCls+" min-w-[200px] max-w-[280px] whitespace-normal leading-snug"}>{d.message}</td>
                        <td className={tdCls}>{actionBadge(d.actionStatus)}</td>
                        <td className={tdCls}>{d.assignee!=="-"?<span className="font-mono text-[11px]">{d.assignee}</span>:<span className="text-slate-300">{"—"}</span>}</td>
                        <td className={tdCls+" pr-4"}>{d.relatedOrderId!=="-"?<span className="font-mono text-[11px] text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{d.relatedOrderId}</span>:<span className="text-slate-300">{"—"}</span>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* ── Infra 공백 ── */}
          {(isInfraOnly||(hasInfra&&!isRobotOrder&&!isRobotError&&cat3!=="작업"&&cat3!=="Error"))&&(
            <div className="py-20 text-center">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-slate-50 border border-slate-200 grid place-items-center mb-4">
                <Icon name="Server" size={26} className="text-slate-300"/>
              </div>
              <div className="text-[14px] font-semibold text-slate-500">인프라 로그</div>
              <div className="text-[12px] text-slate-400 mt-1.5">준비 중입니다.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
